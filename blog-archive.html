<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Blog Archive — Kristy Flach | Certified Mortgage Advisor</title>
  <style>
    :root {
      --primary: #002F6C;
      --dark: #0b1f3a;
      --accent: #9CB5A0;
      --text: #333333;
      --bg: #F8F9FA;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: url("header-background.jpeg") center/cover no-repeat; z-index: -2;
    }
    body::after {
      content: ""; position: fixed; inset: 0;
      background: rgba(255,255,255,0.55); z-index: -1;
    }

    /* Header */
    .site-header {
      width: 100%; padding: 18px 30px;
      background: rgba(255,255,255,0.65);
      border-bottom: 1px solid #ddd;
      backdrop-filter: blur(6px);
    }
    .nav-container {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1200px; margin: 0 auto; padding: 0 25px;
    }
    .logo img { height: 80px; }
    .back-link {
      text-decoration: none; color: var(--dark); font-weight: 700; font-size: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    .back-link:hover { opacity: 0.75; }

    /* Archive container */
    .archive-container {
      max-width: 1200px; margin: 60px auto 80px auto; padding: 0 20px;
    }

    .archive-header {
      text-align: center; margin-bottom: 50px;
    }
    .archive-header h1 {
      font-size: 36px; font-weight: 700; color: var(--dark); margin: 0 0 10px 0;
    }
    .archive-header p { color: #555; font-size: 16px; margin: 0; }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 30px;
      text-align: left;
    }

    .blog-card {
      background: rgba(255,255,255,0.75);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: transform 0.3s ease;
      border: 1px solid rgba(0,0,0,0.04);
    }
    .blog-card:hover { transform: translateY(-6px); }

    .blog-card img {
      width: 100%; height: 200px; object-fit: cover; display: block;
    }

    .blog-content { padding: 20px; }

    .blog-category {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      color: #6a8d73; font-weight: bold;
    }
    .blog-content h3 { margin: 10px 0; font-size: 20px; color: var(--dark); }
    .blog-content p { color: #555; font-size: 15px; }
    .blog-date { font-size: 12px; color: #aaa; margin-top: 8px; }

    .read-more {
      display: inline-block; margin-top: 15px;
      text-decoration: none; font-weight: bold; color: var(--dark);
    }

    .loading-msg {
      text-align: center; padding: 80px 20px; font-size: 18px; color: #888;
    }

    /* Footer */
    footer {
      background-color: #6e7f77; color: white; padding: 20px 0; width: 100%;
    }
    .footer-content { max-width: 1200px; margin: 0 auto; padding: 0 1rem; text-align: center; }

    @media (max-width: 768px) {
      .archive-header h1 { font-size: 28px; }
      .blog-grid { grid-template-columns: 1fr; }
    }
  </style>
<script src="tracking.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="nav-container">
      <a class="logo" href="index.html" aria-label="Home">
        <img src="CMA Logo.png" alt="CMA Logo">
      </a>
      <a href="index.html#blog" class="back-link"><i class="fas fa-arrow-left"></i> Back to Site</a>
    </div>
  </header>

  <div class="archive-container">
    <div class="archive-header">
      <h1>Blog Archive</h1>
      <p>Education. Strategy. Clarity for smart homeownership decisions.</p>
    </div>

    <div class="blog-grid" id="archiveGrid">
      <div class="loading-msg">Loading posts...</div>
    </div>
  </div>

  <footer>
    <div class="footer-content">
      <p style="font-size: 0.9rem; opacity: 0.8;">© 2026 Kristy Flach. All rights reserved.</p>
    </div>
  </footer>

  <script>
  (function() {
    var defaultImg = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa';

    fetch('https://agent-edge-backend.vercel.app/api/blog-api?action=archive')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var grid = document.getElementById('archiveGrid');
        if (!data.success || !data.posts || data.posts.length === 0) {
          grid.innerHTML = '<div class="loading-msg">No posts yet. Check back soon!</div>';
          return;
        }
        var html = '';
        data.posts.forEach(function(p) {
          var img = p.image_url || defaultImg;
          var date = p.published_at ? new Date(p.published_at).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) : '';
          html += '<article class="blog-card">' +
            '<img src="' + img + '" alt="' + (p.title || '').replace(/"/g,'&quot;') + '">' +
            '<div class="blog-content">' +
            '<span class="blog-category">' + (p.category || 'General') + '</span>' +
            '<h3>' + (p.title || 'Untitled') + '</h3>' +
            '<p>' + (p.summary || '') + '</p>' +
            '<div class="blog-date">' + date + '</div>' +
            '<a href="blog-post.html?slug=' + encodeURIComponent(p.slug) + '" class="read-more">Read More →</a>' +
            '</div></article>';
        });
        grid.innerHTML = html;
      })
      .catch(function() {
        document.getElementById('archiveGrid').innerHTML = '<div class="loading-msg">Error loading posts. <a href="index.html">Return home</a></div>';
      });
  })();
  </script>

</body>
</html>
