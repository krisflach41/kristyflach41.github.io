<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On-Demand Content Studio - Agent Edge</title>

<style>

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 80px 0;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
  line-height: 1.7;
}

.page-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px;
}

.content-section {
  padding: 60px 50px;
  border-radius: 22px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow: 0 20px 55px rgba(0,0,0,0.10), 0 6px 18px rgba(0,0,0,0.05);
}

.page-header {
  text-align: center;
  margin-bottom: 40px;
}

.page-title {
  font-size: 36px;
  margin-bottom: 10px;
  color: #002556;
}

.page-subtitle {
  font-size: 16px;
  color: #555;
  max-width: 700px;
  margin: 0 auto;
  line-height: 1.6;
}

/* Generator form */
.generator-container {
  background: rgba(255,255,255,0.75);
  border: 2px solid rgba(0,37,86,0.2);
  border-radius: 18px;
  padding: 35px;
  margin-bottom: 30px;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 25px;
}

.form-group { margin-bottom: 25px; }

.form-group label {
  display: block;
  font-weight: 600;
  color: #002556;
  margin-bottom: 8px;
  font-size: 14px;
}

.form-group input[type="text"],
.form-group input[type="email"],
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px;
  border: 1px solid rgba(0,37,86,0.25);
  border-radius: 8px;
  font-family: inherit;
  font-size: 14px;
  background: rgba(255,255,255,0.9);
  transition: all 0.3s ease;
  box-sizing: border-box;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
  outline: none;
  border-color: #002556;
  box-shadow: 0 0 0 3px rgba(0,37,86,0.1);
}

.checkbox-group {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

.checkbox-label {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-weight: 500;
  color: #555;
}

.checkbox-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #002556;
}

.generate-btn {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #002556, #003d82);
  color: white;
  font-weight: 700;
  font-size: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-top: 10px;
  font-family: inherit;
}

.generate-btn:hover:not(:disabled) {
  background: linear-gradient(135deg, #003d82, #002556);
  transform: translateY(-2px);
  box-shadow: 0 8px 25px rgba(0,37,86,0.4);
}

.generate-btn:disabled {
  background: #999;
  cursor: not-allowed;
  transform: none;
}

.output-container {
  margin-top: 30px;
  padding: 25px;
  background: rgba(255,255,255,0.9);
  border-radius: 12px;
  border: 2px solid rgba(0,37,86,0.3);
  display: none;
}

.output-container.show { display: block; }

.output-content {
  background: rgba(255,255,255,0.6);
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 15px;
  font-size: 15px;
  line-height: 1.7;
  white-space: pre-wrap;
  color: #333;
}

.output-meta {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: #888;
  margin-bottom: 15px;
}

.copy-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #002556, #003d82);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  font-size: 14px;
  font-family: inherit;
}

.copy-btn:hover {
  background: linear-gradient(135deg, #003d82, #002556);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,37,86,0.3);
}

.copy-btn.copied {
  background: rgba(0,37,86,0.25);
  color: #002556;
}

.error-message {
  background: rgba(244,67,54,0.1);
  border-left: 3px solid #f44336;
  padding: 15px;
  border-radius: 6px;
  margin-top: 15px;
  color: #c62828;
  display: none;
}

.error-message.show { display: block; }

.back-link {
  text-align: center;
  margin-top: 40px;
}

.back-link a {
  display: inline-block;
  padding: 12px 28px;
  border-radius: 25px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.6);
  text-decoration: none;
  color: #0b1f3a;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.25s ease;
}

.back-link a:hover {
  background: rgba(255,255,255,0.55);
  transform: translateY(-2px);
}

@media (max-width: 768px) {
  .content-section { padding: 40px 25px; }
  .page-title { font-size: 28px; }
  .form-row { grid-template-columns: 1fr; }
  .generator-container { padding: 25px 20px; }
}

</style>
</head>

<body>
<div class="page-wrap">
  <div class="content-section">

    <header class="page-header">
      <h1 class="page-title">On-Demand Content Studio</h1>
      <p class="page-subtitle">AI-powered custom social media posts created in seconds. Choose your topic, tone, and platform.</p>
    </header>

    <div class="generator-container">
      <form id="generatorForm">

        <div class="form-row">
          <div class="form-group">
            <label for="userName">Your Name *</label>
            <input type="text" id="userName" placeholder="e.g., Sarah Johnson" required>
          </div>
          <div class="form-group">
            <label for="userEmail">Your Email *</label>
            <input type="email" id="userEmail" placeholder="e.g., sarah@realtyco.com" required>
          </div>
        </div>

        <div class="form-group">
          <label for="topic">Topic or Subject *</label>
          <input type="text" id="topic" placeholder="e.g., Spring housing market, First-time buyer tips, Open house announcement" required>
        </div>

        <div class="form-group">
          <label for="goal">Post Goal *</label>
          <select id="goal" required>
            <option value="">Select a goal...</option>
            <option value="engagement">Engagement (likes, comments, shares)</option>
            <option value="education">Education (inform and teach)</option>
            <option value="leadgen">Lead Generation (drive inquiries)</option>
            <option value="brand">Brand Awareness (visibility)</option>
          </select>
        </div>

        <div class="form-group">
          <label>Platform(s) *</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="platform" value="facebook" checked> Facebook</label>
            <label class="checkbox-label"><input type="checkbox" name="platform" value="instagram" checked> Instagram</label>
            <label class="checkbox-label"><input type="checkbox" name="platform" value="linkedin"> LinkedIn</label>
            <label class="checkbox-label"><input type="checkbox" name="platform" value="twitter"> Twitter/X</label>
          </div>
        </div>

        <div class="form-group">
          <label for="tone">Tone *</label>
          <select id="tone" required>
            <option value="">Select a tone...</option>
            <option value="professional">Professional</option>
            <option value="casual">Casual & Friendly</option>
            <option value="fun">Fun & Playful</option>
            <option value="inspirational">Inspirational</option>
          </select>
        </div>

        <div class="form-group">
          <label>Include</label>
          <div class="checkbox-group">
            <label class="checkbox-label"><input type="checkbox" name="include" value="hashtags" checked> Hashtags</label>
            <label class="checkbox-label"><input type="checkbox" name="include" value="emoji" checked> Emojis</label>
            <label class="checkbox-label"><input type="checkbox" name="include" value="cta" checked> Call-to-Action</label>
            <label class="checkbox-label"><input type="checkbox" name="include" value="question"> Question for Engagement</label>
          </div>
        </div>

        <div class="form-group">
          <label for="length">Post Length *</label>
          <select id="length" required>
            <option value="">Select length...</option>
            <option value="short">Short (1-2 sentences)</option>
            <option value="medium">Medium (3-4 sentences)</option>
            <option value="long">Long (5+ sentences)</option>
          </select>
        </div>

        <button type="submit" class="generate-btn" id="generateBtn">✨ Generate Post</button>
      </form>

      <div class="error-message" id="errorMessage"></div>

      <div class="output-container" id="outputContainer">
        <h3 style="color: #002556; margin-top: 0;">Your Generated Post:</h3>
        <div class="output-content" id="outputContent"></div>
        <div class="output-meta" id="outputMeta"></div>
        <button class="copy-btn" id="copyGeneratedBtn">📋 Copy Post</button>
      </div>
    </div>

    <div class="back-link">
      <a href="messaging-collection.html">← Back to Messaging Collection</a>
    </div>

  </div>
</div>

<script src="tracking.js"></script>
<script src="feature-gate.js"></script>
<script>
// Auto-fill name and email from login session
document.addEventListener('DOMContentLoaded', function() {
  autoFillUserInfo('userName', 'userEmail');
});

// AI Generator with CRM Tracking
var generatorForm = document.getElementById('generatorForm');
var generateBtn = document.getElementById('generateBtn');
var outputContainer = document.getElementById('outputContainer');
var outputContent = document.getElementById('outputContent');
var outputMeta = document.getElementById('outputMeta');
var errorMessage = document.getElementById('errorMessage');
var generatedPost = '';

generatorForm.addEventListener('submit', async function(e) {
  e.preventDefault();

  // Check usage limit for trial users (5 free)
  if (typeof checkUsageLimit === 'function' && !checkUsageLimit('on-demand', 5)) return;

  var userName = document.getElementById('userName').value;
  var userEmail = document.getElementById('userEmail').value;
  var topic = document.getElementById('topic').value;
  var goal = document.getElementById('goal').value;
  var tone = document.getElementById('tone').value;
  var length = document.getElementById('length').value;

  var platforms = Array.from(document.querySelectorAll('input[name="platform"]:checked')).map(function(cb) { return cb.value; });
  var includes = Array.from(document.querySelectorAll('input[name="include"]:checked')).map(function(cb) { return cb.value; });

  if (platforms.length === 0) {
    alert('Please select at least one platform!');
    return;
  }

  generateBtn.disabled = true;
  generateBtn.textContent = '✨ Generating...';
  errorMessage.classList.remove('show');
  outputContainer.classList.remove('show');

  try {
    var response = await fetch('https://agent-edge-backend.vercel.app/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userName: userName, userEmail: userEmail, topic: topic, goal: goal, platforms: platforms, tone: tone, includes: includes, length: length })
    });

    var data = await response.json();

    if (!data.success) {
      throw new Error(data.message || 'Failed to generate post');
    }

    generatedPost = data.post;
    outputContent.textContent = generatedPost;

    // Track: Generated Post
    trackActivity('Messaging', 'On-Demand', 'Generated Post', 'Topic: ' + topic + ' | Goal: ' + goal);
    var charCount = generatedPost.length;
    outputMeta.innerHTML = '<span>📊 ' + charCount + ' characters</span><span>Platforms: ' + platforms.join(', ') + '</span>';
    outputContainer.classList.add('show');
    outputContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  } catch (error) {
    console.error('Error:', error);
    errorMessage.textContent = 'Error: ' + error.message + '. Please try again or contact support if the issue persists.';
    errorMessage.classList.add('show');
  } finally {
    generateBtn.disabled = false;
    generateBtn.textContent = '✨ Generate Post';
  }
});

document.getElementById('copyGeneratedBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(generatedPost).then(function() {
    var btn = document.getElementById('copyGeneratedBtn');
    var original = btn.innerHTML;
    btn.innerHTML = '✓ Copied!';
    btn.classList.add('copied');
    setTimeout(function() {
      btn.innerHTML = original;
      btn.classList.remove('copied');
    }, 2000);
  });
});
</script>

</body>
</html>
