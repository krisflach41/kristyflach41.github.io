<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pipeline Board - Mission Control</title>
<script src="auth.js"></script>

<style>
* { box-sizing: border-box; }

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 20px 20px 80px;
  min-height: 100vh;
  background: linear-gradient(135deg, #0b1f3a 0%, #132d54 50%, #0b1f3a 100%);
  color: #e8ecf1;
}

/* ===== HEADER ===== */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding: 0 4px;
}

.header-left h1 {
  font-size: 24px;
  font-weight: 700;
  color: #fff;
  margin: 0 0 2px 0;
}

.header-left p {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
  margin: 0;
}

.header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
}

.header-btn {
  padding: 9px 18px;
  border-radius: 8px;
  border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.7);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: 0.2s ease;
}

.header-btn:hover {
  background: rgba(255,255,255,0.12);
  color: #fff;
}

.header-btn.primary {
  background: rgba(52,152,219,0.2);
  border-color: rgba(52,152,219,0.3);
  color: #3498db;
}

.header-btn.primary:hover {
  background: rgba(52,152,219,0.35);
  color: #5dade2;
}

/* ===== PIPELINE STATS ===== */
.pipeline-stats {
  display: flex;
  gap: 20px;
  margin-bottom: 18px;
  padding: 0 4px;
}

.pipe-stat {
  font-size: 12px;
  color: rgba(255,255,255,0.4);
}

.pipe-stat strong {
  color: #fff;
  font-size: 16px;
  margin-right: 4px;
}

/* ===== BOARD ===== */
.board {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 20px;
  min-height: calc(100vh - 200px);
}

.board::-webkit-scrollbar {
  height: 8px;
}

.board::-webkit-scrollbar-track {
  background: rgba(255,255,255,0.03);
  border-radius: 4px;
}

.board::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
}

/* ===== COLUMNS ===== */
.column {
  min-width: 260px;
  max-width: 260px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 200px);
}

.column.drag-over {
  background: rgba(52,152,219,0.08);
  border-color: rgba(52,152,219,0.25);
}

.col-header {
  padding: 14px 14px 10px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.col-title {
  font-size: 13px;
  font-weight: 700;
  color: rgba(255,255,255,0.8);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.col-count {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.5);
}

.col-body {
  padding: 10px;
  overflow-y: auto;
  flex: 1;
}

.col-body::-webkit-scrollbar {
  width: 4px;
}

.col-body::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,0.08);
  border-radius: 2px;
}

/* ===== CARDS ===== */
.card {
  padding: 14px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 8px;
  cursor: grab;
  transition: 0.2s ease;
  position: relative;
}

.card:active {
  cursor: grabbing;
}

.card:hover {
  background: rgba(255,255,255,0.09);
  border-color: rgba(255,255,255,0.14);
}

.card.dragging {
  opacity: 0.4;
  transform: rotate(2deg);
}

.card-name {
  font-size: 14px;
  font-weight: 600;
  color: #fff;
  margin-bottom: 4px;
}

.card-detail {
  font-size: 11px;
  color: rgba(255,255,255,0.4);
  margin-bottom: 2px;
}

.card-source {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 700;
  margin-top: 6px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.source-webinar { background: rgba(155,89,182,0.15); color: #9b59b6; }
.source-social { background: rgba(52,152,219,0.15); color: #3498db; }
.source-organic { background: rgba(39,174,96,0.15); color: #27ae60; }
.source-realtor { background: rgba(230,126,34,0.15); color: #e67e22; }
.source-referral { background: rgba(241,196,15,0.15); color: #f1c40f; }
.source-other { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.5); }

.card-date {
  font-size: 10px;
  color: rgba(255,255,255,0.25);
  margin-top: 6px;
}

.card-actions {
  position: absolute;
  top: 8px;
  right: 8px;
  display: none;
  gap: 4px;
}

.card:hover .card-actions {
  display: flex;
}

.card-action-btn {
  width: 22px;
  height: 22px;
  border-radius: 4px;
  background: rgba(255,255,255,0.08);
  border: none;
  color: rgba(255,255,255,0.5);
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.card-action-btn:hover {
  background: rgba(255,255,255,0.15);
  color: #fff;
}

/* Column color accents */
.col-cold .col-header { border-bottom-color: rgba(52,152,219,0.3); }
.col-warm .col-header { border-bottom-color: rgba(230,126,34,0.3); }
.col-active .col-header { border-bottom-color: rgba(39,174,96,0.3); }
.col-credit .col-header { border-bottom-color: rgba(155,89,182,0.3); }
.col-preapproval .col-header { border-bottom-color: rgba(241,196,15,0.3); }
.col-preapproved .col-header { border-bottom-color: rgba(46,204,113,0.3); }
.col-ratewatch .col-header { border-bottom-color: rgba(52,73,94,0.5); }
.col-underwriting .col-header { border-bottom-color: rgba(26,188,156,0.3); }
.col-closed .col-header { border-bottom-color: rgba(39,174,96,0.5); }
.col-dead .col-header { border-bottom-color: rgba(192,57,43,0.3); }

/* ===== ADD CARD BUTTON ===== */
.add-card-btn {
  width: 100%;
  padding: 8px;
  border: 1px dashed rgba(255,255,255,0.1);
  border-radius: 6px;
  background: transparent;
  color: rgba(255,255,255,0.3);
  font-size: 12px;
  cursor: pointer;
  transition: 0.2s ease;
  margin-top: 4px;
}

.add-card-btn:hover {
  border-color: rgba(255,255,255,0.2);
  color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.03);
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10000;
}

.modal-overlay.active {
  display: flex;
}

.modal {
  width: 90%;
  max-width: 480px;
  background: #1a2d4a;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px;
  padding: 30px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.5);
}

.modal h2 {
  font-size: 20px;
  color: #fff;
  margin: 0 0 20px 0;
}

.modal label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: rgba(255,255,255,0.5);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.modal input,
.modal select,
.modal textarea {
  width: 100%;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: #e8ecf1;
  font-size: 14px;
  font-family: inherit;
  margin-bottom: 16px;
}

.modal input:focus,
.modal select:focus,
.modal textarea:focus {
  outline: none;
  border-color: rgba(52,152,219,0.4);
  background: rgba(255,255,255,0.08);
}

.modal textarea {
  height: 70px;
  resize: vertical;
}

.modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 6px;
}

.modal-actions button {
  flex: 1;
  padding: 11px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  border: none;
  transition: 0.2s ease;
}

.btn-save {
  background: rgba(52,152,219,0.2);
  color: #3498db;
}

.btn-save:hover {
  background: rgba(52,152,219,0.35);
}

.btn-cancel {
  background: rgba(255,255,255,0.06);
  color: rgba(255,255,255,0.5);
}

.btn-cancel:hover {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8);
}

.btn-delete {
  background: rgba(192,57,43,0.15);
  color: #c0392b;
  flex: 0.5;
}

.btn-delete:hover {
  background: rgba(192,57,43,0.3);
}

/* ===== RETURN LINK ===== */
.return-link {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 18px;
  border-radius: 25px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.12);
  text-decoration: none;
  color: rgba(255,255,255,0.6);
  font-weight: 600;
  font-size: 13px;
  transition: 0.25s ease;
  z-index: 100;
}

.return-link:hover {
  background: rgba(255,255,255,0.14);
  color: #fff;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="page-header">
  <div class="header-left">
    <h1>Loan Lifecycle Pipeline</h1>
    <p>Drag cards between stages to update status</p>
  </div>
  <div class="header-actions">
    <span class="pipe-stat"><strong id="totalContacts">0</strong> contacts</span>
    <button class="header-btn primary" onclick="openAddModal()">+ Add Contact</button>
    <button class="header-btn" onclick="exportPipeline()">Export</button>
  </div>
</div>

<!-- BOARD -->
<div class="board" id="board"></div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add Contact</h2>
    
    <label>Full Name *</label>
    <input type="text" id="contactName" placeholder="Jane Smith">
    
    <label>Phone</label>
    <input type="tel" id="contactPhone" placeholder="(555) 123-4567">
    
    <label>Email</label>
    <input type="email" id="contactEmail" placeholder="jane@email.com">
    
    <label>Lead Source</label>
    <select id="contactSource">
      <option value="organic">Organic</option>
      <option value="webinar">Webinar</option>
      <option value="social">Social Media Ad</option>
      <option value="realtor">Realtor Partner</option>
      <option value="referral">Referral</option>
      <option value="other">Other</option>
    </select>
    
    <label>Pipeline Stage</label>
    <select id="contactStage">
      <option value="cold">Cold Leads</option>
      <option value="warm">Warm Leads</option>
      <option value="active">Active Conversations</option>
      <option value="credit">Credit Repair</option>
      <option value="preapproval">Engaged in Pre-Approval</option>
      <option value="preapproved">Pre Approved</option>
      <option value="ratewatch">Rate Watch</option>
      <option value="underwriting">In Underwriting</option>
      <option value="closed">Closed - Funded</option>
      <option value="dead">Dead Leads</option>
    </select>
    
    <label>Notes</label>
    <textarea id="contactNotes" placeholder="Any relevant details..."></textarea>
    
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-delete" id="deleteBtn" style="display:none;" onclick="deleteContact()">Delete</button>
      <button class="btn-save" onclick="saveContact()">Save</button>
    </div>
  </div>
</div>

<a href="admin.html" class="return-link">← Back to Mission Control</a>

<script>
// Protect page
protectPage();
if (sessionStorage.getItem('agentEdgeAdmin') !== 'true') {
  window.location.href = 'portal.html';
}

// Pipeline columns config
var columns = [
  { id: 'cold', title: 'Cold Leads', cssClass: 'col-cold' },
  { id: 'warm', title: 'Warm Leads', cssClass: 'col-warm' },
  { id: 'active', title: 'Active Conversations', cssClass: 'col-active' },
  { id: 'credit', title: 'Credit Repair', cssClass: 'col-credit' },
  { id: 'preapproval', title: 'Pre-Approval', cssClass: 'col-preapproval' },
  { id: 'preapproved', title: 'Pre Approved', cssClass: 'col-preapproved' },
  { id: 'ratewatch', title: 'Rate Watch', cssClass: 'col-ratewatch' },
  { id: 'underwriting', title: 'Underwriting', cssClass: 'col-underwriting' },
  { id: 'closed', title: 'Closed - Funded', cssClass: 'col-closed' },
  { id: 'dead', title: 'Dead Leads', cssClass: 'col-dead' }
];

var sourceLabels = {
  webinar: 'Webinar',
  social: 'Social Ad',
  organic: 'Organic',
  realtor: 'Realtor',
  referral: 'Referral',
  other: 'Other'
};

// Contact data - stored in localStorage
var contacts = JSON.parse(localStorage.getItem('pipelineContacts') || '[]');
var editingId = null;
var draggedCard = null;

// Build the board
function buildBoard() {
  var board = document.getElementById('board');
  board.innerHTML = '';
  
  columns.forEach(function(col) {
    var colContacts = contacts.filter(function(c) { return c.stage === col.id; });
    
    var colEl = document.createElement('div');
    colEl.className = 'column ' + col.cssClass;
    colEl.dataset.stage = col.id;
    
    colEl.innerHTML = 
      '<div class="col-header">' +
        '<span class="col-title">' + col.title + '</span>' +
        '<span class="col-count">' + colContacts.length + '</span>' +
      '</div>' +
      '<div class="col-body" data-stage="' + col.id + '"></div>';
    
    board.appendChild(colEl);
    
    var body = colEl.querySelector('.col-body');
    
    // Add cards
    colContacts.forEach(function(contact) {
      body.appendChild(createCardElement(contact));
    });
    
    // Add "add" button
    var addBtn = document.createElement('button');
    addBtn.className = 'add-card-btn';
    addBtn.textContent = '+ Add';
    addBtn.onclick = function() { openAddModal(col.id); };
    body.appendChild(addBtn);
    
    // Drag events on column body
    body.addEventListener('dragover', function(e) {
      e.preventDefault();
      colEl.classList.add('drag-over');
    });
    
    body.addEventListener('dragleave', function(e) {
      if (!colEl.contains(e.relatedTarget)) {
        colEl.classList.remove('drag-over');
      }
    });
    
    body.addEventListener('drop', function(e) {
      e.preventDefault();
      colEl.classList.remove('drag-over');
      
      if (draggedCard) {
        var contactId = draggedCard.dataset.contactId;
        var contact = contacts.find(function(c) { return c.id === contactId; });
        if (contact) {
          contact.stage = col.id;
          contact.updatedAt = new Date().toISOString();
          saveData();
          buildBoard();
        }
      }
    });
  });
  
  updateStats();
}

function createCardElement(contact) {
  var card = document.createElement('div');
  card.className = 'card';
  card.draggable = true;
  card.dataset.contactId = contact.id;
  
  var sourceClass = 'source-' + (contact.source || 'other');
  var sourceLabel = sourceLabels[contact.source] || 'Other';
  
  var dateStr = '';
  if (contact.createdAt) {
    var d = new Date(contact.createdAt);
    dateStr = (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear();
  }
  
  card.innerHTML = 
    '<div class="card-actions">' +
      '<button class="card-action-btn" onclick="openEditModal(\'' + contact.id + '\')" title="Edit">✎</button>' +
    '</div>' +
    '<div class="card-name">' + (contact.name || 'Unknown') + '</div>' +
    (contact.phone ? '<div class="card-detail">' + contact.phone + '</div>' : '') +
    (contact.email ? '<div class="card-detail">' + contact.email + '</div>' : '') +
    (contact.notes ? '<div class="card-detail" style="margin-top:4px; font-style:italic; color:rgba(255,255,255,0.3);">' + truncate(contact.notes, 60) + '</div>' : '') +
    '<span class="card-source ' + sourceClass + '">' + sourceLabel + '</span>' +
    (dateStr ? '<div class="card-date">Added ' + dateStr + '</div>' : '');
  
  // Drag events
  card.addEventListener('dragstart', function(e) {
    draggedCard = card;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
  });
  
  card.addEventListener('dragend', function() {
    card.classList.remove('dragging');
    draggedCard = null;
    document.querySelectorAll('.column').forEach(function(c) {
      c.classList.remove('drag-over');
    });
  });
  
  return card;
}

function truncate(str, len) {
  return str.length > len ? str.substring(0, len) + '...' : str;
}

function updateStats() {
  document.getElementById('totalContacts').textContent = contacts.length;
}

// Modal functions
function openAddModal(stage) {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'Add Contact';
  document.getElementById('contactName').value = '';
  document.getElementById('contactPhone').value = '';
  document.getElementById('contactEmail').value = '';
  document.getElementById('contactSource').value = 'organic';
  document.getElementById('contactStage').value = stage || 'cold';
  document.getElementById('contactNotes').value = '';
  document.getElementById('deleteBtn').style.display = 'none';
  document.getElementById('modalOverlay').classList.add('active');
}

function openEditModal(id) {
  var contact = contacts.find(function(c) { return c.id === id; });
  if (!contact) return;
  
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Contact';
  document.getElementById('contactName').value = contact.name || '';
  document.getElementById('contactPhone').value = contact.phone || '';
  document.getElementById('contactEmail').value = contact.email || '';
  document.getElementById('contactSource').value = contact.source || 'other';
  document.getElementById('contactStage').value = contact.stage || 'cold';
  document.getElementById('contactNotes').value = contact.notes || '';
  document.getElementById('deleteBtn').style.display = 'block';
  document.getElementById('modalOverlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  editingId = null;
}

function saveContact() {
  var name = document.getElementById('contactName').value.trim();
  if (!name) {
    document.getElementById('contactName').style.borderColor = '#c0392b';
    return;
  }
  
  if (editingId) {
    // Update existing
    var contact = contacts.find(function(c) { return c.id === editingId; });
    if (contact) {
      contact.name = name;
      contact.phone = document.getElementById('contactPhone').value.trim();
      contact.email = document.getElementById('contactEmail').value.trim();
      contact.source = document.getElementById('contactSource').value;
      contact.stage = document.getElementById('contactStage').value;
      contact.notes = document.getElementById('contactNotes').value.trim();
      contact.updatedAt = new Date().toISOString();
    }
  } else {
    // New contact
    contacts.push({
      id: 'c-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4),
      name: name,
      phone: document.getElementById('contactPhone').value.trim(),
      email: document.getElementById('contactEmail').value.trim(),
      source: document.getElementById('contactSource').value,
      stage: document.getElementById('contactStage').value,
      notes: document.getElementById('contactNotes').value.trim(),
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    });
  }
  
  saveData();
  closeModal();
  buildBoard();
}

function deleteContact() {
  if (!editingId) return;
  if (!confirm('Remove this contact from the pipeline?')) return;
  
  contacts = contacts.filter(function(c) { return c.id !== editingId; });
  saveData();
  closeModal();
  buildBoard();
}

function saveData() {
  localStorage.setItem('pipelineContacts', JSON.stringify(contacts));
}

function exportPipeline() {
  var csv = 'Name,Phone,Email,Source,Stage,Notes,Created,Updated\n';
  contacts.forEach(function(c) {
    var stageName = columns.find(function(col) { return col.id === c.stage; });
    csv += '"' + (c.name || '') + '","' + (c.phone || '') + '","' + (c.email || '') + '","' +
           (sourceLabels[c.source] || '') + '","' + (stageName ? stageName.title : '') + '","' +
           (c.notes || '').replace(/"/g, '""') + '","' + (c.createdAt || '') + '","' + (c.updatedAt || '') + '"\n';
  });
  
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'pipeline-export-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
  URL.revokeObjectURL(url);
}

// Close modal on overlay click
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// Close on Escape
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeModal();
});

// Build it
buildBoard();
</script>

</body>
</html>
