<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="600">
<title>Market Summary</title>
<style>
/* ===== BACKGROUND MATCHES PORTAL ===== */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 80px 0;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
}
/* ===== CENTERED CONTENT WIDTH ===== */
.page-wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 24px;
}
/* ===== FROSTED GLASS CONTAINER ===== */
.brief-card {
  border-radius: 22px;
  padding: 60px 50px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 20px 55px rgba(0,0,0,0.10),
    0 6px 18px rgba(0,0,0,0.05);
}
/* ===== TYPOGRAPHY ===== */
h1 {
  font-size: 36px;
  margin-bottom: 25px;
}
h2 {
  margin-top: 35px;
  font-size: 20px;
}
p {
  line-height: 1.7;
  margin-bottom: 18px;
  font-size: 15px;
}
/* ===== BACK LINK BUTTON ===== */
.back-link {
  display: inline-block;
  margin-top: 40px;
  text-decoration: none;
  font-weight: 600;
  color: white;
  background: #0b4ea2;
  padding: 8px 16px;
  border-radius: 20px;
}
</style>
<script src="tracking.js"></script>
<script src="feature-gate.js"></script>
</head>
<body>
<div class="page-wrap">
  <div class="brief-card">
    <h1>Market Summary – <span id="briefDate"></span></h1>
    
    <!-- DYNAMIC CONTENT LOADED FROM JSON -->
    <div id="marketContent">
      <p>Loading market summary...</p>
    </div>
    
    <a href="portal.html" class="back-link">← Back to Agent Edge Portal</a>
  </div>
</div>

<script>
// Load briefing data from Supabase
window.addEventListener('load', function() {
  fetch('https://agent-edge-backend.vercel.app/api/briefing')
    .then(function(r) { return r.json(); })
    .then(function(briefingData) {
      // Update date
      if (briefingData.lastUpdated) {
        var date = new Date(briefingData.lastUpdated);
        document.getElementById('briefDate').textContent = date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
      } else {
        document.getElementById('briefDate').textContent = new Date().toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
      }
      
      // Load market summary content
      var contentDiv = document.getElementById('marketContent');
      
      if (briefingData.marketSummary) {
        var formatted = formatTextToHTML(briefingData.marketSummary);
        contentDiv.innerHTML = formatted;
      } else {
        contentDiv.innerHTML = '<p>No market summary available. Please update from the admin page.</p>';
      }
    })
    .catch(function(err) {
      console.error('Failed to load briefing:', err);
      document.getElementById('marketContent').innerHTML = '<p>Unable to load market summary. Please try again later.</p>';
    });
});

// Helper function to format text into HTML
function formatTextToHTML(text) {
  var sections = text.split(/\n\n+/);
  var html = '';
  
  sections.forEach(function(section) {
    section = section.trim();
    if (!section) return;
    
    if (section.match(/^[A-Z\s&–—]+$/) || section.match(/^[A-Z][a-zA-Z\s&]+:/)) {
      html += '<h2>' + section.replace(/:$/, '') + '</h2>';
    } else {
      html += '<p>' + section.replace(/\n/g, '<br>') + '</p>';
    }
  });
  
  return html;
}
</script>
</body>
</html>
