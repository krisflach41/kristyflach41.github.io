<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rent to Wealth</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #07090e;
  --surface: #0d1117;
  --surface-raised: #131920;
  --border: rgba(255,255,255,0.05);
  --border-gold: rgba(186,163,112,0.18);
  --gold: #baa370;
  --gold-bright: #d4bc7c;
  --gold-dim: rgba(186,163,112,0.4);
  --green: #5ebc8a;
  --green-dark: #4aad78;
  --green-bg: rgba(94,188,138,0.06);
  --red: #d97373;
  --red-bg: rgba(217,115,115,0.06);
  --blue: #6ba3d6;
  --blue-btn: #3b82f6;
  --purple: #9b8ec4;
  --amber: #d4a953;
  --text: #e8e4dc;
  --text-mid: rgba(232,228,220,0.6);
  --text-dim: rgba(232,228,220,0.3);
  --text-faint: rgba(232,228,220,0.15);
  --navy: #0a1628;
  --navy-mid: #0f2035;
}

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ===== GENERATOR FORM ===== */
.generator-panel {
  max-width: 560px;
  margin: 30px auto;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 28px;
}
.gen-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
.gen-sub { font-size: 11px; color: rgba(255,255,255,0.4); margin-bottom: 20px; }
.gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.gen-field { display: flex; flex-direction: column; gap: 3px; }
.gen-field.full { grid-column: 1 / -1; }
.gen-field label {
  font-size: 9px; font-weight: 700; color: rgba(255,255,255,0.35);
  text-transform: uppercase; letter-spacing: 0.5px;
}
.gen-field input, .gen-field select {
  padding: 8px 10px; border-radius: 7px;
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-size: 13px; font-family: inherit;
}
.gen-field select option { background: #0f2035; color: #fff; }
.gen-field input:focus, .gen-field select:focus { outline: none; border-color: rgba(59,130,246,0.4); }
.gen-field input::placeholder { color: rgba(255,255,255,0.2); }
.gen-section {
  font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.25);
  text-transform: uppercase; letter-spacing: 1px;
  margin: 16px 0 6px; grid-column: 1 / -1;
  padding-top: 12px; border-top: 1px solid rgba(255,255,255,0.06);
}
.gen-actions { display: flex; gap: 8px; margin-top: 18px; }
.gen-btn {
  padding: 10px 20px; border-radius: 8px; border: none;
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.15s;
}
.gen-btn.primary { background: var(--blue-btn); color: #fff; flex: 1; }
.gen-btn.primary:hover { background: #2563eb; }
.gen-btn:disabled { opacity: 0.5; cursor: wait; }
.gen-check { display: flex; align-items: center; gap: 8px; grid-column: 1 / -1; }
.gen-check input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--blue-btn); }
.gen-check label { font-size: 12px; color: rgba(255,255,255,0.5); cursor: pointer; }
.gen-hint { font-size: 9px; color: rgba(255,255,255,0.2); grid-column: 1 / -1; margin-top: -4px; }
.gen-error { color: var(--red); font-size: 12px; text-align: center; margin-top: 10px; display: none; }

/* ===== REPORT OUTPUT ===== */
.report-container { display: none; max-width: 1060px; margin: 20px auto; }

.report-nav {
  display: flex; gap: 10px; justify-content: center; margin: 16px auto 12px; max-width: 1060px;
}
.report-nav a, .report-nav button {
  padding: 10px 20px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6);
  font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: 0.15s;
  text-decoration: none;
}
.report-nav a:hover, .report-nav button:hover { background: rgba(255,255,255,0.1); color: #fff; }
.report-nav button.primary { background: var(--blue-btn); border-color: var(--blue-btn); color: #fff; }

.report-page {
  background: var(--surface); color: var(--text); overflow: hidden; border: 1px solid var(--border-gold);
}

/* ===== HERO ===== */
.rpt-hero { padding: 52px 64px 48px; border-bottom: 1px solid var(--border); position: relative; }
.rpt-hero::after { content:''; position:absolute; bottom:0; left:64px; right:64px; height:1px; background:linear-gradient(90deg,transparent,var(--gold-dim),transparent); }
.rpt-hero-label { font-size:10px; font-weight:600; letter-spacing:2.5px; color:var(--gold); text-transform:uppercase; margin-bottom:14px; }
.rpt-hero-title { font-family:'Playfair Display',serif; font-size:20px; font-weight:600; color:var(--text-mid); line-height:1.35; margin-bottom:6px; }
.rpt-hero-sub { font-size:13px; color:var(--text-dim); margin-bottom:20px; }
.rpt-hero-punchline { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--gold); margin-bottom:10px; }
.rpt-hero-headline { font-size:15px; color:var(--text-mid); line-height:1.6; max-width:820px; }
.rpt-hero-headline .accent { color:var(--text); font-weight:600; }

/* KPI strip */
.rpt-kpi-strip { display:grid; grid-template-columns:repeat(4,1fr); border-bottom:1px solid var(--border); }
.rpt-kpi { padding:22px 24px; border-right:1px solid var(--border); text-align:center; }
.rpt-kpi:last-child { border-right:none; }
.rpt-kpi-label { font-size:9px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:6px; }
.rpt-kpi-value { font-family:'Playfair Display',serif; font-size:22px; font-weight:700; color:var(--text); }
.rpt-kpi-value.green { color:var(--green); }
.rpt-kpi-detail { font-size:10px; color:var(--text-dim); margin-top:3px; }

/* ===== SECTIONS ===== */
.rpt-section { padding:40px 64px; border-bottom:1px solid var(--border); }
.rpt-section-title { font-family:'Playfair Display',serif; font-size:18px; font-weight:600; color:var(--text); margin-bottom:6px; position:relative; padding-bottom:16px; }
.rpt-section-title::after { content:''; position:absolute; bottom:0; left:0; width:40px; height:2px; background:linear-gradient(90deg,var(--gold),var(--gold-dim)); border-radius:1px; }
.rpt-section-intro { font-size:13px; color:var(--text-mid); line-height:1.65; margin-top:14px; max-width:780px; }

/* Monthly comparison */
.monthly-comparison { display:grid; grid-template-columns:1fr auto 1fr; gap:0; align-items:center; margin-top:28px; margin-bottom:28px; }
.monthly-col { text-align:center; padding:24px; border-radius:8px; }
.monthly-col.rent { background:var(--red-bg); border:1px solid rgba(217,115,115,0.1); }
.monthly-col.buy { background:var(--green-bg); border:1px solid rgba(94,188,138,0.1); }
.monthly-col-label { font-size:9px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; }
.monthly-col-amount { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--text); }
.monthly-col-detail { font-size:10px; color:var(--text-dim); margin-top:4px; line-height:1.5; }
.monthly-vs { width:46px; height:46px; border-radius:50%; background:rgba(255,255,255,0.04); border:1px solid var(--border); color:var(--text-dim); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; margin:0 16px; }
.monthly-gap-callout { text-align:center; padding:14px 20px; border-radius:8px; background:rgba(186,163,112,0.04); border:1px solid rgba(186,163,112,0.1); margin-bottom:28px; }
.monthly-gap-callout .gap-amount { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; color:var(--gold); }
.monthly-gap-callout .gap-text { font-size:12px; color:var(--text-mid); margin-top:2px; }
.crossover-canvas { width:100%; height:220px; }
.crossover-callout { text-align:center; margin-top:14px; font-size:13px; color:var(--text-mid); line-height:1.5; }
.crossover-callout strong { color:var(--green); }

/* Equity bars */
.equity-bar-wrap { display:flex; gap:16px; margin-top:24px; }
.equity-bar-col { flex:1; text-align:center; }
.equity-bar-year-label { font-size:9px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.equity-bar-container { height:140px; display:flex; align-items:flex-end; justify-content:center; gap:6px; }
.equity-bar { width:44px; border-radius:4px 4px 0 0; min-height:4px; }
.equity-bar.rent-bar { background:linear-gradient(to top,rgba(217,115,115,0.6),rgba(217,115,115,0.3)); }
.equity-bar.own-bar { background:linear-gradient(to top,rgba(94,188,138,0.7),rgba(94,188,138,0.4)); }
.equity-bar-value { font-size:10px; font-weight:600; margin-top:6px; }
.equity-bar-sub { font-size:9px; color:var(--text-faint); margin-top:2px; }
.equity-bar-legend { display:flex; justify-content:center; gap:24px; margin-top:16px; }
.equity-bar-legend-item { display:flex; align-items:center; gap:6px; font-size:10px; color:var(--text-dim); }
.equity-bar-legend-dot { width:10px; height:10px; border-radius:2px; }

.philosophy-block { margin-top:24px; padding:24px 28px; border-radius:8px; background:linear-gradient(135deg,rgba(186,163,112,0.04) 0%,rgba(186,163,112,0.01) 100%); border:1px solid rgba(186,163,112,0.12); }
.philosophy-title { font-family:'Playfair Display',serif; font-size:15px; font-weight:600; color:var(--gold); margin-bottom:10px; }
.philosophy-text { font-size:13px; color:var(--text-mid); line-height:1.7; }
.philosophy-text strong { color:var(--text); font-weight:600; }

/* Appreciation ladder */
.appreciation-ladder { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:24px; }
.appr-step { text-align:center; padding:18px 10px; border-radius:8px; background:var(--surface-raised); border:1px solid var(--border); }
.appr-step.highlight { background:rgba(94,188,138,0.04); border-color:rgba(94,188,138,0.15); }
.appr-step-year { font-size:9px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
.appr-step-value { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; color:var(--text); }
.appr-step.highlight .appr-step-value { color:var(--green); }
.appr-step-gain { font-size:10px; color:var(--green); font-weight:600; margin-top:4px; }
.appr-callout { margin-top:20px; padding:18px 24px; border-radius:8px; background:rgba(94,188,138,0.04); border:1px solid rgba(94,188,138,0.1); text-align:center; }
.appr-callout-big { font-family:'Playfair Display',serif; font-size:26px; font-weight:700; color:var(--green); }
.appr-callout-text { font-size:12px; color:var(--text-mid); margin-top:4px; line-height:1.5; }
.appr-source { font-size:9px; color:var(--text-faint); margin-top:14px; text-align:right; }

/* Scoreboard */
.scoreboard { margin-top:24px; }
.score-row { display:grid; grid-template-columns:220px 1fr 2fr; gap:0; padding:14px 0; border-bottom:1px solid var(--border); align-items:center; }
.score-row.total-row { border-bottom:none; padding-top:18px; margin-top:4px; border-top:2px solid var(--border-gold); }
.score-label { font-size:13px; font-weight:600; color:var(--text); }
.score-row.total-row .score-label { font-family:'Playfair Display',serif; font-size:16px; color:var(--green); }
.score-amount { font-family:'Playfair Display',serif; font-size:18px; font-weight:700; text-align:right; padding-right:24px; }
.score-amount.positive { color:var(--green); }
.score-amount.negative { color:var(--red); }
.score-amount.total { font-size:24px; color:var(--green); }
.score-explain { font-size:11px; color:var(--text-dim); line-height:1.4; padding-left:24px; border-left:1px solid var(--border); }

/* Tax bonus */
.tax-bonus { padding:32px 64px; border-bottom:1px solid var(--border); background:linear-gradient(135deg,rgba(107,163,214,0.04) 0%,rgba(107,163,214,0.01) 100%); }
.tax-bonus-title { font-family:'Playfair Display',serif; font-size:18px; font-weight:600; color:var(--blue); margin-bottom:12px; }
.tax-bonus-text { font-size:13px; color:var(--text-mid); line-height:1.7; max-width:800px; }
.tax-bonus-text strong { color:var(--text); font-weight:600; }
.tax-bonus-numbers { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:18px; margin-bottom:14px; }
.tax-bonus-stat { padding:16px 20px; border-radius:8px; background:rgba(107,163,214,0.06); border:1px solid rgba(107,163,214,0.1); text-align:center; }
.tax-bonus-stat-label { font-size:9px; font-weight:600; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; margin-bottom:4px; }
.tax-bonus-stat-value { font-family:'Playfair Display',serif; font-size:20px; font-weight:700; color:var(--blue); }
.tax-bonus-disclaimer { font-size:10px; color:var(--text-faint); font-style:italic; }

/* Year-by-year table */
.rpt-table { width:100%; border-collapse:collapse; }
.rpt-table thead th { padding:10px 12px; text-align:left; font-size:8px; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:1px; border-bottom:1px solid var(--border-gold); background:var(--surface-raised); }
.rpt-table thead th:not(:first-child) { text-align:right; }
.rpt-table tbody td { padding:10px 12px; font-size:12px; color:var(--text-mid); border-bottom:1px solid var(--border); }
.rpt-table tbody td:first-child { font-weight:600; color:var(--text); }
.rpt-table tbody td:not(:first-child) { text-align:right; font-variant-numeric:tabular-nums; }
.rpt-table tbody tr:hover { background:rgba(255,255,255,0.02); }
.rpt-table tbody td.positive { color:var(--green); font-weight:600; }
.rpt-table tbody td.negative { color:var(--red); font-weight:600; }

/* Footer */
.rpt-footer { background:var(--surface-raised); padding:28px 64px; border-top:1px solid var(--border); }
.footer-standard { display:flex; justify-content:space-between; align-items:center; gap:30px; }
.footer-your-info { display:flex; align-items:center; gap:16px; flex:1; }
.footer-headshot { width:64px; height:64px; border-radius:50%; object-fit:cover; border:1px solid var(--border-gold); flex-shrink:0; }
.footer-initials { width:44px; height:44px; border-radius:50%; background:var(--surface); border:1px solid var(--border-gold); color:var(--gold); font-family:'Playfair Display',serif; font-size:22px; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.footer-details { line-height:1.5; }
.footer-name { font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px; }
.footer-credentials { font-size:10px; color:var(--text-dim); line-height:1.5; }
.footer-logos { display:flex; gap:15px; align-items:center; flex-shrink:0; }
.footer-logo { height:45px; width:auto; object-fit:contain; }
.footer-cobrand { display:flex; align-items:center; gap:0; }
.footer-person { display:flex; align-items:center; gap:14px; flex:1; padding:0 20px; }
.footer-person:first-child { padding-left:0; }
.footer-person:last-child { padding-right:0; }
.footer-divider { width:1px; height:50px; background:var(--border); flex-shrink:0; }
.footer-company-bar { margin-top:16px; padding-top:14px; border-top:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
.footer-company-bar .footer-company-name { font-size:10px; font-weight:600; color:var(--text-mid); }
.footer-company-bar .footer-company-sub { font-size:9px; color:var(--text-dim); }

.rpt-disclosures { background:var(--bg); padding:14px 64px; font-size:7.5px; color:var(--text-faint); line-height:1.7; text-align:center; border-top:1px solid var(--border); max-width:1060px; margin:0 auto; }
.rpt-disc-logos { display:flex; justify-content:center; gap:24px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.03); }
.rpt-disc-logos span { font-size:8px; font-weight:700; color:var(--text-faint); letter-spacing:1px; text-transform:uppercase; }

/* Co-brand layout picker */
.layout-picker-box { flex:1; border:2px solid rgba(255,255,255,0.1); border-radius:8px; padding:12px; cursor:pointer; transition:0.2s; }
.layout-picker-box:hover { border-color:rgba(59,130,246,0.3); }
.layout-picker-box.selected { border-color:rgba(59,130,246,0.6); background:rgba(59,130,246,0.08); }

/* Loading spinner */
.gen-loading { display:none; text-align:center; margin-top:12px; color:var(--text-mid); font-size:13px; }
.gen-loading .spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.1); border-top-color:var(--blue-btn); border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px; vertical-align:middle; }
@keyframes spin { to { transform:rotate(360deg); } }

/* ===== PRINT ===== */
@media print {
  body { background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .generator-panel, .report-nav { display:none !important; }
  .report-container { display:block !important; margin:0; max-width:100%; }
  .rpt-footer, .rpt-disclosures, .tax-bonus, .report-page { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .rpt-hero { padding:24px 40px 20px; }
  .rpt-section { padding:20px 40px; }
  .tax-bonus { padding:20px 40px; }
  .rpt-kpi { padding:14px 16px; }
  .rpt-kpi-value { font-size:16px; }
  .rpt-footer { padding:18px 40px; }
  .rpt-disclosures { padding:8px 40px 12px; }
  @page { margin:0.25in; size:letter; }
}
</style>
<script src="tracking.js"></script>
<script src="feature-gate.js"></script>
</head>
<body>

<!-- ===== GENERATOR FORM ===== -->
<div class="generator-panel" id="generatorPanel">
  <div class="gen-title">Rent to Wealth</div>
  <div class="gen-sub">Own vs Rent: The Wealth Advantage — generate a branded wealth comparison showing the financial advantage of buying over renting</div>

  <div class="gen-grid">
    <div class="gen-section">Client Info</div>
    <div class="gen-field full">
      <label>Client Name</label>
      <input type="text" id="inp_clientName" placeholder="Susie Homebuyer">
    </div>

    <div class="gen-section">Property Details</div>
    <div class="gen-field full">
      <label>Property Address or ZIP Code</label>
      <input type="text" id="inp_address" placeholder="123 Main St, Anytown, OH 45001">
    </div>
    <div class="gen-field">
      <label>Purchase Price</label>
      <input type="text" id="inp_purchasePrice" placeholder="359,900" oninput="formatCurrency(this)">
    </div>
    <div class="gen-field">
      <label>Current Monthly Rent</label>
      <input type="text" id="inp_monthlyRent" placeholder="2,856" oninput="formatCurrency(this)">
    </div>

    <div class="gen-section">Loan Details</div>
    <div class="gen-field">
      <label>Down Payment (%)</label>
      <input type="text" id="inp_downPct" placeholder="10" value="10">
    </div>
    <div class="gen-field">
      <label>Interest Rate (%)</label>
      <input type="text" id="inp_rate" placeholder="6.25">
    </div>
    <div class="gen-field">
      <label>Loan Term</label>
      <select id="inp_term">
        <option value="30">30 years</option>
        <option value="25">25 years</option>
        <option value="20">20 years</option>
        <option value="15">15 years</option>
      </select>
    </div>
    <div class="gen-field">
      <label>Analysis Period (Years)</label>
      <select id="inp_period">
        <option value="5">5 years</option>
        <option value="7">7 years</option>
        <option value="9" selected>9 years</option>
        <option value="10">10 years</option>
        <option value="15">15 years</option>
      </select>
    </div>

    <div class="gen-section">Co-Branding (Optional)</div>
    <div class="gen-check">
      <input type="checkbox" id="inp_cobrand" onchange="toggleCobrand()">
      <label for="inp_cobrand">Include Realtor Co-Branding</label>
    </div>

    <div id="cobrandFields" style="display:none; grid-column:1/-1;">
      <div style="margin-bottom:14px;">
        <label style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:8px;">Choose Layout</label>
        <div style="display:flex;gap:10px;" id="layoutPicker">
          <div class="layout-picker-box selected" id="layoutLeft" onclick="pickLayout('left')" style="flex:1;text-align:center;">
            <div style="font-size:8px;font-weight:700;color:var(--blue-btn);">Realtor Left</div>
          </div>
          <div class="layout-picker-box" id="layoutRight" onclick="pickLayout('right')" style="flex:1;text-align:center;">
            <div style="font-size:8px;font-weight:700;color:rgba(255,255,255,0.3);">Realtor Right</div>
          </div>
        </div>
      </div>
      <div class="gen-grid" style="gap:10px;">
        <div class="gen-field"><label>Realtor Name</label><input type="text" id="inp_realtorName" placeholder="Jane Agent"></div>
        <div class="gen-field"><label>Brokerage</label><input type="text" id="inp_realtorBrokerage" placeholder="Keller Williams"></div>
        <div class="gen-field"><label>Realtor Phone</label><input type="text" id="inp_realtorPhone" placeholder="(555) 123-4567"></div>
        <div class="gen-field"><label>Realtor Email</label><input type="text" id="inp_realtorEmail" placeholder="jane@kw.com"></div>
      </div>
    </div>
  </div>

  <div class="gen-error" id="genError"></div>
  <div class="gen-loading" id="genLoading"><span class="spinner"></span>Fetching live market data...</div>
  <div class="gen-actions">
    <button class="gen-btn primary" id="genBtn" onclick="generateReport()">Generate Report</button>
  </div>
</div>

<!-- ===== REPORT OUTPUT ===== -->
<div class="report-container" id="reportContainer">
  <div class="report-nav" id="reportNav">
    <a href="mission-control.html#reports">← Partner Portal</a>
    <button onclick="editReport()">✏️ Edit Report</button>
    <button class="primary" onclick="window.print()">📄 Export PDF</button>
  </div>

  <div class="report-page" id="reportPage">
    <div id="rptHero"></div>
    <div id="rptKpiStrip"></div>
    <div id="rptMonthly"></div>
    <div id="rptEquity"></div>
    <div id="rptAppreciation"></div>
    <div id="rptScoreboard"></div>
    <div id="rptTaxBonus"></div>
    <div id="rptYearByYear"></div>
    <div class="rpt-footer" id="rptFooter"></div>
    <div class="rpt-disclosures" id="rptDisclosures"></div>
  </div>
</div>

<script>
/* ===== HELPERS ===== */
function formatCurrency(el) {
  var val = el.value.replace(/[^0-9]/g, '');
  if (val) el.value = parseInt(val).toLocaleString();
}
function parseCurrency(str) { return parseFloat((str || '0').replace(/[^0-9.]/g, '')) || 0; }
function fmtMoney(n) { return '$' + Math.round(n).toLocaleString(); }
function fmtMoneyK(n) { return n >= 1000 ? '$' + (n/1000).toFixed(0) + 'k' : fmtMoney(n); }

function toggleCobrand() {
  document.getElementById('cobrandFields').style.display = document.getElementById('inp_cobrand').checked ? 'block' : 'none';
}

var cobrandLayout = 'left';
function pickLayout(side) {
  cobrandLayout = side;
  var L = document.getElementById('layoutLeft'), R = document.getElementById('layoutRight');
  if (side === 'left') { L.classList.add('selected'); R.classList.remove('selected'); }
  else { R.classList.add('selected'); L.classList.remove('selected'); }
}

function editReport() {
  document.getElementById('generatorPanel').style.display = 'block';
  document.getElementById('reportContainer').style.display = 'none';
}

function showError(msg) {
  var el = document.getElementById('genError');
  el.textContent = msg; el.style.display = 'block';
}
function hideError() { document.getElementById('genError').style.display = 'none'; }

/* ===== AMORTIZATION MATH ===== */
function calcAmortization(principal, annualRate, termYears) {
  var mr = annualRate / 100 / 12;
  var n = termYears * 12;
  var mp = mr === 0 ? principal / n : principal * (mr * Math.pow(1 + mr, n)) / (Math.pow(1 + mr, n) - 1);
  var bal = principal, totalInt = 0;
  var yearlyEquity = [];
  var yearlyInterest = [];
  var yInt = 0;

  for (var i = 1; i <= n; i++) {
    var ip = bal * mr;
    var pp = mp - ip;
    bal -= pp;
    if (bal < 0) bal = 0;
    totalInt += ip;
    yInt += ip;
    if (i % 12 === 0) {
      yearlyEquity.push(principal - bal);
      yearlyInterest.push(yInt);
      yInt = 0;
    }
  }
  return { monthlyPI: mp, yearlyEquity: yearlyEquity, yearlyInterest: yearlyInterest, totalInterest: totalInt };
}

/* ===== GENERATE REPORT ===== */
async function generateReport() {
  hideError();

  // Gather inputs
  var clientName = document.getElementById('inp_clientName').value.trim() || 'Valued Client';
  var addressInput = document.getElementById('inp_address').value.trim();
  var purchasePrice = parseCurrency(document.getElementById('inp_purchasePrice').value);
  var monthlyRent = parseCurrency(document.getElementById('inp_monthlyRent').value);
  var downPct = parseFloat(document.getElementById('inp_downPct').value) || 10;
  var rate = parseFloat(document.getElementById('inp_rate').value) || 0;
  var termYears = parseInt(document.getElementById('inp_term').value) || 30;
  var periodYears = parseInt(document.getElementById('inp_period').value) || 9;

  // Validate
  if (!addressInput) { showError('Please enter a property address or ZIP code.'); return; }
  if (purchasePrice < 10000) { showError('Please enter a valid purchase price.'); return; }
  if (monthlyRent < 100) { showError('Please enter a valid current monthly rent.'); return; }
  if (rate <= 0 || rate > 15) { showError('Please enter a valid interest rate.'); return; }

  // Extract ZIP from address
  var zipMatch = addressInput.match(/\b(\d{5})\b/);
  var zip = zipMatch ? zipMatch[1] : '';

  // Show loading
  document.getElementById('genLoading').style.display = 'block';
  document.getElementById('genBtn').disabled = true;

  // Fetch live data
  var apiData = null;
  try {
    var apiUrl = 'https://agent-edge-backend.vercel.app/api/buy-vs-rent?';
    if (zip) apiUrl += 'zip=' + zip + '&';
    apiUrl += 'address=' + encodeURIComponent(addressInput);
    var resp = await fetch(apiUrl);
    if (resp.ok) apiData = await resp.json();
  } catch (e) {
    console.error('API error:', e);
  }

  document.getElementById('genLoading').style.display = 'none';
  document.getElementById('genBtn').disabled = false;

  // Extract live data (with fallbacks)
  var appreciationRate = 3.5; // fallback
  var stateName = '';
  var apprSource = 'FHFA House Price Index via FRED';
  var displayAddress = addressInput;

  if (apiData) {
    if (apiData.appreciation) {
      // Use 1-year rate (most current) first, fall back to 5-year average
      appreciationRate = apiData.appreciation.oneYear || apiData.appreciation.fiveYear || apiData.appreciation.forecastAnnualRate || 3.5;
    }
    if (apiData.location) {
      stateName = apiData.location.stateName || apiData.location.state || '';
      if (apiData.location.formattedAddress) displayAddress = apiData.location.formattedAddress;
    }
    if (apiData.appreciation && apiData.appreciation._source) {
      apprSource = apiData.appreciation._source;
    }
  }

  // ===== ALL CALCULATIONS =====
  var downPayment = purchasePrice * (downPct / 100);
  var loanAmount = purchasePrice - downPayment;
  var amort = calcAmortization(loanAmount, rate, termYears);
  var monthlyPI = amort.monthlyPI;

  // Estimated monthly taxes + insurance (property tax 1.5%, insurance 0.35% annually)
  var propTaxRate = 0.015;
  var insuranceRate = 0.0035;
  var monthlyTax = (purchasePrice * propTaxRate) / 12;
  var monthlyInsurance = (purchasePrice * insuranceRate) / 12;
  var totalMonthlyMortgage = monthlyPI + monthlyTax + monthlyInsurance;

  // Rent escalation — use 5.79% national average (or could be sourced from HUD year-over-year)
  var rentGrowthRate = 0.0579;

  // Monthly gap
  var monthlyGap = totalMonthlyMortgage - monthlyRent;

  // Build year-by-year data
  var yearData = [];
  var cumulativeRent = 0;
  var cumulativeMortgage = 0;
  var crossoverYear = -1;

  for (var y = 1; y <= periodYears; y++) {
    var rentThisYear = monthlyRent * Math.pow(1 + rentGrowthRate, y - 1);
    var annualRent = rentThisYear * 12;
    var annualMortgage = totalMonthlyMortgage * 12;
    cumulativeRent += annualRent;
    cumulativeMortgage += annualMortgage;

    var homeValue = purchasePrice * Math.pow(1 + appreciationRate / 100, y);
    var equityBuilt = (y <= amort.yearlyEquity.length) ? amort.yearlyEquity[y - 1] : loanAmount;
    var appreciationGain = homeValue - purchasePrice;

    // Check crossover
    if (crossoverYear < 0 && rentThisYear >= totalMonthlyMortgage) {
      // Interpolate
      var prevRent = monthlyRent * Math.pow(1 + rentGrowthRate, y - 2);
      var frac = (totalMonthlyMortgage - prevRent) / (rentThisYear - prevRent);
      crossoverYear = (y - 1) + frac;
    }

    yearData.push({
      year: y,
      monthlyRent: Math.round(rentThisYear),
      monthlyMortgage: Math.round(totalMonthlyMortgage),
      monthlyDiff: Math.round(rentThisYear - totalMonthlyMortgage),
      equityBuilt: Math.round(equityBuilt),
      homeValue: Math.round(homeValue),
      appreciationGain: Math.round(appreciationGain),
      cumulativeRent: Math.round(cumulativeRent),
      cumulativeMortgage: Math.round(cumulativeMortgage)
    });
  }

  var lastYear = yearData[periodYears - 1];

  // Scoreboard calculations
  var totalAppreciationGain = lastYear.appreciationGain;
  var totalEquityBuilt = lastYear.equityBuilt;

  // Rent savings = cumulative rent - cumulative mortgage (positive if rent total > mortgage total)
  var rentSavings = lastYear.cumulativeRent - lastYear.cumulativeMortgage;

  // Closing costs (2% of purchase)
  var closingCosts = purchasePrice * 0.02;

  // Selling costs (5% of projected value)
  var sellingCosts = lastYear.homeValue * 0.05;

  // Down payment opportunity cost (7% annual return)
  var dpOpportunityCost = downPayment * (Math.pow(1.07, periodYears) - 1);

  // Net wealth gain
  var netWealthGain = totalAppreciationGain + totalEquityBuilt + rentSavings - closingCosts - sellingCosts - dpOpportunityCost;

  // Tax deduction amounts
  var totalInterestPaid = 0;
  for (var y = 0; y < periodYears && y < amort.yearlyInterest.length; y++) {
    totalInterestPaid += amort.yearlyInterest[y];
  }
  var totalPropertyTaxPaid = purchasePrice * propTaxRate * periodYears;

  // Last year rent vs mortgage comparison
  var lastRent = lastYear.monthlyRent;
  var rentExcessAtEnd = lastRent - Math.round(totalMonthlyMortgage);

  // ===== RENDER REPORT =====
  var today = new Date();
  var dateStr = today.toLocaleDateString('en-US', { year:'numeric', month:'long', day:'numeric' });

  // SECTION 1: HERO
  document.getElementById('rptHero').innerHTML =
    '<div class="rpt-hero">' +
      '<div class="rpt-hero-label">Rent to Wealth</div>' +
      '<div style="font-size:12px;color:var(--text-dim);margin-bottom:16px;letter-spacing:0.5px;">Own vs Rent: The Wealth Advantage</div>' +
      '<div class="rpt-hero-title">' + displayAddress + '</div>' +
      '<div class="rpt-hero-sub">Prepared for ' + clientName + ' · ' + dateStr + '</div>' +
      '<div class="rpt-hero-punchline">Here\'s how you turn ' + fmtMoney(Math.abs(Math.round(monthlyGap))) + '/month into ' + fmtMoney(Math.round(netWealthGain)) + '.</div>' +
      '<div class="rpt-hero-headline">' +
        'Your mortgage payment is <span class="accent">' + fmtMoney(Math.abs(Math.round(monthlyGap))) + '/month ' + (monthlyGap > 0 ? 'more' : 'less') + '</span> than your current rent. ' +
        (monthlyGap > 0 ? 'That small difference is the price of entry into building real, long-term wealth — through equity, appreciation, and a payment that stays flat while rent keeps climbing.' :
        'You\'re already paying less than rent — and building real wealth through equity and appreciation at the same time.') +
      '</div>' +
    '</div>';

  // KPI STRIP
  document.getElementById('rptKpiStrip').innerHTML =
    '<div class="rpt-kpi-strip">' +
      '<div class="rpt-kpi"><div class="rpt-kpi-label">Purchase Price</div><div class="rpt-kpi-value">' + fmtMoney(purchasePrice) + '</div></div>' +
      '<div class="rpt-kpi"><div class="rpt-kpi-label">Current Rent</div><div class="rpt-kpi-value">' + fmtMoney(monthlyRent) + '</div><div class="rpt-kpi-detail">/month</div></div>' +
      '<div class="rpt-kpi"><div class="rpt-kpi-label">Est. Mortgage Payment</div><div class="rpt-kpi-value">' + fmtMoney(Math.round(totalMonthlyMortgage)) + '</div><div class="rpt-kpi-detail">P&I + Tax + Insurance</div></div>' +
      '<div class="rpt-kpi"><div class="rpt-kpi-label">' + periodYears + '-Year Net Wealth Gain</div><div class="rpt-kpi-value green">' + fmtMoney(Math.round(netWealthGain)) + '</div><div class="rpt-kpi-detail">from buying vs renting</div></div>' +
    '</div>';

  // SECTION 2: MONTHLY REALITY CHECK
  var crossoverText = '';
  if (crossoverYear > 0) {
    crossoverText = 'By <strong>Year ' + Math.ceil(crossoverYear) + '</strong>, your rent would exceed your mortgage payment. By Year ' + periodYears + ', you\'d be paying <strong>' + fmtMoney(rentExcessAtEnd) + '/month more</strong> to rent than to own.';
  } else if (monthlyGap <= 0) {
    crossoverText = 'Your mortgage is <strong>already less than rent</strong> — and the gap only grows as rent keeps climbing.';
  } else {
    crossoverText = 'Over ' + periodYears + ' years, rising rent costs dramatically increase, while your mortgage stays fixed.';
  }

  document.getElementById('rptMonthly').innerHTML =
    '<div class="rpt-section">' +
      '<div class="rpt-section-title">The Monthly Reality Check</div>' +
      '<div class="rpt-section-intro">Yes, buying costs more per month right now. But rent never stays the same — it goes up every year. Your fixed-rate mortgage payment? It stays flat. Here\'s how the math plays out.</div>' +
      '<div class="monthly-comparison">' +
        '<div class="monthly-col rent"><div class="monthly-col-label">Current Monthly Rent</div><div class="monthly-col-amount">' + fmtMoney(monthlyRent) + '</div><div class="monthly-col-detail">Increases every year<br>Based on ' + (rentGrowthRate * 100).toFixed(2) + '% avg</div></div>' +
        '<div class="monthly-vs">VS</div>' +
        '<div class="monthly-col buy"><div class="monthly-col-label">Est. Monthly Mortgage</div><div class="monthly-col-amount">' + fmtMoney(Math.round(totalMonthlyMortgage)) + '</div><div class="monthly-col-detail">Fixed for ' + termYears + ' years<br>P&I + Tax + Insurance</div></div>' +
      '</div>' +
      '<div class="monthly-gap-callout"><div class="gap-amount">' + fmtMoney(Math.abs(Math.round(monthlyGap))) + '/mo ' + (monthlyGap > 0 ? 'more to buy today' : 'less to buy today') + '</div><div class="gap-text">' + (monthlyGap > 0 ? 'But that gap disappears — and reverses. Watch what happens to rent.' : 'You\'re already saving — and it only gets better.') + '</div></div>' +
      '<canvas id="crossoverChart" class="crossover-canvas" height="220"></canvas>' +
      '<div class="crossover-callout">' + crossoverText + '</div>' +
    '</div>';

  // SECTION 3: EQUITY / FINANCIAL TOOL
  var yr1 = yearData[0], yr5 = yearData[Math.min(4, periodYears - 1)], yrLast = lastYear;
  var maxRentPaid = yrLast.cumulativeRent;

  document.getElementById('rptEquity').innerHTML =
    '<div class="rpt-section">' +
      '<div class="rpt-section-title">A Mortgage Isn\'t Just a Payment — It\'s a Financial Tool</div>' +
      '<div class="rpt-section-intro">Every month, a portion of your mortgage goes directly into equity — money that belongs to you. Think of it as a built-in savings plan that grows in two ways: through your monthly payments building equity, and through your home\'s appreciation building value.</div>' +
      '<div class="equity-bar-wrap">' +
        buildEquityBar('After Year 1', yr1.cumulativeRent, yr1.equityBuilt, maxRentPaid) +
        (periodYears >= 5 ? buildEquityBar('After Year 5', yr5.cumulativeRent, yr5.equityBuilt, maxRentPaid) : '') +
        buildEquityBar('After Year ' + periodYears, yrLast.cumulativeRent, yrLast.equityBuilt, maxRentPaid) +
      '</div>' +
      '<div class="equity-bar-legend">' +
        '<div class="equity-bar-legend-item"><div class="equity-bar-legend-dot" style="background:rgba(217,115,115,0.6);"></div>Rent paid (money gone forever)</div>' +
        '<div class="equity-bar-legend-item"><div class="equity-bar-legend-dot" style="background:rgba(94,188,138,0.7);"></div>Equity built (money that\'s yours)</div>' +
      '</div>' +
      '<div class="philosophy-block">' +
        '<div class="philosophy-title">"A mortgage is a wealth-building plan disguised as a monthly payment."</div>' +
        '<div class="philosophy-text">A renter makes payments too. After ' + periodYears + ' years, they have a stack of receipts — <strong>' + fmtMoney(yrLast.cumulativeRent) + ' spent with nothing to show for it</strong>. As a homeowner, you\'ll have <strong>' + fmtMoney(yrLast.equityBuilt) + ' in equity</strong> from your payments alone — plus another <strong>' + fmtMoney(totalAppreciationGain) + ' in appreciation</strong> working for you in the background while you simply live your life.<br><br>That\'s the difference between a transaction and a strategy.</div>' +
      '</div>' +
    '</div>';

  // SECTION 4: APPRECIATION
  var apprSteps = [
    { label: 'Purchase', value: purchasePrice, gain: 0 },
    { label: 'Year 1', value: yearData[0].homeValue, gain: yearData[0].appreciationGain }
  ];
  if (periodYears >= 3) apprSteps.push({ label: 'Year 3', value: yearData[2].homeValue, gain: yearData[2].appreciationGain });
  if (periodYears >= 5) apprSteps.push({ label: 'Year 5', value: yearData[4].homeValue, gain: yearData[4].appreciationGain });
  apprSteps.push({ label: 'Year ' + periodYears, value: yrLast.homeValue, gain: yrLast.appreciationGain, highlight: true });
  // Limit to 5 steps
  if (apprSteps.length > 5) apprSteps = [apprSteps[0], apprSteps[1], apprSteps[apprSteps.length - 3], apprSteps[apprSteps.length - 2], apprSteps[apprSteps.length - 1]];

  var apprHTML = '';
  apprSteps.forEach(function(s) {
    apprHTML += '<div class="appr-step' + (s.highlight ? ' highlight' : '') + '">' +
      '<div class="appr-step-year">' + s.label + '</div>' +
      '<div class="appr-step-value">' + fmtMoney(s.value) + '</div>' +
      '<div class="appr-step-gain">' + (s.gain > 0 ? '+' + fmtMoney(s.gain) : '&nbsp;') + '</div></div>';
  });

  document.getElementById('rptAppreciation').innerHTML =
    '<div class="rpt-section">' +
      '<div class="rpt-section-title">Your Home\'s Projected Value</div>' +
      '<div class="rpt-section-intro">Based on historical appreciation data for ' + (stateName || 'your state') + ', your home is projected to grow in value year over year. This isn\'t speculation — it\'s based on the FHFA House Price Index, the same data used by federal regulators and economists.</div>' +
      '<div class="appreciation-ladder">' + apprHTML + '</div>' +
      '<div class="appr-callout"><div class="appr-callout-big">+' + fmtMoney(totalAppreciationGain) + '</div><div class="appr-callout-text">Based on ' + appreciationRate.toFixed(2) + '% current annual appreciation for ' + (stateName || 'your area') + ', your ' + fmtMoney(purchasePrice) + ' home<br>could be worth ' + fmtMoney(yrLast.homeValue) + ' in ' + periodYears + ' years — that\'s ' + fmtMoney(totalAppreciationGain) + ' in appreciation gain.</div></div>' +
      '<div class="appr-source">Source: ' + apprSource + ' — ' + (stateName || 'State') + ' 1-year rate: ' + appreciationRate.toFixed(2) + '%</div>' +
    '</div>';

  // SECTION 5: SCOREBOARD
  document.getElementById('rptScoreboard').innerHTML =
    '<div class="rpt-section">' +
      '<div class="rpt-section-title">The Full Wealth Picture</div>' +
      '<div class="rpt-section-intro">Here\'s every dollar working for and against you over ' + periodYears + ' years, in plain English.</div>' +
      '<div class="scoreboard">' +
        buildScoreRow('Appreciation Gain', totalAppreciationGain, true, 'Your home grew in value based on ' + (stateName || 'your state') + '\'s historical appreciation rate') +
        buildScoreRow('Equity Built', totalEquityBuilt, true, 'The portion of your mortgage payments that became yours as equity') +
        buildScoreRow('Rent Savings', rentSavings, rentSavings >= 0, rentSavings >= 0 ? 'What you\'d have spent on rising rent above your fixed mortgage payment over ' + periodYears + ' years' : 'Additional cost of your mortgage vs rent during the early years') +
        buildScoreRow('Closing Costs', -closingCosts, false, 'One-time cost to purchase (estimated at 2% of purchase price)') +
        buildScoreRow('Est. Selling Costs', -sellingCosts, false, 'If you sold at projected value (estimated at 5% of future home value)') +
        buildScoreRow('Down Payment Opportunity Cost', -dpOpportunityCost, false, 'If you invested your down payment in the stock market instead of buying, it could have earned this much — and buying <em>still</em> comes out ahead by ' + fmtMoney(Math.round(netWealthGain))) +
        '<div class="score-row total-row">' +
          '<div class="score-label">Net Wealth Gain from Buying</div>' +
          '<div class="score-amount total">+' + fmtMoney(Math.round(netWealthGain)) + '</div>' +
          '<div class="score-explain" style="font-weight:600;color:var(--green);font-size:12px;">Your total financial advantage of buying vs. renting over ' + periodYears + ' years</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  // SECTION 6: TAX BONUS
  var totalDeductible = Math.round(totalInterestPaid + totalPropertyTaxPaid);
  document.getElementById('rptTaxBonus').innerHTML =
    '<div class="tax-bonus">' +
      '<div class="tax-bonus-title">And that\'s before your tax savings.</div>' +
      '<div class="tax-bonus-text">As a homeowner, you may be able to deduct your mortgage interest and property taxes when you file your taxes — money a renter can never write off. Over the first ' + periodYears + ' years of your loan, your potentially tax-deductible expenses add up to:</div>' +
      '<div class="tax-bonus-numbers">' +
        '<div class="tax-bonus-stat"><div class="tax-bonus-stat-label">Deductible Mortgage Interest</div><div class="tax-bonus-stat-value">' + fmtMoney(Math.round(totalInterestPaid)) + '</div></div>' +
        '<div class="tax-bonus-stat"><div class="tax-bonus-stat-label">Deductible Property Taxes</div><div class="tax-bonus-stat-value">' + fmtMoney(Math.round(totalPropertyTaxPaid)) + '</div></div>' +
      '</div>' +
      '<div class="tax-bonus-text">That\'s over <strong>' + fmtMoney(totalDeductible) + ' in potential deductions</strong> that could lower your tax bill every single year. The wealth advantage above doesn\'t even include these savings — meaning your true benefit of buying could be <strong>even greater than ' + fmtMoney(Math.round(netWealthGain)) + '</strong>.</div>' +
      '<div class="tax-bonus-disclaimer">Tax situations are unique. Consult a tax professional for advice specific to your filing status and income.</div>' +
    '</div>';

  // SECTION 7: YEAR-BY-YEAR TABLE
  var tableRows = '';
  yearData.forEach(function(d) {
    var diffClass = d.monthlyDiff >= 0 ? 'positive' : 'negative';
    var diffSign = d.monthlyDiff >= 0 ? '−' : '+';
    var diffVal = Math.abs(d.monthlyDiff);
    tableRows += '<tr>' +
      '<td>' + d.year + '</td>' +
      '<td>' + fmtMoney(d.monthlyRent) + '</td>' +
      '<td>' + fmtMoney(d.monthlyMortgage) + '</td>' +
      '<td class="' + diffClass + '">' + diffSign + fmtMoney(diffVal) + '</td>' +
      '<td>' + fmtMoney(d.equityBuilt) + '</td>' +
      '<td>' + fmtMoney(d.homeValue) + '</td>' +
      '<td class="positive">+' + fmtMoney(Math.round(d.appreciationGain + d.equityBuilt)) + '</td>' +
    '</tr>';
  });

  document.getElementById('rptYearByYear').innerHTML =
    '<div class="rpt-section">' +
      '<div class="rpt-section-title">Year-by-Year Breakdown</div>' +
      '<div style="margin-top:20px; overflow-x:auto;">' +
        '<table class="rpt-table"><thead><tr>' +
          '<th>Year</th><th>Monthly Rent</th><th>Monthly Mortgage</th><th>Monthly Difference</th><th>Equity Built</th><th>Home Value</th><th>Net Wealth Position</th>' +
        '</tr></thead><tbody>' + tableRows + '</tbody></table>' +
      '</div>' +
    '</div>';

  // FOOTER
  buildFooter();

  // DISCLOSURES
  document.getElementById('rptDisclosures').innerHTML =

}

/* ===== EQUITY BAR BUILDER ===== */
function buildEquityBar(label, rentPaid, equityBuilt, maxRent) {
  var maxH = 120;
  var rentH = Math.max(4, Math.round((rentPaid / maxRent) * maxH));
  var eqH = Math.max(4, Math.round((equityBuilt / maxRent) * maxH));
  return '<div class="equity-bar-col">' +
    '<div class="equity-bar-year-label">' + label + '</div>' +
    '<div class="equity-bar-container">' +
      '<div class="equity-bar rent-bar" style="height:' + rentH + 'px;"></div>' +
      '<div class="equity-bar own-bar" style="height:' + eqH + 'px;"></div>' +
    '</div>' +
    '<div class="equity-bar-value" style="color:var(--red);">-' + fmtMoney(rentPaid) + '</div>' +
    '<div class="equity-bar-sub">rent paid (gone)</div>' +
    '<div class="equity-bar-value" style="color:var(--green);margin-top:6px;">+' + fmtMoney(equityBuilt) + '</div>' +
    '<div class="equity-bar-sub">equity built (yours)</div>' +
  '</div>';
}

/* ===== SCORE ROW BUILDER ===== */
function buildScoreRow(label, amount, isPositive, explain) {
  var sign = amount >= 0 ? '+' : '−';
  var cls = isPositive ? 'positive' : 'negative';
  return '<div class="score-row">' +
    '<div class="score-label">' + label + '</div>' +
    '<div class="score-amount ' + cls + '">' + sign + fmtMoney(Math.abs(Math.round(amount))) + '</div>' +
    '<div class="score-explain">' + explain + '</div>' +
  '</div>';
}

/* ===== CROSSOVER CHART ===== */
function drawCrossoverChart(baseRent, mortgage, rentRate, years) {
  var canvas = document.getElementById('crossoverChart');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var dpr = window.devicePixelRatio || 1;
  var rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
  var W = rect.width, H = rect.height;

  var rents = [];
  for (var y = 0; y <= years + 1; y++) { rents.push(Math.round(baseRent * Math.pow(1 + rentRate, y))); }

  var padL = 60, padR = 40, padT = 28, padB = 36;
  var cW = W - padL - padR, cH = H - padT - padB;
  var maxVal = Math.max(rents[years + 1], mortgage) * 1.12;
  var minVal = Math.min(baseRent, mortgage) * 0.88;
  var range = maxVal - minVal;

  function xPos(yr) { return padL + (yr / (years + 1)) * cW; }
  function yPos(val) { return padT + cH - ((val - minVal) / range) * cH; }

  // Grid
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  var step = range > 3000 ? 1000 : 500;
  for (var v = Math.ceil(minVal / step) * step; v <= maxVal; v += step) {
    ctx.beginPath(); ctx.moveTo(padL, yPos(v)); ctx.lineTo(W - padR, yPos(v)); ctx.stroke();
    ctx.fillStyle = 'rgba(232,228,220,0.2)'; ctx.font = '10px DM Sans'; ctx.textAlign = 'right';
    ctx.fillText('$' + v.toLocaleString(), padL - 8, yPos(v) + 3);
  }

  // X labels
  ctx.fillStyle = 'rgba(232,228,220,0.25)'; ctx.font = '10px DM Sans'; ctx.textAlign = 'center';
  for (var y = 0; y <= years + 1; y++) { ctx.fillText(y === 0 ? 'Now' : 'Yr ' + y, xPos(y), H - 10); }

  // Mortgage line
  ctx.beginPath(); ctx.strokeStyle = '#5ebc8a'; ctx.lineWidth = 2.5; ctx.setLineDash([]);
  for (var y = 0; y <= years + 1; y++) { y === 0 ? ctx.moveTo(xPos(y), yPos(mortgage)) : ctx.lineTo(xPos(y), yPos(mortgage)); }
  ctx.stroke();

  // Rent line
  ctx.beginPath(); ctx.strokeStyle = '#d97373'; ctx.lineWidth = 2.5;
  for (var y = 0; y <= years + 1; y++) { y === 0 ? ctx.moveTo(xPos(y), yPos(rents[y])) : ctx.lineTo(xPos(y), yPos(rents[y])); }
  ctx.stroke();

  // Crossover
  for (var y = 1; y <= years + 1; y++) {
    if (rents[y] >= mortgage) {
      var prev = rents[y - 1], frac = (mortgage - prev) / (rents[y] - prev);
      var cx = xPos((y - 1) + frac), cy = yPos(mortgage);
      ctx.beginPath(); ctx.strokeStyle = 'rgba(186,163,112,0.35)'; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.moveTo(cx, padT); ctx.lineTo(cx, padT + cH); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fillStyle = '#baa370'; ctx.fill();
      ctx.fillStyle = 'rgba(186,163,112,0.9)'; ctx.font = 'bold 11px DM Sans'; ctx.textAlign = 'center';
      ctx.fillText('Rent exceeds mortgage', cx, padT - 6);
      ctx.font = '10px DM Sans'; ctx.fillText('Year ' + Math.ceil((y - 1) + frac), cx, padT + 8);
      break;
    }
  }

  // Dots
  for (var y = 0; y <= years + 1; y++) {
    ctx.beginPath(); ctx.arc(xPos(y), yPos(rents[y]), 3, 0, Math.PI * 2); ctx.fillStyle = '#d97373'; ctx.fill();
    ctx.beginPath(); ctx.arc(xPos(y), yPos(mortgage), 3, 0, Math.PI * 2); ctx.fillStyle = '#5ebc8a'; ctx.fill();
  }

  // Legend
  var lx = W - padR - 180, ly = padT + 6;
  ctx.beginPath(); ctx.strokeStyle = '#d97373'; ctx.lineWidth = 2.5; ctx.moveTo(lx, ly); ctx.lineTo(lx + 20, ly); ctx.stroke();
  ctx.fillStyle = 'rgba(232,228,220,0.5)'; ctx.font = '10px DM Sans'; ctx.textAlign = 'left'; ctx.fillText('Rent (rising)', lx + 26, ly + 3);
  ctx.beginPath(); ctx.strokeStyle = '#5ebc8a'; ctx.lineWidth = 2.5; ctx.moveTo(lx, ly + 18); ctx.lineTo(lx + 20, ly + 18); ctx.stroke();
  ctx.fillText('Mortgage (fixed)', lx + 26, ly + 21);

  // End labels
  ctx.font = 'bold 11px DM Sans';
  ctx.fillStyle = '#d97373'; ctx.textAlign = 'left'; ctx.fillText('$' + rents[years + 1].toLocaleString(), xPos(years + 1) + 8, yPos(rents[years + 1]) + 4);
  ctx.fillStyle = '#5ebc8a'; ctx.fillText('$' + mortgage.toLocaleString(), xPos(years + 1) + 8, yPos(mortgage) + 4);
}

/* ===== URL PARAMETER PRE-FILL ===== */
(function prefillFromURL() {
  var params = new URLSearchParams(window.location.search);
  if (params.toString() === '') return;

  var clientName = params.get('clientName') || params.get('client') || '';
  if (clientName) document.getElementById('inp_clientName').value = decodeURIComponent(clientName);

  var address = params.get('address') || '';
  if (address) document.getElementById('inp_address').value = decodeURIComponent(address);

  var purchase = params.get('purchase') || params.get('purchasePrice') || '';
  if (purchase) { var n = parseFloat(purchase.replace(/[^0-9.]/g, '')); if (n) document.getElementById('inp_purchasePrice').value = Math.round(n).toLocaleString(); }

  var rent = params.get('rent') || params.get('monthlyRent') || '';
  if (rent) { var n = parseFloat(rent.replace(/[^0-9.]/g, '')); if (n) document.getElementById('inp_monthlyRent').value = Math.round(n).toLocaleString(); }

  var downPct = params.get('downPct') || params.get('down') || '';
  if (downPct) document.getElementById('inp_downPct').value = downPct.replace('%', '');

  var rate = params.get('rate') || '';
  if (rate) document.getElementById('inp_rate').value = rate.replace('%', '');

  var term = params.get('term') || '';
  if (term) { var sel = document.getElementById('inp_term'); for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === term.replace(/[^0-9]/g, '')) { sel.selectedIndex = i; break; } } }

  var period = params.get('period') || '';
  if (period) { var sel = document.getElementById('inp_period'); for (var i = 0; i < sel.options.length; i++) { if (sel.options[i].value === period.replace(/[^0-9]/g, '')) { sel.selectedIndex = i; break; } } }

  // Co-brand
  var cobrand = params.get('cobrand') || '';
  if (cobrand === 'true' || cobrand === 'yes' || cobrand === 'Co-branded') {
    var cb = document.getElementById('inp_cobrand');
    if (cb) { cb.checked = true; toggleCobrand(); }
    var rn = params.get('realtorName') || ''; if (rn) document.getElementById('inp_realtorName').value = decodeURIComponent(rn);
    var rb = params.get('realtorBrokerage') || params.get('brokerage') || ''; if (rb) document.getElementById('inp_realtorBrokerage').value = decodeURIComponent(rb);
    var rp = params.get('realtorPhone') || ''; if (rp) document.getElementById('inp_realtorPhone').value = decodeURIComponent(rp);
    var re = params.get('realtorEmail') || ''; if (re) document.getElementById('inp_realtorEmail').value = decodeURIComponent(re);
    var layout = params.get('cobrandLayout') || 'left'; pickLayout(layout);
  }

  // Auto-generate if enough data
  var hasAddr = !!address;
  var hasPurchase = purchase && parseFloat(purchase.replace(/[^0-9.]/g, '')) >= 10000;
  var hasRent = rent && parseFloat(rent.replace(/[^0-9.]/g, '')) >= 100;
  var hasRate = rate && parseFloat(rate.replace('%', '')) > 0;
  if (hasAddr && hasPurchase && hasRent && hasRate) {
    setTimeout(function() { generateReport(); }, 200);
  }
})();
</script>
