<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Call Studio - Agent Edge</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(135deg, #0a0f1a 0%, #111827 50%, #0a0f1a 100%);
  color: #c8ccd4;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* LOBBY */
.lobby {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 30px;
}
.lobby.hidden { display: none; }

.lobby-card {
  background: rgba(17,24,39,0.92);
  border: 1px solid rgba(110,127,119,0.15);
  border-radius: 22px;
  padding: 40px;
  max-width: 560px;
  width: 100%;
  text-align: center;
  backdrop-filter: blur(12px);
  box-shadow: 0 25px 60px rgba(0,0,0,0.4);
}
.lobby-title {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  color: #e8dcc8;
  margin-bottom: 8px;
}
.lobby-subtitle { color: rgba(200,204,212,0.5); font-size: 14px; margin-bottom: 32px; }

.start-btn {
  display: block; width: 100%; padding: 16px;
  border: none; border-radius: 12px; background: #6e7f77;
  color: white; font-weight: 700; font-size: 16px;
  cursor: pointer; transition: all 0.25s ease; font-family: inherit;
}
.start-btn:hover { background: #556b62; transform: translateY(-1px); }
.start-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* CALL VIEW */
.call-view { display: none; flex-direction: column; height: 100vh; }
.call-view.active { display: flex; }

.room-banner {
  display: flex; align-items: center; justify-content: center; gap: 20px;
  padding: 12px 20px;
  background: rgba(17,24,39,0.95);
  border-bottom: 1px solid rgba(110,127,119,0.15);
  flex-wrap: wrap;
}
.banner-label { font-size: 13px; color: rgba(200,204,212,0.5); }
.room-code {
  font-family: 'Courier New', monospace;
  font-size: 28px; font-weight: 700; color: #e8dcc8; letter-spacing: 4px;
}
.banner-status { font-size: 13px; color: rgba(200,204,212,0.4); }
.pulse { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #6e7f77; margin-right: 6px; animation: pulse 1.5s ease infinite; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

.daily-frame {
  flex: 1;
  border: none;
  background: #000;
  min-height: 0;
}

.bottom-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 20px;
  background: rgba(17,24,39,0.95);
  border-top: 1px solid rgba(110,127,119,0.1);
  gap: 12px;
}
.timer { font-size: 13px; color: rgba(200,204,212,0.5); font-family: monospace; }
.end-btn {
  padding: 10px 28px; border: none; border-radius: 20px;
  background: #ef4444; color: white; font-weight: 700;
  font-size: 14px; cursor: pointer; transition: background 0.2s;
}
.end-btn:hover { background: #dc2626; }
</style>
</head>
<body>

<!-- LOBBY -->
<div class="lobby" id="lobby">
  <div class="lobby-card">
    <h1 class="lobby-title">Video Call Studio</h1>
    <p class="lobby-subtitle">Create a room and share the code with your borrower</p>
    <button class="start-btn" id="startBtn" onclick="createRoom()">
      <i style="margin-right:8px;">📹</i> Start Call
    </button>
    <p style="margin-top:16px;font-size:12px;color:rgba(200,204,212,0.3);">Powered by Daily.co · Up to 4 hours per session</p>
  </div>
</div>

<!-- ACTIVE CALL -->
<div class="call-view" id="callView">
  <div class="room-banner">
    <div>
      <div class="banner-label">Give this code to your borrower</div>
      <div class="room-code" id="roomCodeDisplay">-----</div>
    </div>
    <div>
      <div class="banner-label">Borrower joins at</div>
      <div style="font-size:13px;color:#e8dcc8;font-weight:600;">kristyflach.com/video-room.html</div>
    </div>
    <div class="banner-status">
      <span class="pulse" id="statusPulse"></span>
      <span id="statusText">Waiting for borrower...</span>
    </div>
  </div>

  <iframe id="dailyFrame" class="daily-frame" allow="camera; microphone; fullscreen; display-capture; autoplay" allowfullscreen></iframe>

  <div class="bottom-bar">
    <div class="timer" id="callTimer">00:00</div>
    <button class="end-btn" onclick="endCall()">End Call</button>
  </div>
</div>

<script>
var API_BASE = 'https://agent-edge-backend.vercel.app/api/video-call';
var roomCode = null;
var roomName = null;
var timerInterval = null;
var callStart = null;

async function createRoom() {
  var btn = document.getElementById('startBtn');
  btn.disabled = true;
  btn.textContent = 'Creating room...';

  try {
    var resp = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'create-room', lo_name: 'Kristy Flach' })
    });
    var data = await resp.json();
    if (!data.success) throw new Error(data.error || 'Failed to create room');

    roomCode = data.room_code;
    roomName = data.room_name;

    document.getElementById('roomCodeDisplay').textContent = roomCode;
    document.getElementById('dailyFrame').src = data.room_url;

    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('callView').classList.add('active');

    startTimer();

  } catch (err) {
    alert('Error: ' + err.message);
    btn.disabled = false;
    btn.textContent = 'Start Call';
  }
}

function startTimer() {
  callStart = Date.now();
  timerInterval = setInterval(function() {
    var s = Math.floor((Date.now() - callStart) / 1000);
    var m = Math.floor(s / 60); s = s % 60;
    document.getElementById('callTimer').textContent =
      (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }, 1000);
}

async function endCall() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById('dailyFrame').src = '';

  try {
    await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'delete-room', room_name: roomName, room_code: roomCode })
    });
  } catch(e) {}

  if (window.opener) { window.close(); }
  else { window.location.href = 'mission-control.html'; }
}
</script>
</body>
</html>
