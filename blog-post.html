<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Blog — Kristy Flach | Certified Mortgage Advisor</title>
  <style>
    :root {
      --primary: #002F6C;
      --dark: #0b1f3a;
      --accent: #9CB5A0;
      --text: #333333;
      --bg: #F8F9FA;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; max-width: 100%; overflow-x: hidden; }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      background: var(--bg);
      color: var(--text);
    }

    body::before {
      content: ""; position: fixed; inset: 0;
      background: url("header-background.jpeg") center/cover no-repeat; z-index: -2;
    }
    body::after {
      content: ""; position: fixed; inset: 0;
      background: rgba(255,255,255,0.55); z-index: -1;
    }

    /* Header */
    .site-header {
      width: 100%; padding: 18px 30px;
      background: rgba(255,255,255,0.65);
      border-bottom: 1px solid #ddd;
      backdrop-filter: blur(6px);
    }
    .nav-container {
      display: flex; justify-content: space-between; align-items: center;
      max-width: 1200px; margin: 0 auto; padding: 0 25px;
    }
    .logo img { height: 80px; }
    .back-link {
      text-decoration: none; color: var(--dark); font-weight: 700; font-size: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    .back-link:hover { opacity: 0.75; }

    /* Article */
    .article-container {
      max-width: 800px; margin: 60px auto 80px auto; padding: 50px 50px;
      background: rgba(255,255,255,0.70);
      backdrop-filter: blur(6px);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.10);
    }

    .article-category {
      font-size: 12px; text-transform: uppercase; letter-spacing: 1px;
      color: #6a8d73; font-weight: bold; margin-bottom: 12px;
    }

    .article-title {
      font-size: 36px; font-weight: 700; color: var(--dark);
      line-height: 1.25; margin: 0 0 16px 0;
    }

    .article-meta {
      font-size: 14px; color: #888; margin-bottom: 30px;
      padding-bottom: 20px; border-bottom: 1px solid #ddd;
    }

    .article-image {
      width: 100%; max-height: 400px; object-fit: cover;
      border-radius: 10px; margin-bottom: 30px;
    }

    .article-body { font-size: 18px; line-height: 1.9; color: var(--text); }
    .article-body h3 { font-size: 22px; color: var(--dark); margin: 30px 0 12px 0; }
    .article-body p { margin-bottom: 20px; }
    .article-body ul, .article-body ol { margin-bottom: 20px; padding-left: 24px; }
    .article-body li { margin-bottom: 8px; }
    .article-body strong { color: var(--dark); }

    .article-cta {
      margin-top: 40px; padding-top: 30px; border-top: 1px solid #ddd;
      text-align: center;
    }
    .article-cta p { font-size: 16px; color: #555; margin-bottom: 16px; }
    .article-cta a {
      display: inline-block; background: var(--accent); color: white;
      padding: 12px 28px; border-radius: 8px; text-decoration: none;
      font-weight: 700; transition: all 0.25s ease;
    }
    .article-cta a:hover { background: var(--primary); transform: translateY(-2px); }

    .loading-msg {
      text-align: center; padding: 80px 20px; font-size: 18px; color: #888;
    }

    /* Footer */
    footer {
      background-color: #6e7f77; color: white; padding: 20px 0; width: 100%;
    }
    .footer-content { max-width: 1200px; margin: 0 auto; padding: 0 1rem; text-align: center; }

    @media (max-width: 768px) {
      .article-container { margin: 30px 16px 60px 16px; padding: 30px 24px; }
      .article-title { font-size: 26px; }
      .article-body { font-size: 16px; }
    }
  </style>
<script src="tracking.js"></script>
</head>
<body>

  <header class="site-header">
    <div class="nav-container">
      <a class="logo" href="index.html" aria-label="Home">
        <img src="CMA Logo.png" alt="CMA Logo">
      </a>
      <a href="index.html#blog" class="back-link"><i class="fas fa-arrow-left"></i> Back to Site</a>
    </div>
  </header>

  <div id="articleContent" class="loading-msg">Loading post...</div>

  <footer>
    <div class="footer-content">
      <p style="font-size: 0.9rem; opacity: 0.8;">© 2026 Kristy Flach. All rights reserved.</p>
    </div>
  </footer>

  <script>
  (function() {
    var params = new URLSearchParams(window.location.search);
    var slug = params.get('slug');
    if (!slug) {
      document.getElementById('articleContent').innerHTML = '<div class="loading-msg">Post not found. <a href="index.html#blog">Return to blog</a></div>';
      return;
    }

    fetch('https://agent-edge-backend.vercel.app/api/blog-api?action=single&slug=' + encodeURIComponent(slug))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.success || !data.post) {
          document.getElementById('articleContent').innerHTML = '<div class="loading-msg">Post not found. <a href="index.html#blog">Return to blog</a></div>';
          return;
        }
        var p = data.post;
        var date = p.published_at ? new Date(p.published_at).toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }) : '';
        var imgHtml = p.image_url ? '<img src="' + p.image_url + '" alt="' + (p.title || '').replace(/"/g,'&quot;') + '" class="article-image">' : '';

        document.title = p.title + ' — Kristy Flach';

        document.getElementById('articleContent').innerHTML =
          '<div class="article-container">' +
          '<div class="article-category">' + (p.category || 'General') + '</div>' +
          '<h1 class="article-title">' + (p.title || '') + '</h1>' +
          '<div class="article-meta">By Kristy Flach · ' + date + '</div>' +
          imgHtml +
          '<div class="article-body">' + (p.body || '') + '</div>' +
          '<div class="article-cta"><p>Have questions about your mortgage strategy?</p><a href="index.html#contact">Start the Conversation</a></div>' +
          '</div>';
      })
      .catch(function() {
        document.getElementById('articleContent').innerHTML = '<div class="loading-msg">Error loading post. <a href="index.html#blog">Return to blog</a></div>';
      });
  })();
  </script>

</body>
</html>
