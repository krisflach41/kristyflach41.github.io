<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="600">
<title>Client-Friendly Market Summary</title>
<style>
/* ===== BACKGROUND MATCHES PORTAL ===== */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 80px 0;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
}
/* ===== CENTERED CONTENT WIDTH ===== */
.page-wrap {
  max-width: 1000px;
  margin: 0 auto;
  padding: 0 24px;
}
/* ===== FROSTED GLASS CONTAINER ===== */
.brief-card {
  border-radius: 22px;
  padding: 60px 50px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 20px 55px rgba(0,0,0,0.10),
    0 6px 18px rgba(0,0,0,0.05);
}
/* ===== TYPOGRAPHY ===== */
h1 {
  font-size: 36px;
  margin-bottom: 25px;
}
h2 {
  margin-top: 30px;
  margin-bottom: 10px;
  font-size: 17px;
  font-weight: 600;
  color: #0b4ea2;
}
p {
  line-height: 1.8;
  margin-bottom: 16px;
  font-size: 15px;
  color: #333;
  font-weight: 400;
}
ul {
  margin: 0 0 16px 0;
  padding-left: 20px;
}
li {
  line-height: 1.8;
  font-size: 15px;
  color: #333;
  margin-bottom: 6px;
}
strong {
  font-weight: 600;
  color: #0b1f3a;
}
/* ===== BACK LINK BUTTON ===== */
.back-link {
  display: inline-block;
  margin-top: 40px;
  text-decoration: none;
  font-weight: 600;
  color: white;
  background: #0b4ea2;
  padding: 8px 16px;
  border-radius: 20px;
}
</style>
<script src="tracking.js"></script>
<script src="feature-gate.js"></script>
<link rel="stylesheet" href="mobile-fixes.css">
</head>
<body>
<div class="page-wrap">
  <div class="brief-card">
    <h1>Client-Friendly Summary – <span id="briefDate"></span></h1>
    
    <!-- DYNAMIC CONTENT LOADED FROM JSON -->
    <div id="clientContent">
      <p>Loading client-friendly summary...</p>
    </div>
    
    <a href="portal.html" class="back-link">← Back to Agent Edge Portal</a>
  </div>
</div>

<script>
// Load briefing data from API
window.addEventListener('load', function() {
  fetch('https://agent-edge-backend.vercel.app/api/briefing')
    .then(function(r) { return r.json(); })
    .then(function(briefingData) {
      // Update date
      if (briefingData.lastUpdated) {
        var date = new Date(briefingData.lastUpdated);
        document.getElementById('briefDate').textContent = date.toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
      } else {
        document.getElementById('briefDate').textContent = new Date().toLocaleDateString('en-US', { 
          year: 'numeric', 
          month: 'long', 
          day: 'numeric' 
        });
      }

      // Load client-friendly content
      var contentDiv = document.getElementById('clientContent');
      if (briefingData.clientFriendly) {
        var formatted = formatTextToHTML(briefingData.clientFriendly);
        contentDiv.innerHTML = formatted;
      } else {
        contentDiv.innerHTML = '<p>No client-friendly summary available. Please update from the admin page.</p>';
      }
    })
    .catch(function() {
      document.getElementById('briefDate').textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      document.getElementById('clientContent').innerHTML = '<p>Unable to load summary. Please try again later.</p>';
    });
});

// Helper function to format text into HTML
function formatTextToHTML(text) {
  var sections = text.split(/\n\n+/);
  var html = '';

  sections.forEach(function(section) {
    section = section.trim();
    if (!section) return;

    // Only treat ALL CAPS lines (with possible colons) as section headings
    if (section.match(/^[A-Z][A-Z\s&:–—]+$/) && section.length < 60) {
      html += '<h2>' + section.replace(/:$/, '') + '</h2>';
    }
    // Bullet points — lines starting with - or bullet
    else if (section.match(/^[\-]/m)) {
      var items = section.split(/\n/).filter(function(l) { return l.trim(); });
      html += '<ul>';
      items.forEach(function(item) {
        html += '<li>' + item.replace(/^[\-]\s*/, '') + '</li>';
      });
      html += '</ul>';
    }
    // Regular paragraph
    else {
      html += '<p>' + section.replace(/\n/g, '<br>') + '</p>';
    }
  });

  return html;
}
</script>
<script src="gus-find-it.js"></script>
</body>
</html>
