<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM - Mission Control</title>
<script src="auth.js"></script>
<style>
* { box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0; padding: 0; min-height: 100vh;
  background: linear-gradient(135deg, #0b1f3a 0%, #132d54 50%, #0b1f3a 100%);
  color: #e8ecf1;
}

/* LAYOUT: list left, detail right */
.crm-layout { display: flex; height: 100vh; }
.crm-list-panel { width: 380px; min-width: 320px; border-right: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; }
.crm-detail-panel { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }

/* LIST PANEL */
.list-header { padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.list-header h1 { font-size: 18px; margin: 0 0 4px; }
.list-header p { font-size: 11px; color: rgba(255,255,255,0.35); margin: 0 0 10px; }
.list-header-row { display: flex; gap: 8px; align-items: center; }
.list-header-row input { flex: 1; padding: 7px 10px; border-radius: 6px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: #e8ecf1; font-size: 12px; font-family: inherit; }
.list-header-row input:focus { outline: none; border-color: rgba(52,152,219,0.4); }
.list-header-row select { padding: 7px 8px; border-radius: 6px; background-color: #1a2d4a; border: 1px solid rgba(255,255,255,0.1); color: #e8ecf1; font-size: 12px; font-family: inherit; }
.list-header-row select option { background-color: #1a2d4a; color: #e8ecf1; }
.list-btn-row { display: flex; gap: 6px; margin-top: 8px; }
.add-btn { padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(52,152,219,0.3); background: rgba(52,152,219,0.15); color: #3498db; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.add-btn:hover { background: rgba(52,152,219,0.25); }

.list-actions-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.list-stat { font-size: 11px; color: rgba(255,255,255,0.35); }
.list-stat strong { color: rgba(255,255,255,0.7); }
.bulk-btn { padding: 5px 10px; border-radius: 6px; border: 1px solid rgba(155,89,182,0.3); background: rgba(155,89,182,0.1); color: #b97fd0; font-size: 11px; font-weight: 600; cursor: pointer; display: none; }
.bulk-btn:hover { background: rgba(155,89,182,0.25); }

/* CONTACT LIST */
.contact-list { flex: 1; overflow-y: auto; }
.contact-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.03); border-left: 3px solid transparent;
}
.contact-item:hover { background: rgba(255,255,255,0.03); }
.contact-item.active { background: rgba(52,152,219,0.1); border-left: 3px solid #3498db; }
.contact-item.t-client { border-left-color: #3498db; }
.contact-item.t-realtor { border-left-color: #27ae60; }
.contact-item.t-title { border-left-color: #e67e22; }
.contact-item.t-appraiser { border-left-color: #9b59b6; }
.contact-item.t-contractor { border-left-color: #e74c3c; }
.contact-item.t-vendor { border-left-color: #1abc9c; }
.contact-item.t-other { border-left-color: rgba(255,255,255,0.15); }
.contact-item input[type="checkbox"] { accent-color: #3498db; cursor: pointer; flex-shrink: 0; }
.ci-info { flex: 1; min-width: 0; }
.ci-name { font-size: 13px; font-weight: 600; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-sub { font-size: 11px; color: rgba(255,255,255,0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-type {
  flex-shrink: 0; padding: 2px 8px; border-radius: 8px; font-size: 10px; font-weight: 600;
}
.type-client { background: rgba(52,152,219,0.15); color: #5dade2; }
.type-realtor { background: rgba(39,174,96,0.15); color: #58d68d; }
.type-title { background: rgba(230,126,34,0.15); color: #f0b27a; }
.type-appraiser { background: rgba(155,89,182,0.15); color: #c39bd3; }
.type-contractor { background: rgba(231,76,60,0.15); color: #ec7063; }
.type-vendor { background: rgba(26,188,156,0.15); color: #76d7c4; }
.type-other { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.4); }

.empty-list { padding: 40px 16px; text-align: center; color: rgba(255,255,255,0.2); font-size: 13px; }

/* DETAIL PANEL */
.detail-empty { display: flex; align-items: center; justify-content: center; flex: 1; color: rgba(255,255,255,0.15); font-size: 14px; }
.detail-content { padding: 24px 28px; display: none; }
.detail-content.show { display: block; }

.detail-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.detail-name { font-size: 22px; font-weight: 700; margin: 0 0 4px; }
.detail-type-badge { display: inline-block; padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
.detail-email { font-size: 13px; color: #5dade2; }
.detail-phone { font-size: 13px; color: rgba(255,255,255,0.6); }
.detail-actions { display: flex; gap: 8px; }
.d-btn { padding: 7px 14px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.6); font-size: 12px; cursor: pointer; font-weight: 600; }
.d-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
.d-btn.email-btn { border-color: rgba(52,152,219,0.3); color: #3498db; }
.d-btn.pipeline-btn { border-color: rgba(26,188,156,0.3); color: #1abc9c; }
.d-btn.delete-btn { border-color: rgba(192,57,43,0.2); color: #c0392b; }

/* DETAIL TABS */
.detail-tabs { display: flex; gap: 0; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; }
.dtab { padding: 8px 16px; font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.35); cursor: pointer; border-bottom: 2px solid transparent; }
.dtab:hover { color: rgba(255,255,255,0.6); }
.dtab.active { color: #3498db; border-bottom-color: #3498db; }
.dtab-panel { display: none; }
.dtab-panel.active { display: block; }

/* DETAIL FIELDS */
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.field-grid.three { grid-template-columns: 1fr 1fr 1fr; }
.fg { display: flex; flex-direction: column; }
.fg label { font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.fg input, .fg select, .fg textarea {
  padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
  color: #e8ecf1; font-size: 13px; font-family: inherit;
}
.fg select { background-color: #1a2d4a; }
.fg select option { background-color: #1a2d4a; color: #e8ecf1; }
.fg textarea { height: 60px; resize: vertical; }
.fg input:focus, .fg select:focus, .fg textarea:focus { outline: none; border-color: rgba(52,152,219,0.3); }

.section-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.25); text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px; }
.save-row { display: flex; justify-content: flex-end; margin-top: 16px; }
.save-btn { padding: 9px 22px; border-radius: 8px; border: none; background: #3498db; color: #fff; font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.save-btn:hover:not(:disabled) { background: #2980b9; }
.save-btn:disabled { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.2); cursor: default; }

/* ACTIVITY TIMELINE */
.timeline { padding: 0; }
.tl-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.tl-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.tl-icon.email { background: rgba(52,152,219,0.15); }
.tl-icon.note { background: rgba(241,196,15,0.15); }
.tl-icon.call { background: rgba(39,174,96,0.15); }
.tl-icon.meeting { background: rgba(155,89,182,0.15); }
.tl-body { flex: 1; }
.tl-type { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.4); text-transform: uppercase; }
.tl-subject { font-size: 13px; color: #fff; margin-top: 2px; }
.tl-text { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 4px; }
.tl-date { font-size: 11px; color: rgba(255,255,255,0.2); flex-shrink: 0; }

.add-activity-row { display: flex; gap: 8px; margin-bottom: 16px; }
.aa-select { padding: 6px 10px; border-radius: 6px; background-color: #1a2d4a; border: 1px solid rgba(255,255,255,0.1); color: #e8ecf1; font-size: 12px; font-family: inherit; }
.aa-select option { background-color: #1a2d4a; color: #e8ecf1; }
.aa-input { flex: 1; padding: 6px 10px; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); color: #e8ecf1; font-size: 12px; font-family: inherit; }
.aa-input:focus { outline: none; border-color: rgba(52,152,219,0.3); }
.aa-btn { padding: 6px 14px; border-radius: 6px; border: none; background: rgba(52,152,219,0.2); color: #3498db; font-size: 12px; font-weight: 600; cursor: pointer; }

/* EMAIL MODAL */
.modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.show { display: flex; }
.modal {
  background: #132d54; border: 1px solid rgba(255,255,255,0.1); border-radius: 16px;
  padding: 24px; width: 90%; max-width: 520px; max-height: 85vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal h2 { font-size: 17px; margin: 0 0 16px; }
.modal .fg { margin-bottom: 12px; }
.modal-btns { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
.modal-btn { padding: 8px 18px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; }
.modal-btn.send { background: #3498db; color: #fff; }
.modal-btn.cancel { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }

/* PIPELINE MODAL */
.stage-option { padding: 10px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.06); background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.6); cursor: pointer; margin-bottom: 6px; font-size: 13px; }
.stage-option:hover { background: rgba(52,152,219,0.12); border-color: rgba(52,152,219,0.3); color: #fff; }

/* TOAST */
.toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #27ae60; color: #fff; padding: 12px 28px; border-radius: 10px; font-size: 14px; font-weight: 600; display: none; z-index: 200; }
.toast.show { display: block; }

.back-link { display: none; padding: 10px 16px; font-size: 12px; color: rgba(255,255,255,0.35); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.04); }
.back-link:hover { color: #fff; }

@media (max-width: 768px) {
  .crm-list-panel { width: 100%; }
  .crm-detail-panel { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0b1f3a 0%, #132d54 50%, #0b1f3a 100%); z-index: 50; display: none; }
  .crm-detail-panel.mobile-show { display: flex; }
  .back-link { display: block; }
}
</style>
</head>
<body>
<div class="crm-layout">

<!-- LEFT: CONTACT LIST -->
<div class="crm-list-panel">
  <div class="list-header">
    <h1>Client Database</h1>
    <p>Every client, realtor, and partner</p>
    <div class="list-header-row">
      <input type="text" id="searchInput" placeholder="Search..." oninput="renderList()">
      <select id="typeFilter" onchange="renderList()">
        <option value="">All</option>
        <option value="client">Clients</option>
        <option value="realtor">Realtors</option>
        <option value="title">Title</option>
        <option value="appraiser">Appraisers</option>
        <option value="contractor">Contractors</option>
        <option value="vendor">Vendors</option>
        <option value="other">Other</option>
      </select>
    </div>
    <div class="list-btn-row">
      <button class="add-btn" onclick="addNew()">+ New</button>
      <button class="add-btn" onclick="document.getElementById('importFile').click()" style="border-color:rgba(39,174,96,0.3); background:rgba(39,174,96,0.1); color:#27ae60;">↑ Import</button>
      <input type="file" id="importFile" accept=".csv,.xlsx,.xls" style="display:none;" onchange="handleImport(this)">
      <a href="crm-import-template.xlsx" download class="add-btn" style="text-decoration:none; border-color:rgba(255,255,255,0.08); color:rgba(255,255,255,0.4);">📥 Template</a>
    </div>
    <div class="list-actions-row">
      <span class="list-stat"><strong id="totalCount">0</strong> contacts</span>
      <div style="flex:1;"></div>
      <button class="bulk-btn" id="bulkBtn" onclick="openBulkEmail()">✉ Email Selected</button>
    </div>
  </div>
  <div class="contact-list" id="contactList"></div>
</div>

<!-- RIGHT: DETAIL VIEW -->
<div class="crm-detail-panel" id="detailPanel">
  <a href="#" class="back-link" onclick="closeMobileDetail(event)">← Back to list</a>
  <div class="detail-empty" id="detailEmpty">Select a contact to view details</div>
  <div class="detail-content" id="detailContent">

    <div class="detail-top">
      <div>
        <h2 class="detail-name" id="dName"></h2>
        <span class="detail-type-badge" id="dTypeBadge"></span><br>
        <span class="detail-email" id="dEmail"></span>
        <span class="detail-phone" id="dPhone"></span>
      </div>
      <div class="detail-actions">
        <button class="d-btn email-btn" onclick="openEmailModal()">✉ Email</button>
        <button class="d-btn pipeline-btn" onclick="openPipelineModal()">→ Pipeline</button>
        <button class="d-btn delete-btn" onclick="deleteContact()">Delete</button>
      </div>
    </div>

    <div class="detail-tabs">
      <div class="dtab active" onclick="switchTab('info', this)">Details</div>
      <div class="dtab" onclick="switchTab('activity', this)">Activity</div>
    </div>

    <!-- INFO TAB -->
    <div class="dtab-panel active" id="tab-info">
      <div class="section-label">Contact Info</div>
      <div class="field-grid">
        <div class="fg"><label>Name</label><input type="text" id="dNameEdit" class="tracked"></div>
        <div class="fg"><label>Email</label><input type="email" id="dEmailEdit" class="tracked"></div>
        <div class="fg"><label>Phone</label><input type="tel" id="dPhoneEdit" class="tracked"></div>
        <div class="fg"><label>Company / Brokerage</label><input type="text" id="dCompany" class="tracked"></div>
      </div>
      <div class="field-grid three">
        <div class="fg"><label>Type</label>
          <select id="dType" onchange="toggleCT(); markDirty()" class="tracked">
            <option value="client">Client / Borrower</option><option value="realtor">Realtor / Agent</option>
            <option value="title">Title & Escrow</option><option value="appraiser">Appraiser</option>
            <option value="contractor">Contractor</option><option value="vendor">Vendor / Partner</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="fg" id="ctField" style="display:none;"><label>Specify Type</label><input type="text" id="dCustomType" class="tracked"></div>
        <div class="fg"><label>Source</label>
          <select id="dSource" class="tracked" onchange="markDirty()">
            <option value="">--</option><option value="pipeline">Pipeline</option><option value="portal">Partner Portal</option>
            <option value="referral">Referral</option><option value="webinar">Webinar</option>
            <option value="social">Social Media</option><option value="manual">Manual Entry</option><option value="import">Import</option>
          </select>
        </div>
      </div>

      <div class="section-label">Personal</div>
      <div class="field-grid three">
        <div class="fg"><label>Birthday</label><input type="date" id="dBirthday" class="tracked"></div>
        <div class="fg"><label>Spouse / Partner</label><input type="text" id="dSpouse" class="tracked"></div>
        <div class="fg"><label>Kids</label><input type="text" id="dKids" placeholder="e.g. Emma (8), Jack (5)" class="tracked"></div>
      </div>
      <div class="field-grid">
        <div class="fg"><label>Employer</label><input type="text" id="dEmployer" class="tracked"></div>
        <div class="fg"><label>Job Title</label><input type="text" id="dJobTitle" class="tracked"></div>
      </div>

      <div class="section-label">Address</div>
      <div class="field-grid">
        <div class="fg"><label>Street</label><input type="text" id="dAddress" class="tracked"></div>
        <div class="fg"><label>City</label><input type="text" id="dCity" class="tracked"></div>
      </div>
      <div class="field-grid three">
        <div class="fg"><label>State</label><input type="text" id="dState" class="tracked"></div>
        <div class="fg"><label>Zip</label><input type="text" id="dZip" class="tracked"></div>
        <div class="fg"><label>Tags</label><input type="text" id="dTags" placeholder="VIP, South FL, 2024" class="tracked"></div>
      </div>

      <div class="section-label">Web & Social</div>
      <div class="field-grid">
        <div class="fg"><label>Website</label><input type="text" id="dWebsite" placeholder="www.example.com" class="tracked"></div>
        <div class="fg"><label>LinkedIn</label><input type="text" id="dLinkedin" placeholder="linkedin.com/in/name" class="tracked"></div>
      </div>
      <div class="field-grid three">
        <div class="fg"><label>Facebook</label><input type="text" id="dFacebook" placeholder="handle or URL" class="tracked"></div>
        <div class="fg"><label>Instagram</label><input type="text" id="dInstagram" placeholder="@handle" class="tracked"></div>
        <div class="fg"><label>TikTok</label><input type="text" id="dTiktok" placeholder="@handle" class="tracked"></div>
      </div>

      <div class="section-label">Notes</div>
      <div class="fg"><textarea id="dNotes" style="width:100%; height:80px;" class="tracked"></textarea></div>

      <div class="save-row">
        <button class="save-btn" id="saveBtn" onclick="saveContact()" disabled>Save Changes</button>
      </div>
    </div>

    <!-- ACTIVITY TAB -->
    <div class="dtab-panel" id="tab-activity">
      <div class="add-activity-row">
        <select class="aa-select" id="aaType">
          <option value="note">📝 Note</option>
          <option value="call">📞 Call</option>
          <option value="meeting">🤝 Meeting</option>
          <option value="text">💬 Text</option>
        </select>
        <input type="text" class="aa-input" id="aaText" placeholder="Add a note or log activity...">
        <button class="aa-btn" onclick="addActivity()">Add</button>
      </div>
      <div class="timeline" id="activityTimeline"></div>
    </div>

  </div>
</div>
</div>

<!-- EMAIL MODAL -->
<div class="modal-overlay" id="emailModal">
  <div class="modal">
    <h2 id="emailModalTitle">Send Email</h2>
    <div class="fg"><label>To</label><input type="text" id="emTo" readonly></div>
    <div class="fg"><label>Subject</label><input type="text" id="emSubject"></div>
    <div class="fg"><label>Message</label><textarea id="emBody" style="height:100px;" placeholder="Your signature will be appended automatically."></textarea></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeEmailModal()">Cancel</button>
      <button class="modal-btn send" onclick="sendEmail()">Send</button>
    </div>
  </div>
</div>

<!-- BULK EMAIL MODAL -->
<div class="modal-overlay" id="bulkModal">
  <div class="modal">
    <h2>Send Bulk Email</h2>
    <p style="font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:12px;" id="bulkCount"></p>
    <div class="fg"><label>Subject</label><input type="text" id="bulkSubject" style="width:100%;"></div>
    <div class="fg"><label>Message (use {name} for first name)</label><textarea id="bulkBody" style="width:100%; height:100px;"></textarea></div>
    <div class="modal-btns">
      <button class="modal-btn cancel" onclick="closeBulkModal()">Cancel</button>
      <button class="modal-btn send" onclick="sendBulkEmail()">Send All</button>
    </div>
  </div>
</div>

<!-- PIPELINE MODAL -->
<div class="modal-overlay" id="pipelineModal">
  <div class="modal" style="max-width:380px;">
    <h2>Send to Pipeline</h2>
    <p style="font-size:12px; color:rgba(255,255,255,0.4); margin-bottom:12px;" id="plName"></p>
    <div id="stageOptions"></div>
    <div class="modal-btns"><button class="modal-btn cancel" onclick="closePipelineModal()">Cancel</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
protectPage();
if (sessionStorage.getItem('agentEdgeAdmin') !== 'true') { window.location.href = 'portal.html'; }

var API = 'https://agent-edge-backend.vercel.app/api/crm-api';
var SEND_API = 'https://agent-edge-backend.vercel.app/api/send-email';
var allContacts = [];
var selectedIds = new Set();
var currentContact = null;
var currentActivity = [];

var stages = [
  { id:'cold', t:'Cold Leads' },{ id:'warm', t:'Warm Leads' },{ id:'active', t:'Active Conversations' },
  { id:'credit', t:'Credit Repair' },{ id:'preapproval', t:'Pre-Approval' },{ id:'preapproved', t:'Pre Approved' },
  { id:'ratewatch', t:'Rate Watch' },{ id:'underwriting', t:'Underwriting' },
  { id:'closed', t:'Closed - Funded' },{ id:'dead', t:'Dead Leads' }
];
var typeLabels = { client:'Client', realtor:'Realtor', title:'Title & Escrow', appraiser:'Appraiser', contractor:'Contractor', vendor:'Vendor', other:'Other' };

// ===== LOAD =====
function loadCRM() {
  fetch(API + '?action=list').then(function(r){return r.json();}).then(function(d){
    if (d.success) { allContacts = d.contacts || []; renderList(); }
  }).catch(function(e){ console.log('Load error:', e); });
}

// ===== RENDER LIST =====
function renderList() {
  var q = document.getElementById('searchInput').value.toLowerCase();
  var tf = document.getElementById('typeFilter').value;
  var filtered = allContacts.filter(function(c){
    var mt = !tf || c.type === tf;
    var ms = !q || (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.email||'').toLowerCase().indexOf(q)!==-1 ||
      (c.phone||'').indexOf(q)!==-1 || (c.company||'').toLowerCase().indexOf(q)!==-1 || (c.tags||'').toLowerCase().indexOf(q)!==-1;
    return mt && ms;
  });
  document.getElementById('totalCount').textContent = allContacts.length;
  var el = document.getElementById('contactList');
  if (filtered.length === 0) { el.innerHTML = '<div class="empty-list">No contacts found</div>'; return; }

  var html = '';
  filtered.forEach(function(c){
    var act = currentContact && currentContact.id === c.id ? ' active' : '';
    var tc = 'type-' + (c.type||'other');
    var tl = c.type==='other' && c.custom_type ? c.custom_type : (typeLabels[c.type]||'Other');
    var sub = [];
    if (c.email) sub.push(c.email);
    if (c.company) sub.push(c.company);
    html += '<div class="contact-item t-' + (c.type||'other') + act + '" onclick="selectContact(\'' + c.id + '\')">' +
      '<input type="checkbox" ' + (selectedIds.has(c.id)?'checked':'') + ' onclick="event.stopPropagation(); toggleSel(\'' + c.id + '\', this.checked)">' +
      '<div class="ci-info"><div class="ci-name">' + esc(c.name) + '</div>' +
      '<div class="ci-sub">' + esc(sub.join(' · ')) + '</div></div>' +
      '<span class="ci-type ' + tc + '">' + esc(tl) + '</span></div>';
  });
  el.innerHTML = html;
  document.getElementById('bulkBtn').style.display = selectedIds.size > 0 ? 'inline-block' : 'none';
}

// ===== SELECT CONTACT =====

// ===== ACTIVITY TIMELINE =====
function renderActivity() {
  var el = document.getElementById('activityTimeline');
  if (!currentActivity || currentActivity.length === 0) {
    el.innerHTML = '<div style="color:rgba(255,255,255,0.15); font-size:13px; padding:20px 0;">No activity yet. Add a note or send an email.</div>';
    return;
  }
  var icons = { email_sent:'✉️', email_received:'📩', call:'📞', note:'📝', meeting:'🤝', text:'💬' };
  var html = '';
  currentActivity.forEach(function(a){
    var icon = icons[a.type] || '📌';
    var iconClass = a.type.indexOf('email')!==-1 ? 'email' : (a.type==='note' ? 'note' : (a.type==='call' ? 'call' : 'meeting'));
    var dateStr = '';
    if (a.date) { var d = new Date(a.date); dateStr = (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear()+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}); }
    html += '<div class="tl-item"><div class="tl-icon ' + iconClass + '">' + icon + '</div>' +
      '<div class="tl-body"><div class="tl-type">' + esc(a.type.replace('_',' ')) + '</div>' +
      (a.subject ? '<div class="tl-subject">' + esc(a.subject) + '</div>' : '') +
      (a.body ? '<div class="tl-text">' + esc(a.body) + '</div>' : '') +
      '</div><div class="tl-date">' + dateStr + '</div></div>';
  });
  el.innerHTML = html;
}

function addActivity() {
  if (!currentContact) return;

  var activity = { crm_id: currentContact.id, type: type, subject: text, body: '', date: new Date().toISOString() };

  fetch(API + '?action=addActivity', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ activity: activity })
  }).catch(function(e){ console.log(e); });
}

  c.source = document.getElementById('dSource').value;
  c.birthday = document.getElementById('dBirthday').value;
  c.spouse_name = document.getElementById('dSpouse').value.trim();
  c.kids = document.getElementById('dKids').value.trim();
  c.employer = document.getElementById('dEmployer').value.trim();
  c.job_title = document.getElementById('dJobTitle').value.trim();
  c.address = document.getElementById('dAddress').value.trim();
  c.city = document.getElementById('dCity').value.trim();
  c.state = document.getElementById('dState').value.trim();
  c.zip = document.getElementById('dZip').value.trim();
  c.tags = document.getElementById('dTags').value.trim();
  c.notes = document.getElementById('dNotes').value.trim();
  c.website = document.getElementById('dWebsite').value.trim();
  c.facebook = document.getElementById('dFacebook').value.trim();
  c.instagram = document.getElementById('dInstagram').value.trim();
  c.linkedin = document.getElementById('dLinkedin').value.trim();
  c.tiktok = document.getElementById('dTiktok').value.trim();

  // Map to API format
  var payload = {
    id: c.id, name: c.name, email: c.email, phone: c.phone, company: c.company,
    type: c.type, customType: c.custom_type, source: c.source, address: c.address,
    city: c.city, state: c.state, zip: c.zip, tags: c.tags, notes: c.notes,
    pipelineId: c.pipeline_id || '', birthday: c.birthday, spouseName: c.spouse_name,
    kids: c.kids, employer: c.employer, jobTitle: c.job_title,
    website: c.website, facebook: c.facebook, instagram: c.instagram,
    linkedin: c.linkedin, tiktok: c.tiktok,
    createdAt: c.created_at
  };

  // Update local
  var idx = allContacts.findIndex(function(x){ return x.id === c.id; });
  if (idx >= 0) allContacts[idx] = c;
  showDetail();
  renderList();

  fetch(API + '?action=save', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ crm: payload })
  }).then(function(r){return r.json();})
    .then(function(d){ showToast(d.success ? 'Saved!' : 'Error saving'); resetDirty(); })
    .catch(function(){ showToast('Saved locally'); });
}

function openEmailModal() {
  if (!currentContact || !currentContact.email) { showToast('No email address'); return; }
  document.getElementById('emTo').value = currentContact.email;
  document.getElementById('emSubject').value = '';
  document.getElementById('emBody').value = '';

function closeEmailModal() { document.getElementById('emailModal').classList.remove('show'); }

function sendEmail() {
  var subject = document.getElementById('emSubject').value.trim();
  var body = document.getElementById('emBody').value.trim();
  if (!subject || !body) { showToast('Fill in subject and message'); return; }

  var bodyHtml = '<p>' + body.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>';

  fetch(SEND_API, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ to: currentContact.email, subject: subject, body: bodyHtml })
  }).then(function(r){return r.json();}).then(function(d){
    if (d.success) {
      showToast('Email sent!');
      // Log activity
      var act = { crm_id: currentContact.id, type:'email_sent', subject: subject, body: body.substring(0,100), date: new Date().toISOString() };
      currentActivity.unshift(act);
      renderActivity();
      fetch(API + '?action=addActivity', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ activity: act }) });
    } else { showToast('Send failed'); }
  }).catch(function(){ showToast('Send failed'); });

  closeEmailModal();
}

// ===== BULK EMAIL =====
function openBulkEmail() {
  var ct = allContacts.filter(function(c){ return selectedIds.has(c.id) && c.email; });
  if (ct.length === 0) { showToast('No selected contacts have emails'); return; }
  document.getElementById('bulkCount').textContent = 'Sending to ' + ct.length + ' contact' + (ct.length>1?'s':'');
  document.getElementById('bulkSubject').value = '';
  document.getElementById('bulkBody').value = '';
  document.getElementById('bulkModal').classList.add('show');
}
function closeBulkModal() { document.getElementById('bulkModal').classList.remove('show'); }

function sendBulkEmail() {
  var subject = document.getElementById('bulkSubject').value.trim();
  var body = document.getElementById('bulkBody').value.trim();
  if (!subject || !body) { showToast('Fill in subject and message'); return; }
  var ct = allContacts.filter(function(c){ return selectedIds.has(c.id) && c.email; });
  var sent = 0, fail = 0;
  ct.forEach(function(c){
    var pb = '<p>' + body.replace(/\{name\}/g, (c.name||'').split(' ')[0]).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>') + '</p>';
    fetch(SEND_API, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ to: c.email, subject: subject, body: pb }) })
      .then(function(r){return r.json();}).then(function(d){ if(d.success) sent++; else fail++; if(sent+fail===ct.length) showToast('Sent: '+sent+(fail?' | Failed: '+fail:'')); })
      .catch(function(){ fail++; if(sent+fail===ct.length) showToast('Sent: '+sent+' | Failed: '+fail); });
  });
  closeBulkModal();
  selectedIds.clear(); renderList();
  showToast('Sending...');
}

function sendToPipeline(stage) {
  var c = currentContact;
  var pid = 'c-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
  var now = new Date().toISOString();
  var pc = {
    id: pid, name: c.name, phone: c.phone||'', email: c.email||'', stage: stage, source: 'crm',
    realtorName:'', loanType:'', loanYear:'', interestRate:'', lockStatus:'', subjectAddress:'',
    borrowers: [{ name: c.name, currentAddress: c.address||'', ownRent:'', monthlyPayment:'', retainSell:'', employer: c.employer||'', selfReportedWages:'', incomeType:'', w2Year1:'', w2Year2:'', ytd:'', qualifyingEarnings:'' }],
    dates:{}, notes:[], documents:[], createdAt: now, updatedAt: now
  };
  var contacts = JSON.parse(localStorage.getItem('pipelineContacts')||'[]');
  contacts.push(pc); localStorage.setItem('pipelineContacts', JSON.stringify(contacts));

  fetch('https://agent-edge-backend.vercel.app/api/pipeline-api?action=save', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contact: pc })
  }).catch(function(e){ console.log(e); });

  c.pipeline_id = pid;
  fetch(API + '?action=save', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ crm: { id: c.id, name: c.name, pipelineId: pid } })
  }).catch(function(e){ console.log(e); });

  closePipelineModal();
  var stName = stages.find(function(s){return s.id===stage;});
  showToast(c.name + ' → ' + (stName?stName.t:stage));
}

// ===== HELPERS =====
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function showToast(m) { var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(function(){t.classList.remove('show');},3000); }

// ===== DIRTY TRACKING =====
var isDirty = false;
function markDirty() {
  if (!isDirty) {
    isDirty = true;
    document.getElementById('saveBtn').disabled = false;
  }
}
function resetDirty() {
  isDirty = false;
  document.getElementById('saveBtn').disabled = true;
}

// Attach listeners to all tracked fields
document.addEventListener('DOMContentLoaded', function() { attachTracking(); });
function attachTracking() {
  document.querySelectorAll('.tracked').forEach(function(el) {
    el.addEventListener('input', markDirty);
    el.addEventListener('change', markDirty);
  });
}
// Re-attach after detail loads
var origShowDetail = showDetail;
showDetail = function() { origShowDetail(); setTimeout(attachTracking, 50); };

// ===== IMPORT =====
function handleImport(input) {
  var file = input.files[0];
  if (!file) return;
  input.value = '';

  var ext = file.name.split('.').pop().toLowerCase();

  if (ext === 'csv') {
    var reader = new FileReader();
    reader.onload = function(e) { parseCSV(e.target.result); };
    reader.readAsText(file);
  } else if (ext === 'xlsx' || ext === 'xls') {
    // Load SheetJS from CDN
    if (!window.XLSX) {
      var script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      script.onload = function() { readXLSX(file); };
      document.head.appendChild(script);
    } else {
      readXLSX(file);
    }
  } else {
    showToast('Please use .csv or .xlsx files');
  }
}

function readXLSX(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    var data = new Uint8Array(e.target.result);
    var wb = XLSX.read(data, { type: 'array' });
    var sheet = wb.Sheets[wb.SheetNames[0]];
    var rows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
    processImportRows(rows);
  };
  reader.readAsArrayBuffer(file);
}

function parseCSV(text) {
  var lines = text.split('\n').filter(function(l) { return l.trim(); });
  if (lines.length < 2) { showToast('Empty file'); return; }

  var headers = parseCSVLine(lines[0]);
  var rows = [];
  for (var i = 1; i < lines.length; i++) {
    var vals = parseCSVLine(lines[i]);
    var obj = {};
    headers.forEach(function(h, idx) { obj[h.trim()] = (vals[idx] || '').trim(); });
    rows.push(obj);
  }
  processImportRows(rows);
}

function parseCSVLine(line) {
  var result = [];
  var current = '';
  var inQuotes = false;
  for (var i = 0; i < line.length; i++) {
    var ch = line[i];
    if (ch === '"') { inQuotes = !inQuotes; }
    else if (ch === ',' && !inQuotes) { result.push(current); current = ''; }
    else { current += ch; }
  }
  result.push(current);
  return result;
}

function processImportRows(rows) {
  if (!rows || rows.length === 0) { showToast('No data found'); return; }

  // Map headers flexibly
  var imported = 0;
  var skipped = 0;
  var promises = [];

  rows.forEach(function(row) {
    var name = row['Name *'] || row['Name'] || row['name'] || row['Full Name'] || row['full_name'] || '';
    if (!name) { skipped++; return; }

    var id = 'crm-' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
    var now = new Date().toISOString();

    var contact = {
      id: id,
      name: name,
      email: row['Email'] || row['email'] || row['Email Address'] || '',
      phone: row['Phone'] || row['phone'] || row['Phone Number'] || '',
      type: (row['Type'] || row['type'] || 'other').toLowerCase(),
      customType: row['Custom Type'] || row['custom_type'] || '',
      company: row['Company'] || row['company'] || row['Brokerage'] || row['brokerage'] || '',
      address: row['Address'] || row['address'] || row['Street'] || '',
      city: row['City'] || row['city'] || '',
      state: row['State'] || row['state'] || '',
      zip: row['Zip'] || row['zip'] || row['ZIP'] || '',
      source: row['Source'] || row['source'] || 'import',
      tags: row['Tags'] || row['tags'] || '',
      birthday: row['Birthday'] || row['birthday'] || '',
      spouseName: row['Spouse'] || row['spouse'] || row['Spouse Name'] || '',
      kids: row['Kids'] || row['kids'] || row['Children'] || '',
      employer: row['Employer'] || row['employer'] || '',
      jobTitle: row['Job Title'] || row['job_title'] || row['Title'] || '',
      notes: row['Notes'] || row['notes'] || '',
      website: row['Website'] || row['website'] || row['URL'] || '',
      facebook: row['Facebook'] || row['facebook'] || '',
      instagram: row['Instagram'] || row['instagram'] || '',
      linkedin: row['LinkedIn'] || row['linkedin'] || '',
      tiktok: row['TikTok'] || row['tiktok'] || '',
      pipelineId: '',
      createdAt: now
    };

    // Validate type
    var validTypes = ['client','realtor','title','appraiser','contractor','vendor','other'];
    if (validTypes.indexOf(contact.type) === -1) contact.type = 'other';

    imported++;

    // Add to local list immediately
    allContacts.push({
      id: id, name: contact.name, email: contact.email, phone: contact.phone,
      type: contact.type, custom_type: contact.customType, company: contact.company,
      address: contact.address, city: contact.city, state: contact.state, zip: contact.zip,
      source: contact.source, tags: contact.tags, notes: contact.notes,
      pipeline_id: '', birthday: contact.birthday, spouse_name: contact.spouseName,
      kids: contact.kids, employer: contact.employer, job_title: contact.jobTitle,
      website: contact.website, facebook: contact.facebook, instagram: contact.instagram,
      linkedin: contact.linkedin, tiktok: contact.tiktok,
      created_at: now, updated_at: now
    });

    // Save to Supabase
    promises.push(
      fetch(API + '?action=save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ crm: contact })
      }).catch(function(e) { console.log('Import save error:', e); })
    );
  });

  renderList();
  showToast('Importing ' + imported + ' contacts...' + (skipped > 0 ? ' (' + skipped + ' skipped - no name)' : ''));

  // Wait for all saves to complete
  Promise.all(promises).then(function() {
    showToast('Imported ' + imported + ' contacts!');
    // Reload fresh from Supabase
    setTimeout(loadCRM, 1000);
  });
}
