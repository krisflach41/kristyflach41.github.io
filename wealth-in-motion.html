<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wealth in Motion</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#07090e;--surface:#0d1117;--surface-raised:#131920;--border:rgba(255,255,255,0.05);--border-gold:rgba(186,163,112,0.18);--gold:#baa370;--gold-dim:rgba(186,163,112,0.4);--green:#5ebc8a;--red:#d97373;--blue:#6ba3d6;--blue-btn:#3b82f6;--text:#e8e4dc;--text-mid:rgba(232,228,220,0.6);--text-dim:rgba(232,228,220,0.3);--text-faint:rgba(232,228,220,0.15)}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;min-height:100vh}
.generator-panel{max-width:560px;margin:30px auto;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:28px}
.gen-title{font-size:18px;font-weight:700;margin-bottom:4px}.gen-sub{font-size:11px;color:rgba(255,255,255,0.4);margin-bottom:20px}
.gen-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gen-field{display:flex;flex-direction:column;gap:3px}.gen-field.full{grid-column:1/-1}
.gen-field label{font-size:9px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.5px}
.gen-field input{padding:8px 10px;border-radius:7px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:13px;font-family:inherit}
.gen-field input:focus{outline:none;border-color:rgba(59,130,246,0.4)}.gen-field input::placeholder{color:rgba(255,255,255,0.2)}
.gen-section{font-size:10px;font-weight:700;color:rgba(255,255,255,0.25);text-transform:uppercase;letter-spacing:1px;margin:16px 0 6px;grid-column:1/-1;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)}
.gen-actions{display:flex;gap:8px;margin-top:18px}
.gen-btn{padding:10px 20px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:0.15s}
.gen-btn.primary{background:var(--blue-btn);color:#fff;flex:1}.gen-btn.primary:hover{background:#2563eb}.gen-btn:disabled{opacity:0.5;cursor:wait}
.gen-check{display:flex;align-items:center;gap:8px;grid-column:1/-1}
.gen-check input[type="checkbox"]{width:16px;height:16px;accent-color:var(--blue-btn)}
.gen-check label{font-size:12px;color:rgba(255,255,255,0.5);cursor:pointer}
.gen-error{color:var(--red);font-size:12px;text-align:center;margin-top:10px;display:none}
.gen-loading{display:none;text-align:center;margin-top:12px;color:var(--text-mid);font-size:13px}
.gen-loading .spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.1);border-top-color:var(--blue-btn);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.layout-picker-box{flex:1;border:2px solid rgba(255,255,255,0.1);border-radius:8px;padding:12px;cursor:pointer;transition:0.2s}
.layout-picker-box:hover{border-color:rgba(59,130,246,0.3)}.layout-picker-box.selected{border-color:rgba(59,130,246,0.6);background:rgba(59,130,246,0.08)}
.report-container{display:none;max-width:1060px;margin:20px auto}
.report-nav{display:flex;gap:10px;justify-content:center;margin:16px auto 12px}
.report-nav a,.report-nav button{padding:10px 20px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:0.15s;text-decoration:none}
.report-nav a:hover,.report-nav button:hover{background:rgba(255,255,255,0.1);color:#fff}
.report-nav button.primary{background:var(--blue-btn);border-color:var(--blue-btn);color:#fff}
.report-page{background:var(--surface);color:var(--text);overflow:hidden;border:1px solid var(--border-gold)}
.rpt-hero{padding:52px 64px 48px;border-bottom:1px solid var(--border);position:relative}
.rpt-hero::after{content:'';position:absolute;bottom:0;left:64px;right:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-dim),transparent)}
.rpt-hero-label{font-size:10px;font-weight:600;letter-spacing:2.5px;color:var(--gold);text-transform:uppercase;margin-bottom:14px}
.rpt-hero-subtitle{font-size:12px;color:var(--text-dim);margin-bottom:16px;letter-spacing:0.5px}
.rpt-hero-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--text-mid);line-height:1.35;margin-bottom:6px}
.rpt-hero-sub{font-size:13px;color:var(--text-dim);margin-bottom:20px}
.rpt-hero-punchline{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--gold);margin-bottom:10px;line-height:1.3}
.rpt-hero-headline{font-size:15px;color:var(--text-mid);line-height:1.6;max-width:820px}
.rpt-kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--border)}
.rpt-kpi{padding:22px 24px;border-right:1px solid var(--border);text-align:center}.rpt-kpi:last-child{border-right:none}
.rpt-kpi-label{font-size:9px;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.rpt-kpi-value{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--text)}.rpt-kpi-value.green{color:var(--green)}
.rpt-kpi-detail{font-size:10px;color:var(--text-dim);margin-top:3px}
.rpt-section{padding:40px 64px;border-bottom:1px solid var(--border)}
.rpt-section-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px;position:relative;padding-bottom:16px}
.rpt-section-title::after{content:'';position:absolute;bottom:0;left:0;width:40px;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold-dim));border-radius:1px}
.rpt-section-intro{font-size:13px;color:var(--text-mid);line-height:1.65;margin-top:14px;max-width:780px}
.appr-canvas{width:100%;height:300px;margin-top:24px}
.rpt-table{width:100%;border-collapse:collapse;margin-top:20px}
.rpt-table thead th{padding:10px 12px;text-align:left;font-size:8px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--border-gold);background:var(--surface-raised)}
.rpt-table thead th:not(:first-child){text-align:right}
.rpt-table tbody td{padding:10px 12px;font-size:12px;color:var(--text-mid);border-bottom:1px solid var(--border)}
.rpt-table tbody td:first-child{font-weight:600;color:var(--text)}
.rpt-table tbody td:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.rpt-table tbody tr:hover{background:rgba(255,255,255,0.02)}
.rpt-table tbody td.green{color:var(--green);font-weight:600}
.roi-section{padding:32px 64px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(94,188,138,0.03) 0%,rgba(94,188,138,0.005) 100%)}
.roi-grid{display:grid;grid-template-columns:1fr auto 1fr;gap:0;align-items:center;margin-top:20px}
.roi-card{text-align:center;padding:24px;border-radius:10px}
.roi-card.invest{background:rgba(94,188,138,0.06);border:1px solid rgba(94,188,138,0.12)}
.roi-card.gain{background:rgba(186,163,112,0.06);border:1px solid rgba(186,163,112,0.12)}
.roi-card-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:8px}
.roi-card-value{font-family:'Playfair Display',serif;font-size:28px;font-weight:700}
.roi-card.invest .roi-card-value{color:var(--text)}.roi-card.gain .roi-card-value{color:var(--gold)}
.roi-card-detail{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.4}
.roi-arrow{width:50px;height:50px;border-radius:50%;background:rgba(94,188,138,0.08);border:1px solid rgba(94,188,138,0.12);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;margin:0 16px}
.roi-punchline{text-align:center;margin-top:20px;font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--green)}
.roi-punchline-sub{text-align:center;font-size:12px;color:var(--text-dim);margin-top:6px}
.supercharge{padding:32px 64px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,rgba(186,163,112,0.05) 0%,rgba(186,163,112,0.01) 100%)}
.supercharge-title{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:12px}
.supercharge-text{font-size:14px;color:var(--text-mid);line-height:1.7;max-width:780px}.supercharge-text strong{color:var(--text);font-weight:600}
.philosophy-block{padding:32px 64px;border-bottom:1px solid var(--border);background:var(--surface-raised)}
.philosophy-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--gold);margin-bottom:10px}
.philosophy-text{font-size:13px;color:var(--text-mid);line-height:1.7;max-width:780px}.philosophy-text strong{color:var(--text);font-weight:600}
.rpt-footer{background:var(--surface-raised);padding:28px 64px;border-top:1px solid var(--border)}
.footer-standard{display:flex;justify-content:space-between;align-items:center;gap:30px}
.footer-your-info{display:flex;align-items:center;gap:16px;flex:1}
.footer-headshot{width:64px;height:64px;border-radius:50%;object-fit:cover;border:1px solid var(--border-gold);flex-shrink:0}
.footer-initials{width:44px;height:44px;border-radius:50%;background:var(--surface);border:1px solid var(--border-gold);color:var(--gold);font-family:'Playfair Display',serif;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.footer-details{line-height:1.5}.footer-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px}
.footer-credentials{font-size:10px;color:var(--text-dim);line-height:1.5}
.footer-logos{display:flex;gap:15px;align-items:center;flex-shrink:0}.footer-logo{height:45px;width:auto;object-fit:contain}
.footer-cobrand{display:flex;align-items:center;gap:0}
.footer-person{display:flex;align-items:center;gap:14px;flex:1;padding:0 20px}.footer-person:first-child{padding-left:0}.footer-person:last-child{padding-right:0}
.footer-divider{width:1px;height:50px;background:var(--border);flex-shrink:0}
.footer-company-bar{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.footer-company-bar .footer-company-name{font-size:10px;font-weight:600;color:var(--text-mid)}
.footer-company-bar .footer-company-sub{font-size:9px;color:var(--text-dim)}
.rpt-disclosures{background:var(--bg);padding:14px 64px;font-size:7.5px;color:var(--text-faint);line-height:1.7;text-align:center;border-top:1px solid var(--border);max-width:1060px;margin:0 auto}
.rpt-disc-logos{display:flex;justify-content:center;gap:24px;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.03)}
.rpt-disc-logos span{font-size:8px;font-weight:700;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase}
@media print{body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}.generator-panel,.report-nav{display:none!important}.report-container{display:block!important;margin:0;max-width:100%}.rpt-hero{padding:24px 40px 20px}.rpt-section,.roi-section,.supercharge,.philosophy-block{padding:20px 40px}.rpt-kpi{padding:14px 16px}.rpt-kpi-value{font-size:16px}.rpt-footer{padding:18px 40px}.rpt-disclosures{padding:8px 40px 12px}.report-page,.rpt-footer,.rpt-disclosures,.roi-section,.supercharge,.philosophy-block{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:0.25in;size:letter}}
</style>
<script src="tracking.js"></script><script src="feature-gate.js"></script>
</head>
<body>
<div class="generator-panel" id="generatorPanel">
  <div class="gen-title">Wealth in Motion</div>
  <div class="gen-sub">Your home is already building your future &mdash; show clients how their investment grows over time</div>
  <div class="gen-grid">
    <div class="gen-section">Client Info</div>
    <div class="gen-field full"><label>Client Name</label><input type="text" id="inp_clientName" placeholder="Susie Homebuyer"></div>
    <div class="gen-section">Property Details</div>
    <div class="gen-field full"><label>Property Address or ZIP Code</label><input type="text" id="inp_address" placeholder="123 Main St, Anytown, OH 45001"></div>
    <div class="gen-field"><label>Purchase Price</label><input type="text" id="inp_price" placeholder="359,900" oninput="formatCurrency(this)"></div>
    <div class="gen-field"><label>Down Payment %</label><input type="number" id="inp_downPct" value="10" min="0" max="100" step="0.5"></div>
    <div class="gen-section">Co-Branding (Optional)</div>
    <div class="gen-check"><input type="checkbox" id="inp_cobrand" onchange="toggleCobrand()"><label for="inp_cobrand">Include Realtor Co-Branding</label></div>
    <div id="cobrandFields" style="display:none;grid-column:1/-1;">
      <div style="margin-bottom:14px;"><label style="font-size:9px;font-weight:700;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:8px;">Choose Layout</label><div style="display:flex;gap:10px;"><div class="layout-picker-box selected" id="layoutLeft" onclick="pickLayout('left')" style="flex:1;text-align:center;"><div style="font-size:8px;font-weight:700;color:var(--blue-btn);">Realtor Left</div></div><div class="layout-picker-box" id="layoutRight" onclick="pickLayout('right')" style="flex:1;text-align:center;"><div style="font-size:8px;font-weight:700;color:rgba(255,255,255,0.3);">Realtor Right</div></div></div></div>
      <div class="gen-grid" style="gap:10px;"><div class="gen-field"><label>Realtor Name</label><input type="text" id="inp_realtorName" placeholder="Jane Agent"></div><div class="gen-field"><label>Brokerage</label><input type="text" id="inp_realtorBrokerage" placeholder="Keller Williams"></div><div class="gen-field"><label>Realtor Phone</label><input type="text" id="inp_realtorPhone" placeholder="(555) 123-4567"></div><div class="gen-field"><label>Realtor Email</label><input type="text" id="inp_realtorEmail" placeholder="jane@kw.com"></div></div>
    </div>
  </div>
  <div class="gen-error" id="genError"></div>
  <div class="gen-loading" id="genLoading"><span class="spinner"></span>Fetching live market data...</div>
  <div class="gen-actions"><button class="gen-btn primary" id="genBtn" onclick="generateReport()">Generate Report</button></div>
</div>
<div class="report-container" id="reportContainer">
  <div class="report-nav"><a href="mission-control.html#reports">&larr; Partner Portal</a><button onclick="editReport()">&#9998; Edit Report</button><button class="primary" onclick="window.print()">&#128196; Export PDF</button></div>
  <div class="report-page" id="reportPage">
    <div id="rptHero"></div><div id="rptKpi"></div><div id="rptChart"></div><div id="rptTable"></div><div id="rptRoi"></div><div id="rptSupercharge"></div><div id="rptPhilosophy"></div><div id="rptFooter" class="rpt-footer"></div><div id="rptDisc" class="rpt-disclosures"></div>
  </div>
</div>
<script>
function formatCurrency(el){var v=el.value.replace(/[^0-9]/g,'');if(v)el.value=parseInt(v).toLocaleString()}
function parseCurrency(s){return parseFloat((s||'0').replace(/[^0-9.]/g,''))||0}
function fmtMoney(n){return '$'+Math.round(n).toLocaleString()}
function toggleCobrand(){document.getElementById('cobrandFields').style.display=document.getElementById('inp_cobrand').checked?'block':'none'}
var cobrandLayout='left';
function pickLayout(s){cobrandLayout=s;document.getElementById('layoutLeft').classList.toggle('selected',s==='left');document.getElementById('layoutRight').classList.toggle('selected',s==='right')}
function editReport(){document.getElementById('generatorPanel').style.display='block';document.getElementById('reportContainer').style.display='none'}
function showError(m){var e=document.getElementById('genError');e.textContent=m;e.style.display='block'}
function hideError(){document.getElementById('genError').style.display='none'}

async function generateReport(){
  hideError();
  var clientName=document.getElementById('inp_clientName').value.trim()||'Valued Client';
  var addressInput=document.getElementById('inp_address').value.trim();
  var price=parseCurrency(document.getElementById('inp_price').value);
  var downPct=parseFloat(document.getElementById('inp_downPct').value)||10;
  if(!addressInput){showError('Please enter a property address or ZIP code.');return}
  if(price<10000){showError('Please enter a valid purchase price.');return}
  var zipMatch=addressInput.match(/\b(\d{5})\b/);var zip=zipMatch?zipMatch[1]:'';
  document.getElementById('genLoading').style.display='block';document.getElementById('genBtn').disabled=true;
  var apiData=null;
  try{var u='https://agent-edge-backend.vercel.app/api/buy-vs-rent?';if(zip)u+='zip='+zip+'&';u+='address='+encodeURIComponent(addressInput);var r=await fetch(u);if(r.ok)apiData=await r.json()}catch(e){console.error('API:',e)}
  document.getElementById('genLoading').style.display='none';document.getElementById('genBtn').disabled=false;
  var apprRate=3.5,stateName='',displayAddress=addressInput;
  if(apiData){if(apiData.appreciation)apprRate=apiData.appreciation.oneYear||apiData.appreciation.fiveYear||apiData.appreciation.forecastAnnualRate||3.5;if(apiData.location){stateName=apiData.location.stateName||apiData.location.state||'';if(apiData.location.formattedAddress)displayAddress=apiData.location.formattedAddress}}
  var downAmt=price*downPct/100;
  var years=[];for(var y=0;y<=10;y++){var val=price*Math.pow(1+apprRate/100,y);var gain=val-price;var avgPerYr=y>0?gain/y:0;var roiPct=y>0?(gain/downAmt*100):0;years.push({year:y,value:Math.round(val),gain:Math.round(gain),avgPerYr:Math.round(avgPerYr),roiPct:Math.round(roiPct*10)/10})}
  var yr5=years[5],yr10=years[10];
  var today=new Date();var dateStr=today.toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});
  document.getElementById('rptHero').innerHTML='<div class="rpt-hero"><div class="rpt-hero-label">Wealth in Motion</div><div class="rpt-hero-subtitle">Your Home Is Already Building Your Future</div><div class="rpt-hero-title">'+displayAddress+'</div><div class="rpt-hero-sub">Prepared for '+clientName+' &middot; '+dateStr+'</div><div class="rpt-hero-punchline">Your '+fmtMoney(price)+' home could be worth '+fmtMoney(yr10.value)+' in 10 years.</div><div class="rpt-hero-headline">That\'s +'+fmtMoney(yr10.gain)+' in appreciation &mdash; a '+yr10.roiPct+'% return on your '+fmtMoney(downAmt)+' down payment. Based on the current 1-year appreciation rate for '+(stateName||'your area')+', here\'s how your wealth builds year by year.</div></div>';
  document.getElementById('rptKpi').innerHTML='<div class="rpt-kpi-strip"><div class="rpt-kpi"><div class="rpt-kpi-label">Purchase Price</div><div class="rpt-kpi-value">'+fmtMoney(price)+'</div></div><div class="rpt-kpi"><div class="rpt-kpi-label">Value in 5 Years</div><div class="rpt-kpi-value green">'+fmtMoney(yr5.value)+'</div><div class="rpt-kpi-detail">+'+fmtMoney(yr5.gain)+'</div></div><div class="rpt-kpi"><div class="rpt-kpi-label">Value in 10 Years</div><div class="rpt-kpi-value green">'+fmtMoney(yr10.value)+'</div><div class="rpt-kpi-detail">+'+fmtMoney(yr10.gain)+'</div></div><div class="rpt-kpi"><div class="rpt-kpi-label">Annual Appreciation</div><div class="rpt-kpi-value green">'+apprRate.toFixed(2)+'%</div><div class="rpt-kpi-detail">~'+fmtMoney(Math.round(price*apprRate/100))+'/year</div></div></div>';
  document.getElementById('rptChart').innerHTML='<div class="rpt-section"><div class="rpt-section-title">Your Home\'s Growth Trajectory</div><div class="rpt-section-intro">This chart shows the projected value of your home over 10 years based on current appreciation trends. Every year, your investment grows &mdash; and that growth compounds.</div><canvas id="growthChart" class="appr-canvas" height="300"></canvas></div>';
  var rows='';years.forEach(function(d){if(d.year===0){rows+='<tr><td>Purchase</td><td>'+fmtMoney(d.value)+'</td><td>&mdash;</td><td>&mdash;</td><td>&mdash;</td></tr>'}else{rows+='<tr><td>Year '+d.year+'</td><td>'+fmtMoney(d.value)+'</td><td class="green">+'+fmtMoney(d.gain)+'</td><td class="green">+'+fmtMoney(d.avgPerYr)+'</td><td class="green">+'+d.roiPct+'%</td></tr>'}});
  document.getElementById('rptTable').innerHTML='<div class="rpt-section"><div class="rpt-section-title">Year-by-Year Projection</div><table class="rpt-table"><thead><tr><th>Year</th><th>Projected Value</th><th>Total Appreciation</th><th>Avg/Year</th><th>ROI on Down Payment</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  document.getElementById('rptRoi').innerHTML='<div class="roi-section"><div class="rpt-section-title" style="color:var(--green)">The Power of Your Down Payment</div><div class="roi-grid"><div class="roi-card invest"><div class="roi-card-label">You Invest</div><div class="roi-card-value">'+fmtMoney(downAmt)+'</div><div class="roi-card-detail">Your '+downPct+'% down payment</div></div><div class="roi-arrow">&rarr;</div><div class="roi-card gain"><div class="roi-card-label">Your Home Gains</div><div class="roi-card-value">+'+fmtMoney(yr10.gain)+'</div><div class="roi-card-detail">In 10 years of appreciation</div></div></div><div class="roi-punchline">'+yr10.roiPct+'% return on your investment</div><div class="roi-punchline-sub">That\'s an average of '+fmtMoney(yr10.avgPerYr)+' per year in appreciation alone &mdash; not counting the equity you build with every mortgage payment.</div></div>';

function drawGrowthChart(basePrice,apprRate){
  var canvas=document.getElementById('growthChart');if(!canvas)return;var ctx=canvas.getContext('2d');var dpr=window.devicePixelRatio||1;var rect=canvas.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);var W=rect.width,H=rect.height;var padL=80,padR=40,padT=25,padB=40,cW=W-padL-padR,cH=H-padT-padB;var totalYears=10,values=[];for(var y=0;y<=totalYears;y++)values.push(basePrice*Math.pow(1+apprRate/100,y));var maxV=values[totalYears]*1.08,minV=basePrice*0.95,range=maxV-minV;function xP(y){return padL+(y/totalYears)*cW}function yP(v){return padT+cH-((v-minV)/range)*cH}
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;var step=range>300000?50000:range>150000?25000:range>75000?10000:5000;for(var v=Math.ceil(minV/step)*step;v<=maxV;v+=step){ctx.beginPath();ctx.moveTo(padL,yP(v));ctx.lineTo(W-padR,yP(v));ctx.stroke();ctx.fillStyle='rgba(232,228,220,0.2)';ctx.font='10px DM Sans';ctx.textAlign='right';ctx.fillText('$'+(v/1000).toFixed(0)+'k',padL-8,yP(v)+3)}
  ctx.fillStyle='rgba(232,228,220,0.25)';ctx.font='10px DM Sans';ctx.textAlign='center';for(var y=0;y<=totalYears;y++){ctx.fillText(y===0?'Now':'Yr '+y,xP(y),H-12)}
  ctx.beginPath();ctx.moveTo(xP(0),yP(values[0]));for(var y=1;y<=totalYears;y++)ctx.lineTo(xP(y),yP(values[y]));ctx.lineTo(xP(totalYears),padT+cH);ctx.lineTo(xP(0),padT+cH);ctx.closePath();var grad=ctx.createLinearGradient(0,padT,0,padT+cH);grad.addColorStop(0,'rgba(94,188,138,0.12)');grad.addColorStop(1,'rgba(94,188,138,0.01)');ctx.fillStyle=grad;ctx.fill();
  ctx.beginPath();ctx.strokeStyle='#5ebc8a';ctx.lineWidth=2.5;for(var y=0;y<=totalYears;y++){y===0?ctx.moveTo(xP(y),yP(values[y])):ctx.lineTo(xP(y),yP(values[y]))}ctx.stroke();
  [0,5,10].forEach(function(y){var x=xP(y),yy=yP(values[y]);ctx.beginPath();ctx.arc(x,yy,6,0,Math.PI*2);ctx.fillStyle=y===0?'#5ebc8a':'#baa370';ctx.fill();ctx.beginPath();ctx.arc(x,yy,3,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle=y===0?'rgba(232,228,220,0.6)':'#baa370';ctx.font='bold 12px DM Sans';ctx.textAlign='center';ctx.fillText('$'+(Math.round(values[y])/1000).toFixed(0)+'k',x,yy-14);if(y>0){ctx.font='10px DM Sans';ctx.fillStyle='rgba(94,188,138,0.8)';ctx.fillText('+$'+(Math.round(values[y]-basePrice)/1000).toFixed(0)+'k',x,yy-2)}});
  for(var y=1;y<=totalYears;y++){if(y===5||y===10)continue;var x=xP(y),yy=yP(values[y]);ctx.beginPath();ctx.arc(x,yy,3,0,Math.PI*2);ctx.fillStyle='rgba(94,188,138,0.5)';ctx.fill()}
  [5,10].forEach(function(y){ctx.beginPath();ctx.strokeStyle='rgba(186,163,112,0.2)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.moveTo(xP(y),padT);ctx.lineTo(xP(y),padT+cH);ctx.stroke();ctx.setLineDash([])});
}
