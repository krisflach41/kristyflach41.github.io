/* ===========================
   CART ICON & MODAL STYLES
   Add to your existing <style> section
=========================== */

/* Cart Icon (floating, top-right) */
.cart-icon {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  transition: all 0.25s ease;
  z-index: 10000;
}

.cart-icon:hover {
  transform: scale(1.08);
  background: rgba(255,255,255,0.95);
}

.cart-icon svg {
  width: 24px;
  height: 24px;
  fill: #0b4ea2;
}

.cart-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #c0392b;
  color: white;
  font-size: 11px;
  font-weight: 700;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  border: 2px solid white;
}

/* Cart Modal Overlay */
.cart-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 9998;
}

.cart-overlay.active {
  display: block;
}

/* Cart Modal */
.cart-modal {
  position: fixed;
  top: 50%;
  right: -500px;
  transform: translateY(-50%);
  width: 90%;
  max-width: 480px;
  max-height: 85vh;
  background: white;
  border-radius: 18px 0 0 18px;
  box-shadow: -8px 0 40px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  transition: right 0.3s ease;
  z-index: 9999;
}

.cart-modal.active {
  right: 0;
}

/* Cart Header */
.cart-header {
  padding: 24px;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-header h2 {
  margin: 0;
  font-size: 22px;
  color: #0b1f3a;
}

.cart-close {
  background: none;
  border: none;
  font-size: 28px;
  color: #666;
  cursor: pointer;
  padding: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Cart Body */
.cart-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.cart-empty {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.cart-empty svg {
  width: 64px;
  height: 64px;
  fill: #ddd;
  margin-bottom: 16px;
}

.cart-section {
  margin-bottom: 32px;
}

.cart-section-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #0b4ea2;
  margin-bottom: 12px;
}

.cart-item {
  background: rgba(11,78,162,0.04);
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-item-info {
  flex: 1;
}

.cart-item-name {
  font-weight: 600;
  color: #0b1f3a;
  margin-bottom: 2px;
}

.cart-item-meta {
  font-size: 13px;
  color: #666;
}

.cart-item-remove {
  background: none;
  border: none;
  color: #c0392b;
  cursor: pointer;
  font-size: 20px;
  padding: 4px 8px;
}

/* Cart Footer */
.cart-footer {
  padding: 20px 24px;
  border-top: 1px solid #e0e0e0;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  color: #0b1f3a;
}

.cart-checkout-btn {
  width: 100%;
  padding: 14px;
  background: #0b4ea2;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s ease;
}

.cart-checkout-btn:hover {
  background: #0a3d7f;
}

.cart-clear-btn {
  width: 100%;
  padding: 10px;
  background: transparent;
  color: #c0392b;
  border: 1px solid #c0392b;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.25s ease;
}

.cart-clear-btn:hover {
  background: rgba(192,57,43,0.05);
}

/* Mobile Responsive */
@media (max-width: 640px) {
  .cart-modal {
    max-width: 100%;
    border-radius: 18px 0 0 18px;
  }
}
