<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Websites</title>
<script src="universal-cart.js"></script>
<style>

/* ===== BACKGROUND (PORTAL STYLE) ===== */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 80px 0;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
}

/* ===== PAGE WIDTH ===== */
.page-wrap {
  max-width: 1150px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ===== GLASS CONTAINER ===== */
.gallery-card {
  padding: 60px 50px;
  border-radius: 22px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 20px 55px rgba(0,0,0,0.10),
    0 6px 18px rgba(0,0,0,0.05);
}

/* ===== TITLES ===== */
.section-title {
  font-size: 34px;
  text-align: center;
  margin-bottom: 10px;
}

.section-subtitle {
  text-align: center;
  max-width: 650px;
  margin: 0 auto 50px auto;
  color: #555;
}

/* ===== PROPERTY INPUT ROWS ===== */
.property-row {
  background: rgba(11,78,162,0.04);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 16px;
  position: relative;
}

.remove-prop {
  position: absolute;
  top: 10px;
  right: 15px;
  color: #c0392b;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
}

.section-label {
  font-weight: 600;
  margin-bottom: 6px;
  font-size: 14px;
}

.property-row input,
.property-row textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid #ddd;
  border-radius: 6px;
  margin-bottom: 12px;
  box-sizing: border-box;
  font-family: inherit;
}

.property-row textarea {
  height: 80px;
  resize: vertical;
}

/* ===== ADD TO CART BUTTON ===== */
.add-to-cart-btn {
  display: block;
  margin: 30px auto;
  padding: 14px 32px;
  background: #0b4ea2;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s ease;
}

.add-to-cart-btn:hover {
  background: #0a3d7f;
}

.add-to-cart-btn:disabled {
  background: #999;
  cursor: not-allowed;
}

/* ===== ADD ANOTHER PROPERTY BUTTON ===== */
.add-property-btn {
  display: block;
  margin: 20px auto;
  padding: 10px 20px;
  background: transparent;
  border: 2px dashed #0b4ea2;
  color: #0b4ea2;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s ease;
}

.add-property-btn:hover {
  background: rgba(11,78,162,0.05);
}

/* ===== BACK BUTTON ===== */
.back-btn {
  display: inline-block;
  margin-top: 50px;
  padding: 10px 20px;
  border-radius: 25px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.6);
  text-decoration: none;
  color: #0b1f3a;
  font-weight: 600;
}

/* ===== FLOATING RETURN LINK ===== */
.return-main {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 18px;
  border-radius: 25px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.6);
  text-decoration: none;
  color: #0b1f3a;
  font-weight: 600;
}

/* ===== CART SYSTEM ===== */
.cart-icon {
  position: fixed;
  top: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  transition: all 0.25s ease;
  z-index: 10000;
}

.cart-icon:hover {
  transform: scale(1.08);
  background: rgba(255,255,255,0.95);
}

.cart-icon svg {
  width: 24px;
  height: 24px;
  fill: #0b4ea2;
}

.cart-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  background: #c0392b;
  color: white;
  font-size: 11px;
  font-weight: 700;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
  border: 2px solid white;
}

.cart-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  display: none;
  z-index: 9998;
}

.cart-overlay.active {
  display: block;
}

.cart-modal {
  position: fixed;
  top: 50%;
  right: -500px;
  transform: translateY(-50%);
  width: 90%;
  max-width: 480px;
  max-height: 85vh;
  background: white;
  border-radius: 18px 0 0 18px;
  box-shadow: -8px 0 40px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  transition: right 0.3s ease;
  z-index: 9999;
}

.cart-modal.active {
  right: 0;
}

.cart-header {
  padding: 24px;
  border-bottom: 1px solid #e0e0e0;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-header h2 {
  margin: 0;
  font-size: 22px;
  color: #0b1f3a;
}

.cart-close {
  background: none;
  border: none;
  font-size: 28px;
  color: #666;
  cursor: pointer;
  padding: 0;
  width: 30px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cart-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.cart-empty {
  text-align: center;
  padding: 60px 20px;
  color: #999;
}

.cart-empty svg {
  width: 64px;
  height: 64px;
  fill: #ddd;
  margin-bottom: 16px;
}

.cart-section {
  margin-bottom: 32px;
}

.cart-section-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #0b4ea2;
  margin-bottom: 12px;
}

.cart-item {
  background: rgba(11,78,162,0.04);
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cart-item-info {
  flex: 1;
}

.cart-item-name {
  font-weight: 600;
  color: #0b1f3a;
  margin-bottom: 2px;
}

.cart-item-meta {
  font-size: 13px;
  color: #666;
}

.cart-item-remove {
  background: none;
  border: none;
  color: #c0392b;
  cursor: pointer;
  font-size: 20px;
  padding: 4px 8px;
}

.cart-footer {
  padding: 20px 24px;
  border-top: 1px solid #e0e0e0;
}

.cart-total {
  display: flex;
  justify-content: space-between;
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 16px;
  color: #0b1f3a;
}

.cart-checkout-btn {
  width: 100%;
  padding: 14px;
  background: #0b4ea2;
  color: white;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s ease;
}

.cart-checkout-btn:hover {
  background: #0a3d7f;
}

.cart-clear-btn {
  width: 100%;
  padding: 10px;
  background: transparent;
  color: #c0392b;
  border: 1px solid #c0392b;
  border-radius: 8px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
  transition: 0.25s ease;
}

.cart-clear-btn:hover {
  background: rgba(192,57,43,0.05);
}

/* ===== RESPONSIVE ===== */
html, body {
  overflow-x: hidden;
}

@media (max-width: 640px) {
  .gallery-card {
    padding: 40px 25px;
  }
  
  .section-title {
    font-size: 28px;
  }
  
  .property-row {
    padding: 15px;
  }
}

</style>
</head>

<body>

<div class="page-wrap">
<section class="gallery-card">

<h2 class="section-title">Property Websites</h2>
<p class="section-subtitle">
  Custom single-property websites to showcase your listings with professional design and essential details.
</p>

<div id="properties"></div>

<button type="button" class="add-property-btn" onclick="addNewProperty()">+ Add Another Property</button>

<button type="button" class="add-to-cart-btn" onclick="addToCart()" id="addCartBtn">Add to Cart</button>

<div style="text-align:center;">
  <a href="realtor-marketing-studio.html" class="back-btn">← Back to Marketing Studio</a>
</div>

</section>
</div>

<!-- CART MODAL -->
<div class="cart-icon" onclick="openCart()">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
    <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
  </svg>
  <span class="cart-badge" id="cartBadge">0</span>
</div>

<div class="cart-overlay" id="cartOverlay" onclick="closeCart()"></div>

<div class="cart-modal" id="cartModal">
  <div class="cart-header">
    <h2>My Kit</h2>
    <button class="cart-close" onclick="closeCart()">×</button>
  </div>
  
  <div class="cart-body" id="cartBody">
    <div class="cart-empty">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
      </svg>
      <p>Your kit is empty</p>
      <p style="font-size: 14px; margin-top: 8px;">Browse collections to add materials</p>
    </div>
  </div>
  
  <div class="cart-footer" id="cartFooter" style="display: none;">
    <div class="cart-total">
      <span>Total Items:</span>
      <span id="cartTotalCount">0</span>
    </div>
    <button class="cart-checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
    <button class="cart-clear-btn" onclick="clearCart()">Clear Cart</button>
  </div>
</div>

<a href="portal.html" class="return-main">Return to Agent Edge Partner Portal</a>

<script>
/* ===========================
   PROPERTY WEBSITE SYSTEM
=========================== */

let properties = [];

function addNewProperty() {
  properties.push({ address: "", mls: "", comments: "" });
  renderProperties();
}

function removeProperty(index) {
  properties.splice(index, 1);
  renderProperties();
}

function renderProperties() {
  const container = document.getElementById("properties");
  container.innerHTML = "";
  
  if (properties.length === 0) {
    addNewProperty();
    return;
  }
  
  properties.forEach((prop, i) => {
    container.innerHTML += `
      <div class="property-row">
        <span class="remove-prop" onclick="removeProperty(${i})">Remove</span>
        
        <div class="section-label">Property Address</div>
        <input 
          type="text"
          placeholder="123 Main St, City, State ZIP"
          value="${prop.address || ""}"
          oninput="properties[${i}].address = this.value"
          required
        >
        
        <div class="section-label">MLS #</div>
        <input 
          type="text"
          placeholder="MLS12345"
          value="${prop.mls || ""}"
          oninput="properties[${i}].mls = this.value"
        >
        
        <div class="section-label">Special Comments or Text</div>
        <textarea 
          placeholder="e.g., Open House Sunday 2/15 from 10-2pm, Just Listed, Price Reduced, etc."
          oninput="properties[${i}].comments = this.value"
        >${prop.comments || ""}</textarea>
      </div>
    `;
  });
}

function addToCart() {
  const validProperties = properties.filter(p => p.address.trim() !== "");
  
  if (validProperties.length === 0) {
    alert("Please add at least one property address.");
    return;
  }
  
  // Add properties to universal cart
  universalCart.setWebsites(validProperties);
  
  // Clear local properties and reset form
  properties = [];
  renderProperties();
  
  // Show success feedback
  const btn = document.getElementById('addCartBtn');
  const originalText = btn.textContent;
  btn.textContent = "Added to Cart! ✓";
  btn.style.background = "#28a745";
  
  setTimeout(() => {
    btn.textContent = originalText;
    btn.style.background = "#0b4ea2";
  }, 2000);
}

/* ===========================
   CART FUNCTIONS
=========================== */
function openCart() {
  document.getElementById('cartOverlay').classList.add('active');
  document.getElementById('cartModal').classList.add('active');
  renderCart();
}

function closeCart() {
  document.getElementById('cartOverlay').classList.remove('active');
  document.getElementById('cartModal').classList.remove('active');
}

function renderCart() {
  const body = document.getElementById('cartBody');
  const footer = document.getElementById('cartFooter');
  const totalCount = document.getElementById('cartTotalCount');
  
  const summary = universalCart.getSummary();
  const count = universalCart.getTotalCount();
  
  if (count === 0) {
    body.innerHTML = `
      <div class="cart-empty">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/>
        </svg>
        <p>Your kit is empty</p>
        <p style="font-size: 14px; margin-top: 8px;">Browse collections to add materials</p>
      </div>
    `;
    footer.style.display = 'none';
    return;
  }
  
  let html = '';
  
  summary.forEach(section => {
    html += `<div class="cart-section">`;
    html += `<div class="cart-section-title">${section.collection}</div>`;
    
    section.items.forEach(item => {
      if (item.type === 'flyer') {
        html += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
            </div>
            <button class="cart-item-remove" onclick="removeMarketingItem('${item.name}')">×</button>
          </div>
        `;
      } else if (item.type === 'report') {
        html += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              <div class="cart-item-meta">${item.count} ${item.count === 1 ? 'property' : 'properties'}</div>
            </div>
          </div>
        `;
      } else if (item.type === 'website') {
        html += `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${item.name}</div>
              ${item.mls ? `<div class="cart-item-meta">MLS: ${item.mls}</div>` : ''}
            </div>
          </div>
        `;
      }
    });
    
    html += `</div>`;
  });
  
  body.innerHTML = html;
  footer.style.display = 'block';
  totalCount.textContent = count;
}

function removeMarketingItem(name) {
  universalCart.removeMarketingItem(name);
  renderCart();
}

function clearCart() {
  if (confirm('Are you sure you want to clear your entire cart?')) {
    universalCart.clear();
    renderCart();
  }
}

function proceedToCheckout() {
  sessionStorage.setItem('checkoutCart', JSON.stringify(universalCart.cart));
  window.location.href = 'checkout.html';
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeCart();
  }
});

// Initialize with one property row
addNewProperty();

</script>

</body>
</html>
