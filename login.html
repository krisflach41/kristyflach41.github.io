<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Edge Partner Portal - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== BACKGROUND (PORTAL STYLE) ===== */
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
}

/* ===== LOGIN CONTAINER ===== */
.login-card {
  width: 90%;
  max-width: 420px;
  padding: 50px 40px;
  border-radius: 22px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 20px 55px rgba(0,0,0,0.10),
    0 6px 18px rgba(0,0,0,0.05);
}

/* ===== LOGO/TITLE AREA ===== */
.login-header {
  text-align: center;
  margin-bottom: 40px;
}

.login-title {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #0b1f3a;
}

.login-subtitle {
  font-size: 14px;
  color: #555;
  font-weight: 400;
}

/* ===== FORM INPUTS ===== */
.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  font-size: 14px;
  color: #0b1f3a;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid rgba(11,78,162,0.2);
  border-radius: 8px;
  font-size: 15px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(4px);
  transition: all 0.25s ease;
  box-sizing: border-box;
}

.form-input:focus {
  outline: none;
  border-color: #0b4ea2;
  background: rgba(255,255,255,0.8);
  box-shadow: 0 0 0 3px rgba(11,78,162,0.1);
}

/* ===== LOGIN BUTTON ===== */
.login-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #0b4ea2;
  color: white;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s ease;
  margin-top: 10px;
}

.login-btn:hover {
  background: #0a3d7f;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(11,78,162,0.3);
}

.login-btn:active {
  transform: translateY(0);
}

/* ===== ERROR MESSAGE ===== */
.error-message {
  background: rgba(192,57,43,0.1);
  border: 1px solid rgba(192,57,43,0.3);
  color: #c0392b;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}

.error-message.show {
  display: block;
}

/* ===== BACK TO MAIN SITE LINK ===== */
.back-link {
  text-align: center;
  margin-top: 30px;
  font-size: 14px;
}

.back-link a {
  color: #0b4ea2;
  text-decoration: none;
  font-weight: 600;
  transition: 0.25s ease;
}

.back-link a:hover {
  color: #0a3d7f;
  text-decoration: underline;
}

/* ===== RESPONSIVE ===== */
@media (max-width: 480px) {
  .login-card {
    padding: 40px 30px;
  }
  
  .login-title {
    font-size: 24px;
  }
}
</style>
<script src="tracking.js"></script>
</head>

<body>

<div class="login-card">
  <div class="login-header">
    <h1 class="login-title">Agent Edge Partner Portal</h1>
    <p class="login-subtitle">Sign in to access your resources</p>
  </div>

  <div class="error-message" id="errorMessage">
    Invalid username or password. Please try again.
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input 
        type="email" 
        id="email" 
        class="form-input" 
        placeholder="Enter your email"
        autocomplete="email"
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div style="position:relative;">
        <input 
          type="password" 
          id="password" 
          class="form-input" 
          placeholder="Enter your password"
          autocomplete="current-password"
          required
          style="padding-right:44px;"
        >
        <button type="button" onclick="togglePasswordVisibility()" id="eyeBtn" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:#888;" aria-label="Show password">
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg id="eyeOffIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
    </div>

    <button type="submit" class="login-btn">Sign In</button>
  </form>

  <div class="back-link" style="margin-top: 15px;">
    <a href="forgot-password.html">Forgot your password?</a>
  </div>

  <div class="back-link">
    <a href="index.html">← Back to Main Website</a>
  </div>

  <div style="text-align: center; margin-top: 25px; padding-top: 25px; border-top: 1px solid rgba(11,78,162,0.1);">
    <p style="font-size: 14px; color: #555; margin-bottom: 10px;">Don't have an account?</p>
    <a href="signup.html" style="color: #0b4ea2; text-decoration: none; font-weight: 600; font-size: 15px;">Create Account →</a>
  </div>
</div>

<script src="auth.js"></script>
<script>
// Auto-focus email field
document.getElementById('email').focus();

function togglePasswordVisibility() {
  var pw = document.getElementById('password');
  var eyeOn = document.getElementById('eyeIcon');
  var eyeOff = document.getElementById('eyeOffIcon');
  if (pw.type === 'password') {
    pw.type = 'text';
    eyeOn.style.display = 'none';
    eyeOff.style.display = 'block';
  } else {
    pw.type = 'password';
    eyeOn.style.display = 'block';
    eyeOff.style.display = 'none';
  }
}
</script>

</body>
</html>
