<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password - Agent Edge Partner Portal</title>
<style>
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
}

.change-card {
  width: 90%;
  max-width: 420px;
  padding: 50px 40px;
  border-radius: 22px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 20px 55px rgba(0,0,0,0.10),
    0 6px 18px rgba(0,0,0,0.05);
}

.change-header {
  text-align: center;
  margin-bottom: 35px;
}

.change-title {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #0b1f3a;
}

.change-subtitle {
  font-size: 14px;
  color: #555;
  line-height: 1.5;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  font-size: 14px;
  color: #0b1f3a;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid rgba(11,78,162,0.2);
  border-radius: 8px;
  font-size: 15px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(4px);
  transition: all 0.25s ease;
  box-sizing: border-box;
}

.form-input:focus {
  outline: none;
  border-color: #0b4ea2;
  background: rgba(255,255,255,0.8);
  box-shadow: 0 0 0 3px rgba(11,78,162,0.1);
}

.form-helper {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
}

.change-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #0b4ea2;
  color: white;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s ease;
  margin-top: 10px;
}

.change-btn:hover:not(:disabled) {
  background: #0a3d7f;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(11,78,162,0.3);
}

.change-btn:disabled {
  background: #999;
  cursor: not-allowed;
  opacity: 0.6;
}

.success-message {
  background: rgba(46,204,113,0.1);
  border: 1px solid rgba(46,204,113,0.3);
  color: #27ae60;
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
  text-align: center;
}

.success-message.show {
  display: block;
}

.error-message {
  background: rgba(192,57,43,0.1);
  border: 1px solid rgba(192,57,43,0.3);
  color: #c0392b;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}

.error-message.show {
  display: block;
}

@media (max-width: 480px) {
  .change-card { padding: 40px 25px; }
  .change-title { font-size: 24px; }
}
</style>
</head>

<body>

<div class="change-card">
  <div class="change-header">
    <h1 class="change-title">Create New Password</h1>
    <p class="change-subtitle">You logged in with a temporary password. Please create a new password to continue.</p>
  </div>

  <div class="success-message" id="successMessage">
    Password updated! Redirecting to portal...
  </div>

  <div class="error-message" id="errorMessage"></div>

  <form id="changeForm">
    <div class="form-group">
      <label class="form-label" for="newPassword">New Password</label>
      <input 
        type="password" 
        id="newPassword" 
        class="form-input" 
        placeholder="Choose a new password"
        autocomplete="new-password"
        required
      >
      <div class="form-helper">At least 6 characters.</div>
    </div>

    <div class="form-group">
      <label class="form-label" for="confirmPassword">Confirm New Password</label>
      <input 
        type="password" 
        id="confirmPassword" 
        class="form-input" 
        placeholder="Re-enter your new password"
        autocomplete="new-password"
        required
      >
    </div>

    <button type="submit" class="change-btn" id="changeBtn">Set New Password</button>
  </form>
</div>

<script src="auth.js"></script>
<script>
// Must be authenticated and have temp password flag
if (!isAuthenticated() || sessionStorage.getItem('agentEdgeTempPassword') !== 'true') {
  window.location.href = 'login.html';
}

var changeForm = document.getElementById('changeForm');
var errorMessage = document.getElementById('errorMessage');
var successMessage = document.getElementById('successMessage');
var changeBtn = document.getElementById('changeBtn');

changeForm.addEventListener('submit', async function(e) {
  e.preventDefault();

  var newPassword = document.getElementById('newPassword').value;
  var confirmPassword = document.getElementById('confirmPassword').value;
  var username = getCurrentUser();

  errorMessage.classList.remove('show');
  successMessage.classList.remove('show');

  if (newPassword.length < 6) {
    errorMessage.textContent = 'Password must be at least 6 characters.';
    errorMessage.classList.add('show');
    return;
  }

  if (newPassword !== confirmPassword) {
    errorMessage.textContent = 'Passwords do not match.';
    errorMessage.classList.add('show');
    document.getElementById('confirmPassword').value = '';
    return;
  }

  changeBtn.disabled = true;
  changeBtn.textContent = 'Updating...';

  try {
    var response = await fetch('https://agent-edge-backend.vercel.app/api/change-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: username, newPassword: newPassword })
    });

    var data = await response.json();

    if (data.success) {
      // Clear temp password flag
      sessionStorage.removeItem('agentEdgeTempPassword');

      successMessage.classList.add('show');
      changeForm.style.display = 'none';

      setTimeout(function() {
        window.location.href = 'portal.html';
      }, 2000);
    } else {
      errorMessage.textContent = data.message || 'Failed to update password. Please try again.';
      errorMessage.classList.add('show');
      changeBtn.disabled = false;
      changeBtn.textContent = 'Set New Password';
    }
  } catch (error) {
    console.error('Change password error:', error);
    errorMessage.textContent = 'Connection error. Please try again.';
    errorMessage.classList.add('show');
    changeBtn.disabled = false;
    changeBtn.textContent = 'Set New Password';
  }
});

// Password match indicator
document.getElementById('confirmPassword').addEventListener('input', function() {
  var password = document.getElementById('newPassword').value;
  if (this.value && password !== this.value) {
    this.style.borderColor = '#c0392b';
  } else {
    this.style.borderColor = 'rgba(11,78,162,0.2)';
  }
});
</script>

</body>
</html>
