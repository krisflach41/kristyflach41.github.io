<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Video Call - Kristy Flach</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center/cover no-repeat fixed;
  color: #0b1f3a;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* JOIN LOBBY */
.join-lobby {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  min-height: 100vh; padding: 40px 20px;
}
.join-lobby.hidden { display: none; }

.join-card {
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.7);
  border-radius: 22px; padding: 50px;
  max-width: 460px; width: 100%; text-align: center;
  box-shadow: 0 20px 55px rgba(0,0,0,0.1);
}

.join-logo {
  font-family: 'Playfair Display', serif;
  font-size: 13px; color: #6e7f77;
  text-transform: uppercase; letter-spacing: 3px; margin-bottom: 28px;
}
.join-title { font-family: 'Playfair Display', serif; font-size: 28px; color: #002556; margin-bottom: 8px; }
.join-subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }

.name-input, .code-input {
  width: 100%; padding: 14px 16px;
  border: 1px solid rgba(110,127,119,0.25);
  border-radius: 10px; font-size: 15px;
  color: #002556; background: rgba(255,255,255,0.85);
  font-family: inherit; margin-bottom: 14px;
  transition: border-color 0.2s;
}
.name-input:focus, .code-input:focus { outline: none; border-color: #6e7f77; }

.code-input {
  font-family: 'Courier New', monospace;
  font-size: 28px; font-weight: 700;
  text-align: center; letter-spacing: 6px;
}
.code-input::placeholder { color: #bbb; font-size: 16px; letter-spacing: 1px; }

.join-btn {
  display: block; width: 100%; padding: 16px;
  border: none; border-radius: 12px; background: #6e7f77;
  color: white; font-weight: 700; font-size: 16px;
  cursor: pointer; transition: all 0.25s; font-family: inherit;
}
.join-btn:hover { background: #556b62; }
.join-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.join-error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }
.join-error.show { display: block; }

/* CALL VIEW */
.call-view { display: none; flex-direction: column; height: 100vh; }
.call-view.active { display: flex; }

.call-header {
  text-align: center; padding: 10px;
  background: #0b1f3a; color: rgba(200,204,212,0.7);
  font-size: 13px;
}
.call-header strong { color: #e8dcc8; }

.daily-frame { flex: 1; border: none; background: #000; min-height: 0; }

.leave-bar {
  display: flex; justify-content: center;
  padding: 12px; background: #0b1f3a;
  border-top: 1px solid rgba(110,127,119,0.1);
}
.leave-btn {
  padding: 10px 32px; border: none; border-radius: 20px;
  background: #ef4444; color: white; font-weight: 700;
  font-size: 14px; cursor: pointer;
}
.leave-btn:hover { background: #dc2626; }
</style>
</head>
<body>

<!-- JOIN LOBBY -->
<div class="join-lobby" id="joinLobby">
  <div class="join-card">
    <div class="join-logo">Kristy Flach · Agent Edge</div>
    <h1 class="join-title">Join Video Call</h1>
    <p class="join-subtitle">Enter your name and the 5-digit code your loan officer gave you</p>

    <input type="text" class="name-input" id="borrowerName" placeholder="Your name">

    <input type="text" class="code-input" id="codeInput" placeholder="00000" maxlength="5" inputmode="numeric" autocomplete="off">

    <button class="join-btn" id="joinBtn" onclick="joinRoom()">Join Call</button>
    <div class="join-error" id="joinError"></div>

    <a href="index.html" style="display:inline-block;margin-top:20px;font-size:13px;color:#6e7f77;text-decoration:none;font-weight:600;">← Back to Main Website</a>
  </div>
</div>

<!-- CALL VIEW -->
<div class="call-view" id="callView">
  <div class="call-header">
    Connected with <strong id="loNameDisplay">your loan officer</strong> &nbsp;·&nbsp; To leave, click the button below
  </div>
  <iframe id="dailyFrame" class="daily-frame" allow="camera; microphone; fullscreen; display-capture; autoplay" allowfullscreen></iframe>
  <div class="leave-bar">
    <button class="leave-btn" onclick="leaveCall()">Leave Call</button>
  </div>
</div>

<script>
var API_BASE = 'https://agent-edge-backend.vercel.app/api/video-call';

document.getElementById('codeInput').addEventListener('input', function(e) {
  e.target.value = e.target.value.replace(/[^0-9]/g, '');
});

async function joinRoom() {
  var code = document.getElementById('codeInput').value.trim();
  var name = document.getElementById('borrowerName').value.trim() || 'Borrower';
  var errEl = document.getElementById('joinError');
  errEl.classList.remove('show');

  if (code.length < 5) {
    errEl.textContent = 'Please enter the 5-digit room code.';
    errEl.classList.add('show');
    return;
  }

  var btn = document.getElementById('joinBtn');
  btn.disabled = true;
  btn.textContent = 'Joining...';

  try {
    var resp = await fetch(API_BASE, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'join-room', room_code: code })
    });
    var data = await resp.json();

    if (!data.success) {
      errEl.textContent = data.message || 'Room not found. Check your code and try again.';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Join Call';
      return;
    }

    document.getElementById('loNameDisplay').textContent = data.lo_name || 'your loan officer';
    document.getElementById('dailyFrame').src = data.room_url;

    document.getElementById('joinLobby').classList.add('hidden');
    document.getElementById('callView').classList.add('active');

  } catch (err) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Join Call';
  }
}

function leaveCall() {
  document.getElementById('dailyFrame').src = '';
  document.getElementById('callView').classList.remove('active');
  document.getElementById('joinLobby').classList.remove('hidden');

  var card = document.querySelector('.join-card');
  card.innerHTML =
    '<div class="join-logo">Kristy Flach · Agent Edge</div>' +
    '<h1 class="join-title">Call Ended</h1>' +
    '<p class="join-subtitle" style="margin-bottom:30px;">Thank you for connecting with Kristy.</p>' +
    '<a href="index.html" class="join-btn" style="display:block;text-align:center;text-decoration:none;">Back to Main Website</a>' +
    '<button class="join-btn" onclick="location.reload()" style="background:transparent;color:#6e7f77;border:2px solid #6e7f77;margin-top:10px;">Rejoin a Call</button>';
}
</script>
</body>
</html>
