<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Queue - Mission Control</title>
<script src="auth.js"></script>

<style>
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 40px 24px 80px;
  min-height: 100vh;
  background: linear-gradient(135deg, #0b1f3a 0%, #132d54 50%, #0b1f3a 100%);
  color: #e8ecf1;
}

.page-header {
  max-width: 1000px;
  margin: 0 auto 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.page-title {
  font-size: 28px;
  font-weight: 700;
  color: #fff;
}

.page-subtitle {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-top: 4px;
}

.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.refresh-btn {
  padding: 10px 20px;
  border-radius: 8px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.12);
  color: rgba(255,255,255,0.7);
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: 0.25s ease;
}

.refresh-btn:hover {
  background: rgba(255,255,255,0.14);
  color: #fff;
}

/* ===== FILTER TABS ===== */
.filter-tabs {
  max-width: 1000px;
  margin: 0 auto 24px;
  display: flex;
  gap: 8px;
}

.filter-tab {
  padding: 8px 18px;
  border-radius: 20px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.5);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s ease;
}

.filter-tab:hover {
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.8);
}

.filter-tab.active {
  background: rgba(255,255,255,0.14);
  border-color: rgba(255,255,255,0.2);
  color: #fff;
}

.filter-count {
  display: inline-block;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  border-radius: 9px;
  font-size: 11px;
  font-weight: 700;
  margin-left: 6px;
  padding: 0 5px;
}

.filter-tab.active .filter-count {
  background: #3498db;
  color: #fff;
}

/* ===== ORDER CARDS ===== */
.orders-container {
  max-width: 1000px;
  margin: 0 auto;
}

.order-card {
  padding: 24px 28px;
  border-radius: 14px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 14px;
  transition: 0.25s ease;
}

.order-card:hover {
  background: rgba(255,255,255,0.07);
  border-color: rgba(255,255,255,0.12);
}

.order-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}

.order-id {
  font-size: 13px;
  font-weight: 700;
  color: #3498db;
  letter-spacing: 0.5px;
}

.order-time {
  font-size: 12px;
  color: rgba(255,255,255,0.35);
}

.order-client {
  margin-bottom: 14px;
}

.client-name {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
}

.client-meta {
  font-size: 13px;
  color: rgba(255,255,255,0.45);
  margin-top: 2px;
}

.order-items {
  margin-bottom: 16px;
}

.order-item {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  font-size: 12px;
  color: rgba(255,255,255,0.7);
  margin-right: 6px;
  margin-bottom: 6px;
}

.order-notes {
  font-size: 13px;
  color: rgba(255,255,255,0.4);
  font-style: italic;
  margin-bottom: 14px;
  padding: 10px 14px;
  background: rgba(255,255,255,0.03);
  border-radius: 6px;
}

.order-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.status-badge {
  display: inline-block;
  padding: 5px 14px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.status-new {
  background: rgba(52,152,219,0.15);
  color: #3498db;
}

.status-inprogress {
  background: rgba(230,126,34,0.15);
  color: #e67e22;
}

.status-complete {
  background: rgba(39,174,96,0.15);
  color: #27ae60;
}

.status-select {
  padding: 6px 12px;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: #e8ecf1;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}

.branding-badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(155,89,182,0.12);
  color: #9b59b6;
  margin-left: 8px;
}

/* ===== EMPTY STATE ===== */
.empty-state {
  text-align: center;
  padding: 80px 20px;
}

.empty-state-icon {
  font-size: 48px;
  margin-bottom: 20px;
}

.empty-state h2 {
  color: rgba(255,255,255,0.6);
  font-size: 20px;
  margin-bottom: 8px;
}

.empty-state p {
  color: rgba(255,255,255,0.3);
  font-size: 14px;
}

/* ===== LOADING ===== */
.loading {
  text-align: center;
  padding: 60px 20px;
  color: rgba(255,255,255,0.4);
}

.loading-spinner {
  display: inline-block;
  width: 30px;
  height: 30px;
  border: 3px solid rgba(255,255,255,0.1);
  border-top-color: #3498db;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ===== RETURN LINK ===== */
.return-link {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 18px;
  border-radius: 25px;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.12);
  text-decoration: none;
  color: rgba(255,255,255,0.6);
  font-weight: 600;
  font-size: 13px;
  transition: 0.25s ease;
}

.return-link:hover {
  background: rgba(255,255,255,0.14);
  color: #fff;
}

@media (max-width: 600px) {
  .page-header { flex-direction: column; align-items: flex-start; gap: 12px; }
  .filter-tabs { flex-wrap: wrap; }
  .order-footer { flex-direction: column; gap: 10px; align-items: flex-start; }
}
</style>
</head>

<body>

<div class="page-header">
  <div>
    <h1 class="page-title">📋 Order Queue</h1>
    <p class="page-subtitle">Incoming requests from your partner agents</p>
  </div>
  <div class="header-actions">
    <span id="orderCount" style="font-size: 13px; color: rgba(255,255,255,0.4);"></span>
    <button class="refresh-btn" onclick="loadOrders()">↻ Refresh</button>
  </div>
</div>

<div class="filter-tabs" id="filterTabs">
  <div class="filter-tab active" data-filter="all" onclick="filterOrders('all', this)">
    All <span class="filter-count" id="countAll">0</span>
  </div>
  <div class="filter-tab" data-filter="New" onclick="filterOrders('New', this)">
    New <span class="filter-count" id="countNew">0</span>
  </div>
  <div class="filter-tab" data-filter="In Progress" onclick="filterOrders('In Progress', this)">
    In Progress <span class="filter-count" id="countInProgress">0</span>
  </div>
  <div class="filter-tab" data-filter="Complete" onclick="filterOrders('Complete', this)">
    Complete <span class="filter-count" id="countComplete">0</span>
  </div>
</div>

<div class="orders-container" id="ordersContainer">
  <div class="loading">
    <div class="loading-spinner"></div>
    <p>Loading orders...</p>
  </div>
</div>

<a href="admin.html" class="return-link">← Back to Mission Control</a>

<script>
// Protect page - must be logged in + admin
protectPage();
if (sessionStorage.getItem('agentEdgeAdmin') !== 'true') {
  window.location.href = 'portal.html';
}

var allOrders = [];
var currentFilter = 'all';

function loadOrders() {
  // Load from localStorage (synced from Google Sheets)
  // For now, we'll read from a cached version
  var cached = localStorage.getItem('agentEdgeOrders');
  
  if (cached) {
    allOrders = JSON.parse(cached);
    renderOrders();
  } else {
    // Show empty state if no orders yet
    allOrders = [];
    renderOrders();
  }
  
  // Also try to fetch from the sheet via API
  fetchOrdersFromSheet();
}

async function fetchOrdersFromSheet() {
  try {
    // Use the Google Sheets public CSV endpoint
    var sheetId = '1GTJy_IilOPiGNaJ3YxRS8UnY5iBZPiHpF2Nhbt0Zt4A';
    var url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/gviz/tq?tqx=out:json&sheet=Orders';
    
    var response = await fetch(url);
    var text = await response.text();
    
    // Parse Google Sheets JSON response (it wraps it in a callback)
    var jsonStr = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);/);
    if (!jsonStr) return;
    
    var json = JSON.parse(jsonStr[1]);
    var rows = json.table.rows;
    var cols = json.table.cols;
    
    if (!rows || rows.length === 0) return;
    
    allOrders = rows.map(function(row) {
      return {
        orderId: (row.c[0] && row.c[0].v) || '',
        timestamp: (row.c[1] && row.c[1].v) || '',
        name: (row.c[2] && row.c[2].v) || '',
        email: (row.c[3] && row.c[3].v) || '',
        brokerage: (row.c[4] && row.c[4].v) || '',
        branding: (row.c[5] && row.c[5].v) || '',
        items: (row.c[6] && row.c[6].v) || '',
        itemCount: (row.c[7] && row.c[7].v) || 0,
        notes: (row.c[8] && row.c[8].v) || '',
        status: (row.c[9] && row.c[9].v) || 'New',
        cartJson: (row.c[10] && row.c[10].v) || ''
      };
    }).filter(function(order) {
      return order.orderId && order.orderId !== 'Order ID';
    });
    
    // Reverse so newest first
    allOrders.reverse();
    
    // Cache locally
    localStorage.setItem('agentEdgeOrders', JSON.stringify(allOrders));
    
    renderOrders();
    
  } catch (error) {
    console.log('Could not fetch orders from sheet:', error);
  }
}

function renderOrders() {
  var container = document.getElementById('ordersContainer');
  
  // Filter
  var filtered = currentFilter === 'all' 
    ? allOrders 
    : allOrders.filter(function(o) { return o.status === currentFilter; });
  
  // Update counts
  document.getElementById('countAll').textContent = allOrders.length;
  document.getElementById('countNew').textContent = allOrders.filter(function(o) { return o.status === 'New'; }).length;
  document.getElementById('countInProgress').textContent = allOrders.filter(function(o) { return o.status === 'In Progress'; }).length;
  document.getElementById('countComplete').textContent = allOrders.filter(function(o) { return o.status === 'Complete'; }).length;
  
  document.getElementById('orderCount').textContent = allOrders.length + ' total orders';
  
  if (filtered.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">📭</div>
        <h2>${currentFilter === 'all' ? 'No orders yet' : 'No ' + currentFilter.toLowerCase() + ' orders'}</h2>
        <p>${currentFilter === 'all' ? 'Orders will appear here when realtors submit requests through checkout.' : 'Try a different filter.'}</p>
      </div>
    `;
    return;
  }
  
  var html = '';
  
  filtered.forEach(function(order, index) {
    var statusClass = order.status === 'New' ? 'status-new' : 
                      order.status === 'In Progress' ? 'status-inprogress' : 'status-complete';
    
    // Parse items
    var itemsHtml = '';
    if (order.items) {
      order.items.split(' | ').forEach(function(item) {
        itemsHtml += '<span class="order-item">' + item.trim() + '</span>';
      });
    }
    
    html += `
      <div class="order-card" data-order-id="${order.orderId}">
        <div class="order-header">
          <span class="order-id">${order.orderId}</span>
          <span class="order-time">${order.timestamp}</span>
        </div>
        
        <div class="order-client">
          <div class="client-name">${order.name}
            ${order.branding ? '<span class="branding-badge">' + order.branding + '</span>' : ''}
          </div>
          <div class="client-meta">${order.email} · ${order.brokerage}</div>
        </div>
        
        <div class="order-items">${itemsHtml}</div>
        
        ${order.notes ? '<div class="order-notes">"' + order.notes + '"</div>' : ''}
        
        <div class="order-footer">
          <span class="status-badge ${statusClass}">${order.status}</span>
          <select class="status-select" onchange="updateStatus('${order.orderId}', this.value, ${index})">
            <option value="New" ${order.status === 'New' ? 'selected' : ''}>New</option>
            <option value="In Progress" ${order.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
            <option value="Complete" ${order.status === 'Complete' ? 'selected' : ''}>Complete</option>
          </select>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

function filterOrders(filter, tab) {
  currentFilter = filter;
  
  document.querySelectorAll('.filter-tab').forEach(function(t) {
    t.classList.remove('active');
  });
  tab.classList.add('active');
  
  renderOrders();
}

function updateStatus(orderId, newStatus, index) {
  // Update locally
  var order = allOrders.find(function(o) { return o.orderId === orderId; });
  if (order) {
    order.status = newStatus;
    localStorage.setItem('agentEdgeOrders', JSON.stringify(allOrders));
    renderOrders();
  }
  
  // Note: To update the Google Sheet, we'd need a separate endpoint.
  // For now, status changes are local. We'll build sheet-sync later.
}

// Load on page open
loadOrders();
</script>

</body>
</html>
