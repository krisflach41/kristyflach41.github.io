<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Library - Education Collection</title>

<style>

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 80px 0;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
  line-height: 1.7;
}

.page-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 24px;
}

.content-section {
  padding: 60px 50px;
  border-radius: 22px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 20px 55px rgba(0,0,0,0.10),
    0 6px 18px rgba(0,0,0,0.05);
}

.page-header {
  text-align: center;
  margin-bottom: 50px;
}

.page-title {
  font-size: 36px;
  margin-bottom: 10px;
  color: #002556;
}

.page-subtitle {
  font-size: 16px;
  color: #555;
  max-width: 650px;
  margin: 0 auto;
  line-height: 1.6;
}

/* ===== VIDEO GRID ===== */
.video-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 30px;
  margin-bottom: 20px;
}

.video-container {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
  border-radius: 16px;
  box-shadow: 0 12px 35px rgba(0,0,0,0.12);
  transition: all 0.3s ease;
}

.video-container:hover {
  transform: translateY(-4px);
  box-shadow: 0 18px 50px rgba(0,0,0,0.18);
}

.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 16px;
}

/* ===== BACK LINK ===== */
.back-link {
  text-align: center;
  margin-top: 40px;
}

.back-link a {
  display: inline-block;
  padding: 12px 28px;
  border-radius: 25px;
  background: rgba(255,255,255,0.35);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.6);
  text-decoration: none;
  color: #0b1f3a;
  font-weight: 600;
  font-size: 14px;
  transition: all 0.25s ease;
}

.back-link a:hover {
  background: rgba(255,255,255,0.55);
  transform: translateY(-2px);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .content-section {
    padding: 40px 25px;
  }

  .page-title {
    font-size: 28px;
  }

  .video-grid {
    grid-template-columns: 1fr;
  }
}

</style>
<script src="tracking.js"></script>
<script src="feature-gate.js"></script>
</head>

<body>
<div class="page-wrap">
  <div class="content-section">

    <header class="page-header">
      <h1 class="page-title">Video Library</h1>
      <p class="page-subtitle">Educational video content to share with clients and support your conversations</p>
    </header>

    <div class="video-grid">

      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      </div>

      <div class="video-container">
        <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
      </div>

    </div>

    <div class="back-link">
      <a href="education-collection.html">← Back to Education Collection</a>
    </div>

  </div>
</div>
</body>
</html>
