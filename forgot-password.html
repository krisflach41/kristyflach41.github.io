<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Agent Edge Partner Portal</title>
<style>
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  margin: 0;
  padding: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.65)),
    url("portal-bg.jpg") center / cover no-repeat fixed;
  color: #0b1f3a;
}

.reset-card {
  width: 90%;
  max-width: 420px;
  padding: 50px 40px;
  border-radius: 22px;
  background: rgba(255,255,255,0.58);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.65);
  box-shadow:
    0 20px 55px rgba(0,0,0,0.10),
    0 6px 18px rgba(0,0,0,0.05);
}

.reset-header {
  text-align: center;
  margin-bottom: 35px;
}

.reset-title {
  font-size: 28px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #0b1f3a;
}

.reset-subtitle {
  font-size: 14px;
  color: #555;
}

.form-group {
  margin-bottom: 20px;
}

.form-label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  font-size: 14px;
  color: #0b1f3a;
}

.form-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid rgba(11,78,162,0.2);
  border-radius: 8px;
  font-size: 15px;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(4px);
  transition: all 0.25s ease;
  box-sizing: border-box;
}

.form-input:focus {
  outline: none;
  border-color: #0b4ea2;
  background: rgba(255,255,255,0.8);
  box-shadow: 0 0 0 3px rgba(11,78,162,0.1);
}

.reset-btn {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #0b4ea2;
  color: white;
  font-weight: 600;
  font-size: 16px;
  cursor: pointer;
  transition: 0.25s ease;
  margin-top: 10px;
}

.reset-btn:hover:not(:disabled) {
  background: #0a3d7f;
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(11,78,162,0.3);
}

.reset-btn:disabled {
  background: #999;
  cursor: not-allowed;
  opacity: 0.6;
}

.success-message {
  background: rgba(46,204,113,0.1);
  border: 1px solid rgba(46,204,113,0.3);
  color: #27ae60;
  padding: 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  line-height: 1.6;
  display: none;
  text-align: center;
}

.success-message.show {
  display: block;
}

.error-message {
  background: rgba(192,57,43,0.1);
  border: 1px solid rgba(192,57,43,0.3);
  color: #c0392b;
  padding: 12px 16px;
  border-radius: 8px;
  margin-bottom: 20px;
  font-size: 14px;
  display: none;
}

.error-message.show {
  display: block;
}

.back-link {
  text-align: center;
  margin-top: 25px;
  font-size: 14px;
}

.back-link a {
  color: #0b4ea2;
  text-decoration: none;
  font-weight: 600;
  transition: 0.25s ease;
}

.back-link a:hover {
  color: #0a3d7f;
  text-decoration: underline;
}

@media (max-width: 480px) {
  .reset-card { padding: 40px 25px; }
  .reset-title { font-size: 24px; }
}
</style>
<script src="tracking.js"></script>
</head>

<body>

<div class="reset-card">
  <div class="reset-header">
    <h1 class="reset-title">Reset Your Password</h1>
    <p class="reset-subtitle">Enter the email address associated with your account</p>
  </div>

  <div class="success-message" id="successMessage">
    <strong>Check your inbox!</strong><br>
    If an account exists with that email, we've sent a temporary password. Use it to log in, then you'll be prompted to create a new password.
  </div>

  <div class="error-message" id="errorMessage"></div>

  <form id="resetForm">
    <div class="form-group">
      <label class="form-label" for="resetEmail">Email Address</label>
      <input 
        type="email" 
        id="resetEmail" 
        class="form-input" 
        placeholder="Enter your email"
        required
      >
    </div>

    <button type="submit" class="reset-btn" id="resetBtn">Send Reset Email</button>
  </form>

  <div class="back-link">
    <a href="login.html">&larr; Back to Login</a>
  </div>
</div>

<script>
var resetForm = document.getElementById('resetForm');
var errorMessage = document.getElementById('errorMessage');
var successMessage = document.getElementById('successMessage');
var resetBtn = document.getElementById('resetBtn');

resetForm.addEventListener('submit', async function(e) {
  e.preventDefault();

  var email = document.getElementById('resetEmail').value.trim();

  errorMessage.classList.remove('show');
  successMessage.classList.remove('show');
  resetBtn.disabled = true;
  resetBtn.textContent = 'Sending...';

  try {
    var response = await fetch('https://agent-edge-backend.vercel.app/api/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });

    var data = await response.json();

    // Always show success (don't reveal if email exists)
    successMessage.classList.add('show');
    resetForm.style.display = 'none';

  } catch (error) {
    console.error('Reset error:', error);
    errorMessage.textContent = 'Connection error. Please try again.';
    errorMessage.classList.add('show');
    resetBtn.disabled = false;
    resetBtn.textContent = 'Send Reset Email';
  }
});
</script>

</body>
</html>
